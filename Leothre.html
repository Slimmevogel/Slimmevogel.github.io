<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Line Defense</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#fff;
    color:#000;
}

button,input{font:inherit}

#game{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
}

/* TOP BAR */
#topbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
    padding:6px;
    z-index:20;
    border-bottom:1px solid #000;
}

#title{
    font-weight:bold;
    margin-right:6px;
}

.stat{
    border:1px solid #000;
    padding:2px 6px;
}

.topBtn{
    border:1px solid #000;
    background:#fff;
    padding:3px 8px;
}

.topBtn:hover{
    background:#eee;
}

#speedWrap{
    display:flex;
    align-items:center;
    gap:4px;
    border:1px solid #000;
    padding:2px 6px;
}

#speedWrap input[type=range]{
    width:80px;
}

#speedLabel{
    min-width:20px;
    text-align:center;
}

#autoWrap{
    display:flex;
    align-items:center;
    gap:4px;
    border:1px solid #000;
    padding:2px 6px;
}

#spacer{
    flex:1;
}

/* MAIN */
#main{
    flex:1;
    min-height:0;
    display:flex;
}

#canvasWrap{
    position:relative;
    flex:1;
    min-width:0;
    overflow:hidden;
    background:#fff;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* TOWER PANEL */
#towerPanel{
    width:280px;
    flex:0 0 280px;
    border-left:1px solid #000;
    display:flex;
    flex-direction:column;
    z-index:15;
    background:#fff;
}

#towerHeader{
    padding:8px;
    border-bottom:1px solid #000;
}

#towerHeader h2{
    margin:0 0 6px;
    font-size:15px;
}

#filters{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
}

.filterBtn{
    border:1px solid #000;
    background:#fff;
    padding:3px 7px;
    font-size:11px;
}

.filterBtn.active{
    background:#000;
    color:#fff;
}

#towerList{
    flex:1;
    overflow-y:auto;
    padding:6px;
}

.towerCard{
    border:1px solid #000;
    padding:7px;
    margin-bottom:6px;
    cursor:pointer;
}

.towerCard:hover{
    background:#f2f2f2;
}

.towerCard.selected{
    background:#e6e6e6;
    border-width:2px;
}

.towerCard.disabled{
    opacity:.4;
    cursor:not-allowed;
}

.towerTop{
    display:flex;
    align-items:center;
    gap:7px;
}

.towerIcon{
    width:26px;
    height:26px;
    border:1px solid #000;
    display:grid;
    place-items:center;
    font-weight:bold;
    font-size:13px;
    flex:0 0 26px;
}

.towerName{
    font-weight:bold;
    flex:1;
    font-size:13px;
}

.limit{
    font-size:11px;
}

.towerDesc{
    font-size:11px;
    margin-top:4px;
    line-height:1.3;
}

.towerCost{
    margin-top:5px;
    font-size:11px;
}

/* SELECTED INFO */
#selectedInfo{
    position:absolute;
    left:8px;
    top:8px;
    background:#fff;
    border:1px solid #000;
    padding:9px;
    width:225px;
    z-index:8;
    display:none;
    font-size:12px;
}

#selectedInfo b{
    display:block;
    margin-bottom:5px;
    font-size:14px;
}

#selectedInfo .row{
    margin-bottom:3px;
}

.pathBox{
    border:1px solid #000;
    padding:6px;
    margin-top:7px;
}

.pathBox h4{
    margin:0 0 4px;
    font-size:11.5px;
}

.pathTier{
    font-size:10.5px;
    margin-bottom:4px;
    line-height:1.3;
}

.upgBtn{
    width:100%;
    border:1px solid #000;
    background:#fff;
    padding:4px 6px;
    font-size:11px;
    margin-top:2px;
}

.upgBtn:hover{
    background:#eee;
}

.upgBtn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.sellBtn{
    width:100%;
    border:1px solid #000;
    background:#fff;
    padding:5px;
    font-size:11.5px;
    margin-top:8px;
}

.sellBtn:hover{
    background:#eee;
}

.blessTag{
    display:inline-block;
    margin-top:6px;
    padding:1px 5px;
    border:1px solid #000;
    font-size:10px;
}

/* BOTTOM */
#bottom{
    position:absolute;
    left:8px;
    right:8px;
    bottom:8px;
    pointer-events:none;
    z-index:10;
}

#message{
    display:inline-block;
    background:#fff;
    border:1px solid #000;
    padding:5px 8px;
    font-size:12.5px;
}

#startWave{
    position:absolute;
    right:8px;
    bottom:8px;
    z-index:12;
    border:1px solid #000;
    background:#fff;
    padding:8px 14px;
}

#startWave:hover{
    background:#eee;
}

#startWave:disabled{
    opacity:.4;
    cursor:not-allowed;
}

#help{
    position:absolute;
    right:8px;
    top:8px;
    background:#fff;
    border:1px solid #000;
    padding:5px 8px;
    font-size:10.5px;
    pointer-events:none;
    text-align:right;
}

/* MENU */
#menuOverlay{
    position:absolute;
    inset:0;
    background:#fff;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
}

#menuOverlay.hidden{
    display:none;
}

#menuBox{

    max-width:92vw;
    border:1px solid #000;

}

#menuBox h1{

}

#menuBox .sub{

}

.menuSection{
    margin-bottom:16px;
}

.menuSection h3{

    font-size:13px;

}

.optGrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
}

.optBtn{
    border:1px solid #000;
    background:#fff;
    padding:10px 6px;
    text-align:center;
    font-size:12.5px;
}

.optBtn:hover{
    background:#eee;
}

.optBtn.active{
    background:#000;
    color:#fff;
}

.optBtn .big{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:3px;
}

.optBtn small{
    font-size:10.5px;
}

#menuSummary{
    margin:12px 0;
    padding:8px 10px;
    border:1px solid #000;
    font-size:12.5px;
    min-height:18px;
}

#startGameBtn{
    width:100%;
    border:1px solid #000;
    background:#fff;
    padding:12px;
    font-size:15px;

#startGameBtn:hover{

#startGameBtn:disabled{

/* PAUSE */
#pauseOverlay{
    position:absolute;
    inset:0;
    background:rgba(255,255,255,.9);

    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
}

#pauseOverlay.show{
    display:flex;
}

#pauseOverlay .pauseBtn{
    border:1px solid #000;
    background:#fff;
    padding:10px 24px;
    font-size:14px;
    width:220px;
}

    background:#eee;
}

#pauseOverlay h2{
    margin:0 0 6px;
    font-size:22px;
}
</style>
</head>

<body>

<div id="game">

    <div id="topbar">

        <div id="title">LINE DEFENSE</div>

        <button class="topBtn" id="restartBtn">⟲ Restart</button>
        <button class="topBtn" id="pauseBtn">⏸ Pause</button>
        <button class="topBtn" id="menuBtn">☰ Menu</button>

        <div id="spacer"></div>

        <div class="stat">💰 <span id="money">0</span></div>
        <div class="stat">❤️ <span id="lives">0</span></div>
        <div class="stat">🌊 Wave <span id="wave">0</span></div>

        <div id="speedWrap">
            <span style="font-size:11px">Speed</span>
            <input type="range" id="speedSlider" min="1" max="4" step="1" value="1">
            <span id="speedLabel">1x</span>
        </div>

        <label id="autoWrap">
            <input type="checkbox" id="autoToggle">
            Autoplay
        </label>

    </div>

    <div id="main">

        <div id="canvasWrap">

            <canvas id="canvas"></canvas>

            <div id="selectedInfo"></div>

            <div id="help">
                Select a tower → click a valid spot<br>
                Click empty space to cancel placement
            </div>

            <button id="startWave">START WAVE</button>

            <div id="bottom">
                <div id="message">Build your defenses.</div>
            </div>

            <div id="pauseOverlay">
                <h2>Paused</h2>
                <button class="pauseBtn" id="resumeBtn">Resume</button>
                <button class="pauseBtn" id="restartFromPauseBtn">Restart Level</button>
                <button class="pauseBtn" id="menuFromPauseBtn">Back to Menu</button>
            </div>

        </div>

        <aside id="towerPanel">

            <div id="towerHeader">

                <h2>Towers</h2>

                <div id="filters">
                    <button class="filterBtn active" data-filter="all">All</button>
                    <button class="filterBtn" data-filter="damage">Damage</button>
                    <button class="filterBtn" data-filter="support">Support</button>
                    <button class="filterBtn" data-filter="farm">Farm</button>
                    <button class="filterBtn" data-filter="special">Special</button>
                    <button class="filterBtn" data-filter="water">Water</button>
                </div>

            </div>

            <div id="towerList"></div>

        </aside>

    </div>

</div>

<div id="menuOverlay">

    <div id="menuBox">

        <h1>LINE DEFENSE</h1>

        <div class="sub">
            Pick a difficulty and a route, then start.
        </div>

        <div class="menuSection">

            <h3>Difficulty</h3>

            <div class="optGrid" id="diffGrid"></div>

        </div>

        <div class="menuSection">

            <h3>Route</h3>

            <div class="optGrid" id="levelGrid"></div>

        </div>

        <div id="menuSummary">
            Select a difficulty and a route.
        </div>

        <button id="startGameBtn" disabled>
            START GAME
        </button>

    </div>

</div>

<script>
"use strict";

/*
=========================================================
LINE DEFENSE
=========================================================

IMPORTANT CHANGES:
1. Right-click selling has been completely removed.
2. Clicking empty canvas cancels tower placement.
3. Clicking a tower in the tower panel selects that tower.
4. Clicking another tower automatically replaces the old selection.
5. Escape cancels tower placement.
6. Canvas is obtained only after the HTML has loaded.
=========================================================
*/


/* =========================================================
   CONSTANTS
========================================================= */

const difficulties = {

        icon:"🟠"

        startLives:1,
        enemyMult:1.8,
        icon:"🔴"
    }

};


const levels = [

    {
        name:"Level 1 · Straight Line",

        path:[
            {x:0,y:.5},
            {x:.15,y:.5},
            {x:.15,y:.2},
            {x:.4,y:.2},
            {x:.4,y:.8},
            {x:.65,y:.8},
            {x:.65,y:.35},
            {x:.85,y:.35},
            {x:.85,y:.65},
            {x:1,y:.65}
        ],

        water:[
            {x:.5,y:.55,w:.15,h:.14}
        ]
    },

    {
        name:"Level 2 · Zig Zag",

        path:[
            {x:0,y:.15},
            {x:.2,y:.15},
            {x:.2,y:.85},
            {x:.35,y:.85},
            {x:.35,y:.35},
            {x:.5,y:.35},
            {x:.5,y:.9},
            {x:.68,y:.9},
            {x:.68,y:.1},
            {x:.85,y:.1},
            {x:.85,y:.55},
            {x:1,y:.55}
        ],

        water:[
            {x:.42,y:.5,w:.14,h:.13}
        ]
    },

    {
        name:"Level 3 · Twin Lakes",

        path:[
            {x:0,y:.5},
            {x:.12,y:.5},
            {x:.12,y:.12},
            {x:.55,y:.12},
            {x:.55,y:.5},
            {x:.3,y:.5},
            {x:.3,y:.85},
            {x:.75,y:.85},
            {x:.75,y:.3},
            {x:.9,y:.3},
            {x:.9,y:.65},
            {x:1,y:.65}
        ],

        water:[
            {x:.4,y:.62,w:.12,h:.12},
            {x:.62,y:.15,w:.11,h:.1}
        ]
    },

    {
        name:"Level 4 · Canyon Run",

        path:[
            {x:0,y:.3},
            {x:.3,y:.3},
            {x:.3,y:.75},
            {x:.55,y:.75},
            {x:.55,y:.15},
            {x:.8,y:.15},
            {x:.8,y:.55},
            {x:1,y:.55}
        ],

        water:[
            {x:.62,y:.65,w:.14,h:.16}
        ]
    }

];


/* =========================================================
   DOM
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const towerPanel = document.getElementById("towerPanel");
const towerList = document.getElementById("towerList");

let W = 1000;
let H = 700;


function resize(){

    const rect = canvas.getBoundingClientRect();

    W = Math.max(600,rect.width);
    H = Math.max(400,rect.height);

    const dpr = window.devicePixelRatio || 1;

    canvas.width = W*dpr;
    canvas.height = H*dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


window.addEventListener("resize",resize);

resize();


/* =========================================================
   GAME STATE
========================================================= */

let gameState = "menu";

let chosenDiff = null;
let chosenLevel = null;

let money = 500;
let lives = 100;
let wave = 0;

let gameSpeed = 1;

let waveRunning = false;
let waveTimer = 0;
let spawnTimer = 0;

let autoplay = false;
let autoplayTimer = 0;

let selectedTowerType = null;
let selectedTower = null;

let currentFilter = "all";

let towers = [];
let enemies = [];
let projectiles = [];
let particles = [];

let currentPath = [];
let currentWater = [];

let difficultyData = null;

let mouseX = 0;
let mouseY = 0;


/* =========================================================
   MENU
========================================================= */

const diffGrid = document.getElementById("diffGrid");
const levelGrid = document.getElementById("levelGrid");
const menuSummary = document.getElementById("menuSummary");
const startGameBtn = document.getElementById("startGameBtn");


Object.entries(difficulties).forEach(([key,d])=>{

    const btn = document.createElement("button");

    btn.className = "optBtn";

    btn.innerHTML = `
        <span class="big">${d.icon} ${d.name}</span>
        <small>${d.startLives} HP</small>
    `;

    btn.addEventListener("click",()=>{

        chosenDiff = key;

        [...diffGrid.children].forEach(
            b=>b.classList.remove("active")
        );

        btn.classList.add("active");

        updateMenuSummary();

    });

    diffGrid.appendChild(btn);

});


levels.forEach((lvl,i)=>{

    const btn = document.createElement("button");

    btn.className = "optBtn";

    btn.innerHTML = `
        <span class="big">Route ${i+1}</span>
        <small>${lvl.name.split("·")[1] || ""}</small>
    `;

    btn.addEventListener("click",()=>{

        chosenLevel = i;

        [...levelGrid.children].forEach(
            b=>b.classList.remove("active")
        );

        btn.classList.add("active");

        updateMenuSummary();

    });

    levelGrid.appendChild(btn);

});


function updateMenuSummary(){

    if(chosenDiff && chosenLevel !== null){

        menuSummary.textContent =
            `Selected: ${difficulties[chosenDiff].name} difficulty on ${levels[chosenLevel].name}.`;

        startGameBtn.disabled = false;

    }

    else if(chosenDiff){

        menuSummary.textContent =
            `Selected: ${difficulties[chosenDiff].name} difficulty. Now pick a route.`;

        startGameBtn.disabled = true;

    }

    else if(chosenLevel !== null){

        menuSummary.textContent =
            `Selected: ${levels[chosenLevel].name}. Now pick a difficulty.`;

        startGameBtn.disabled = true;

    }

    else{

        menuSummary.textContent =
            "Select a difficulty and a route.";

        startGameBtn.disabled = true;

    }

}


startGameBtn.addEventListener(
    "click",
    ()=>beginNewGame()
);


/* =========================================================
   MENU / PAUSE
========================================================= */

document.getElementById("menuBtn").addEventListener(
    "click",
    ()=>openMenu()
);

document.getElementById("menuFromPauseBtn").addEventListener(
    "click",
    ()=>openMenu()
);

document.getElementById("restartBtn").addEventListener(
    "click",
    ()=>{
        if(chosenDiff !== null && chosenLevel !== null){
            beginNewGame(true);
        }
    }
);

document.getElementById("restartFromPauseBtn").addEventListener(
    "click",
    ()=>beginNewGame(true)
);

document.getElementById("pauseBtn").addEventListener(
    "click",
    ()=>togglePause()
);

document.getElementById("resumeBtn").addEventListener(
    "click",
    ()=>togglePause()
);


function openMenu(){

    gameState = "menu";

    document
        .getElementById("menuOverlay")
        .classList.remove("hidden");

    document
        .getElementById("pauseOverlay")
        .classList.remove("show");

    cancelTowerPlacement();

}


function togglePause(){

    if(gameState === "playing"){

        gameState = "paused";

        document
            .getElementById("pauseOverlay")
            .classList.add("show");

    }

    else if(gameState === "paused"){

        gameState = "playing";

        document
            .getElementById("pauseOverlay")
            .classList.remove("show");

    }

}


function beginNewGame(){

    if(!chosenDiff || chosenLevel === null){
        return;
    }

    difficultyData = difficulties[chosenDiff];

    const lvl = levels[chosenLevel];

    currentPath = lvl.path;
    currentWater = lvl.water;

    money = 500;
    lives = difficultyData.startLives;
    wave = 0;

    waveRunning = false;
    waveTimer = 0;
    spawnTimer = 0;

    autoplayTimer = 0;

    towers = [];
    enemies = [];
    projectiles = [];
    particles = [];

    selectedTowerType = null;
    selectedTower = null;

    document
        .getElementById("menuOverlay")
        .classList.add("hidden");

    document
        .getElementById("pauseOverlay")
        .classList.remove("show");

    hideSelectedInfo();

    setMessage(
        `${difficultyData.name} · ${lvl.name}. Build your defenses.`
    );

    renderTowerList();
    updateUI();

    gameState = "playing";
}


/* =========================================================
   PATH HELPERS
========================================================= */

function pointOnPath(t){

    let total = 0;

    for(let i=0;i<currentPath.length-1;i++){

        const a = currentPath[i];
        const b = currentPath[i+1];

        total += Math.hypot(
            (b.x-a.x)*W,
            (b.y-a.y)*H
        );

    }

    let target = t*total;

    for(let i=0;i<currentPath.length-1;i++){

        const a = currentPath[i];
        const b = currentPath[i+1];

        const ax = a.x*W;
        const ay = a.y*H;

        const bx = b.x*W;
        const by = b.y*H;

        const len = Math.hypot(
            bx-ax,
            by-ay
        );

        if(target <= len){

            const p = len===0 ? 0 : target/len;

            return {
                x:ax+(bx-ax)*p,
                y:ay+(by-ay)*p
            };

        }

        target -= len;

    }

    const last = currentPath[currentPath.length-1];

    return {
        x:last.x*W,
        y:last.y*H
    };

}


function distanceToPath(x,y){

    let best = Infinity;

    for(let i=0;i<currentPath.length-1;i++){

        const a = currentPath[i];
        const b = currentPath[i+1];

        const ax = a.x*W;
        const ay = a.y*H;

        const bx = b.x*W;
        const by = b.y*H;

        const dx = bx-ax;
        const dy = by-ay;

        const len2 = dx*dx+dy*dy;

        let t =
            len2===0
            ? 0
            : ((x-ax)*dx+(y-ay)*dy)/len2;

        t = Math.max(0,Math.min(1,t));

        const px = ax+dx*t;
        const py = ay+dy*t;

        best = Math.min(
            best,
            Math.hypot(x-px,y-py)
        );

    }

    return best;
}


function inWater(x,y){

    for(const r of currentWater){

        const rx = r.x*W;
        const ry = r.y*H;

        const rw = r.w*W;
        const rh = r.h*H;

        if(
            x>=rx &&
            x<=rx+rw &&
            y>=ry &&
            y<=ry+rh
        ){
            return true;
        }

    }

    return false;
}


/* =========================================================
   TOWER DEFINITIONS
========================================================= */

const towerTypes = {

        icon:"S",

        cost:100,

        cooldown:650,
        projectileSpeed:520,
        color:"#9fb5c4",
        desc:"Cheap, reliable single-target damage.",

        upgrades:{

                    {

                    },
                    {
                        cost:150,

/* =========================================================
   TOWER UI
========================================================= */

function getTowerCount(type){

    return towers.filter(
        t=>t.type===type
    ).length;

}


function renderTowerList(){

    towerList.innerHTML = "";

    Object.entries(towerTypes)

        .filter(
            ([key,t])=>
                currentFilter==="all" ||
                t.category===currentFilter
        )

        .forEach(([key,t])=>{

            const count = getTowerCount(key);

            const card = document.createElement("div");

            card.className =
                "towerCard" +
                (selectedTowerType===key ? " selected":"") +
                (count>=t.limit ? " disabled":"");

            card.innerHTML = `
                <div class="towerTop">

                    <div
                        class="towerIcon"
                        style="color:${t.color}"
                    >
                        ${t.icon}
                    </div>

                    <div class="towerName">
                        ${t.name}
                    </div>

                    <div class="limit">
                        ${count}/${t.limit}
                    </div>

                </div>

                <div class="towerDesc">
                    ${t.desc}
                </div>

                <div class="towerCost">
                    Cost: $${t.cost}
                </div>
            `;


            card.addEventListener("click",event=>{

                event.stopPropagation();

                if(gameState!=="playing"){
                    return;
                }

                if(count>=t.limit){

                    setMessage(
                        `${t.name} placement limit reached (${t.limit}).`
                    );

                    return;
                }

                if(money<t.cost){

                    setMessage(
                        `Not enough money for ${t.name}.`
                    );

                    return;
                }


                /*
                IMPORTANT:

                Selecting another tower automatically
                cancels the previous tower selection.
                */

                selectedTowerType = key;
                selectedTower = null;

                hideSelectedInfo();

                renderTowerList();

                setMessage(
                    `Selected ${t.name}. Click a valid location. Press Escape to cancel.`
                );

            });


            towerList.appendChild(card);

        });

}

function spawnEnemy(type,waveNum){

    const base = enemyTypes[type];

    const mult = difficultyData.enemyMult;

    const waveScale = 1+waveNum*.07;

    enemies.push({

        type,

        hp:base.hp*waveScale*mult,

        maxHp:base.hp*waveScale*mult,

        progress:0,

        speed:base.speed,

        reward:Math.round(
            base.reward*(1+waveNum*.03)
        ),

        radius:base.radius,

        slow:1,

        alive:true

    });

}


/* =========================================================
   PLACEMENT
========================================================= */

function canPlace(x,y,type){

    const t = towerTypes[type];

    if(getTowerCount(type)>=t.limit){
        return false;
    }

    if(money<t.cost){
        return false;
    }


    for(const tower of towers){

        if(
            Math.hypot(
                x-tower.x,
                y-tower.y
            )<34
        ){
            return false;
        }

    }


    if(distanceToPath(x,y)<27){
        return false;
    }


    if(t.waterOnly){

        if(!inWater(x,y)){
            return false;
        }

    }

    else{

        if(inWater(x,y)){
            return false;
        }

    }

    return true;

}


function placeTower(x,y){

    if(!selectedTowerType){
        return;
    }

    const type = selectedTowerType;

    const data = towerTypes[type];


    if(!canPlace(x,y,type)){

        if(getTowerCount(type)>=data.limit){

            setMessage(
                `${data.name} limit reached: ${data.limit}.`
            );

        }

        else if(money<data.cost){

            setMessage("Not enough money.");

        }

        else if(data.waterOnly){

            setMessage(
                `${data.name} can only be placed in water.`
            );

        }

        else if(inWater(x,y)){

            setMessage(
                "Cannot place a land tower in water."
            );

        }

        else{

            setMessage(
                "That location cannot hold a tower."
            );

        }

        return;
    }


    money -= data.cost;


    const blessing = rollBlessing();


    towers.push({

        id:Date.now()+Math.random(),

        type,
        x,
        y,

        cooldown:0,

        incomeTimer:data.incomeTime || 0,

        pathALevel:0,
        pathBLevel:0,

        dmgMult:1,
        rateMult:1,
        rangeMult:1,
        splashMult:1,

        incomeMult:1,
        incomeTimeMult:1,

        multishot:1,

        pierce:false,
        breaksArmor:!!data.breaksArmor,
        detectsCamo:!!data.detectsCamo,

        critChance:0,
        critMult:1,

        camoBonus:1,
        bossBonus:1,

        auraSlow:0,
        auraRange:0,

        slowBonus:0,
        shatterBonus:1,

        buffBonus:0,
        buffRangeMult:1,

        grantsCrit:0,

        bank:false,
        tradeRoute:false,

        cluster:false,
        stormChain:false,
        empStun:false,

        coreBreach:false,
        deepScan:false,

        chainBonus:0,

        blessing,

        storedInterest:0

    });


    /*
    Automatically cancel placement after placing.

    This makes the placement a one-click action rather
    than forcing the player to keep placing copies.
    */

    selectedTowerType = null;

    setMessage(
        `${data.name} placed.` +
        (
            blessing
            ? ` It rolled a blessing: ${blessing.name}!`
            : ""
        )
    );

    renderTowerList();
    updateUI();

}


/*
This is the central deselection function.
It cancels tower placement and removes the
placement preview.
*/

function cancelTowerPlacement(){

    selectedTowerType = null;

    renderTowerList();

}


/* =========================================================
   UPGRADES
========================================================= */

function upgradeTower(tower,pathKey){

    const data = towerTypes[tower.type];

    const path = data.upgrades[pathKey];

    const levelProp =
        pathKey==="A"
        ? "pathALevel"
        : "pathBLevel";

    const level = tower[levelProp];


    if(level>=path.tiers.length){
        return;
    }


    const tier = path.tiers[level];


    if(money<tier.cost){

        setMessage(
            "Not enough money for that upgrade."
        );

        return;
    }


    money -= tier.cost;

    tier.apply(tower);

    tower[levelProp]++;


    setMessage(
        `${data.name} upgraded: ${path.name} tier ${tower[levelProp]}.`
    );

    showSelectedInfo(tower);

    updateUI();

}


/* =========================================================
   TARGETING
========================================================= */

function getBuffMultiplier(tower){

    let multiplier = 1;

    let critBonus = 0;


    for(const other of towers){

        if(other.type!=="commander"){
            continue;
        }

        const range =
            towerTypes.commander.range *
            (other.buffRangeMult || 1);

        const d =
            Math.hypot(
                tower.x-other.x,
                tower.y-other.y
            );


        if(d<=range){

            multiplier +=
                towerTypes.commander.buff +
                (other.buffBonus || 0);

            if(other.grantsCrit){

                critBonus =
                    Math.max(
                        critBonus,
                        other.grantsCrit
                    );

            }

        }

    }


    return {
        multiplier,
        critBonus
    };

}


function getTarget(tower){

    const data = towerTypes[tower.type];

    const range =
        data.range*tower.rangeMult;


    let best = null;

    let bestProgress = -1;


    for(const e of enemies){

        if(!e.alive){
            continue;
        }

        if(e.camo && !tower.detectsCamo){
            continue;
        }


        const p = pointOnPath(e.progress);

        const d =
            Math.hypot(
                p.x-tower.x,
                p.y-tower.y
            );


        if(
            d<=range &&
            e.progress>bestProgress
        ){

            best = e;

            bestProgress = e.progress;

        }

    }


    return best;

}


/* =========================================================
   ATTACKS
========================================================= */

function fireTower(tower,target){

    const data = towerTypes[tower.type];

    if(!data.damage){
        return;
    }


    const {
        multiplier,
        critBonus
    } = getBuffMultiplier(tower);


    let dmg =
        data.damage *
        tower.dmgMult *
        multiplier;


    const totalCrit =
        Math.min(
            .95,
            tower.critChance+critBonus
        );


    if(
        totalCrit>0 &&
        Math.random()<totalCrit
    ){

        dmg *= tower.critMult || 2;

    }


    if(
        target.camo &&
        tower.camoBonus>1
    ){

        dmg *= tower.camoBonus;

    }


    if(
        target.boss &&
        tower.bossBonus>1
    ){

        dmg *= tower.bossBonus;

    }


    if(
        tower.blessing &&
        tower.blessing.key==="crit" &&
        Math.random()<.25
    ){

        dmg *= 1.5;

    }


    const shots = tower.multishot || 1;

    let targets = [target];


    if(shots>1){

        const alive =
            enemies.filter(
                e=>
                    e.alive &&
                    (!e.camo || tower.detectsCamo)
            );

        alive.sort(
            (a,b)=>b.progress-a.progress
        );


        for(const e of alive){

            if(targets.length>=shots){
                break;
            }

            if(!targets.includes(e)){
                targets.push(e);
            }

        }

    }


    for(const tgt of targets){

        projectiles.push({

            x:tower.x,
            y:tower.y,

            target:tgt,

            speed:data.projectileSpeed || 500,

            damage:dmg,

            splash:
                (data.splash || 0) *
                tower.splashMult,

            slow:
                (data.slow || 0) +
                (tower.slowBonus || 0),

            chain:
                (data.chain || 0) +
                (tower.chainBonus || 0),

            towerType:tower.type,

            breaksArmor:tower.breaksArmor,

            pierce:tower.pierce,

            shatterBonus:tower.shatterBonus,

            cluster:tower.cluster,

            stormChain:tower.stormChain,

            empStun:tower.empStun

        });

    }

}


function damageEnemy(
    enemy,
    amount,
    breaksArmor,
    shatterBonus
){

    if(!enemy || !enemy.alive){
        return;
    }


    if(
        enemy.armored &&
        !breaksArmor
    ){

        amount *= .25;

    }


    if(
        shatterBonus &&
        shatterBonus>1 &&
        enemy.slow<1
    ){

        amount *= shatterBonus;

    }


    enemy.hp -= amount;


    if(enemy.hp<=0){

        enemy.alive = false;

        let reward = enemy.reward;


        const p =
            pointOnPath(enemy.progress);


        createParticles(
            p.x,
            p.y,
            8
        );


        money += reward;

    }

}


function chainAttack(
    startEnemy,
    damage,
    count,
    breaksArmor,
    stormChain
){

    let current = startEnemy;

    const hit = new Set();


    if(stormChain){

        const range = towerTypes.arc.range;

        const cp =
            pointOnPath(startEnemy.progress);


        for(const e of enemies){

            if(!e.alive){
                continue;
            }

            const ep =
                pointOnPath(e.progress);


            if(
                Math.hypot(
                    cp.x-ep.x,
                    cp.y-ep.y
                )<=range
            ){

                damageEnemy(
                    e,
                    damage,
                    breaksArmor
                );

            }

        }

        return;

    }


    for(
        let i=0;
        i<count && current;
        i++
    ){

        if(hit.has(current)){
            break;
        }

        hit.add(current);


        damageEnemy(
            current,
            damage,
            breaksArmor
        );


        let next = null;
        let best = Infinity;


        const cp =
            pointOnPath(current.progress);


        for(const e of enemies){

            if(!e.alive || hit.has(e)){
                continue;
            }


            const ep =
                pointOnPath(e.progress);


            const d =
                Math.hypot(
                    cp.x-ep.x,
                    cp.y-ep.y
                );


            if(
                d<90 &&
                d<best
            ){

                best = d;
                next = e;

            }

        }


        current = next;

        damage *= .72;

    }

}


/* =========================================================
   PROJECTILES
========================================================= */

function updateProjectiles(dt){

    for(const p of projectiles){

        if(
            !p.target ||
            !p.target.alive
        ){

            p.dead = true;

            continue;

        }


        const ep =
            pointOnPath(
                p.target.progress
            );


        const dx = ep.x-p.x;
        const dy = ep.y-p.y;

        const dist =
            Math.hypot(dx,dy);


        const step =
            p.speed *
            dt/1000 *
            gameSpeed;


        if(dist<=step+5){

            if(p.towerType==="arc"){

                chainAttack(
                    p.target,
                    p.damage,
                    p.chain,
                    p.breaksArmor,
                    p.stormChain
                );

            }

            else{

                damageEnemy(
                    p.target,
                    p.damage,
                    p.breaksArmor,
                    p.shatterBonus
                );


                if(
                    p.empStun &&
                    p.target.boss
                ){

                    p.target.speed *= .4;

                    setTimeout(()=>{

                        if(p.target){
                            p.target.speed /= .4;
                        }

                    },1200);

                }


                if(p.splash){

                    for(const e of enemies){

                        if(
                            !e.alive ||
                            e===p.target
                        ){
                            continue;
                        }


                        const q =
                            pointOnPath(
                                e.progress
                            );


                        if(
                            Math.hypot(
                                q.x-ep.x,
                                q.y-ep.y
                            )<=p.splash
                        ){

                            damageEnemy(
                                e,
                                p.damage*.42,
                                p.breaksArmor
                            );

                        }

                    }

                }


                if(p.cluster){

                    for(let i=0;i<3;i++){

                        const a =
                            Math.random() *
                            Math.PI*2;

                        const dist2 =
                            20 +
                            Math.random()*40;


                        const cx =
                            ep.x+
                            Math.cos(a)*dist2;

                        const cy =
                            ep.y+
                            Math.sin(a)*dist2;


                        for(const e of enemies){

                            if(!e.alive){
                                continue;
                            }


                            const q =
                                pointOnPath(
                                    e.progress
                                );


                            if(
                                Math.hypot(
                                    q.x-cx,
                                    q.y-cy
                                )<=30
                            ){

                                damageEnemy(
                                    e,
                                    p.damage*.3,
                                    p.breaksArmor
                                );

                            }

                        }

                    }

                }


                if(
                    p.slow &&
                    !p.target.iceImmune
                ){

                    p.target.slow =
                        Math.min(
                            p.target.slow,
                            1-p.slow
                        );

                }


                if(p.pierce){

                    for(const e of enemies){

                        if(
                            !e.alive ||
                            e===p.target
                        ){
                            continue;
                        }


                        const q =
                            pointOnPath(
                                e.progress
                            );


                        if(
                            Math.abs(q.x-ep.x)<40 &&
                            Math.abs(q.y-ep.y)<40
                        ){

                            damageEnemy(
                                e,
                                p.damage*.6,
                                p.breaksArmor
                            );

                        }

                    }

                }

            }


            createParticles(
                ep.x,
                ep.y,
                4
            );

            p.dead = true;

        }

        else{

            p.x +=
                dx/dist *
                step;

            p.y +=
                dy/dist *
                step;

        }

    }


    projectiles =
        projectiles.filter(
            p=>!p.dead
        );

}


/* =========================================================
   WAVES
========================================================= */

function startWave(){

    if(
        waveRunning ||
        gameState!=="playing"
    ){
        return;
    }


    wave++;

    waveRunning = true;

    waveTimer = 0;

    spawnTimer = 0;

    autoplayTimer = 0;


    setMessage(
        `Wave ${wave} started.`
    );

    updateUI();

}


function pickEnemyType(
    waveNum,
    isLast
){

    if(
        waveNum%10===0 &&
        isLast
    ){

        return "boss";

    }


    const roll = Math.random();

    const pool = [];


    pool.push([
        "normal",
        1
    ]);


    if(waveNum>=3){

        pool.push([
            "fast",
            .5
        ]);

    }


    if(waveNum>=6){

        pool.push([
            "tank",
            .35
        ]);

    }


    if(waveNum>=9){

        pool.push([
            "armored",
            .3
        ]);

    }


    if(waveNum>=11){

        pool.push([
            "camo",
            .22
        ]);

    }


    if(waveNum>=13){

        pool.push([
            "bear",
            .2
        ]);

    }


    if(waveNum>=15){

        pool.push([
            "polar",
            .18
        ]);

    }


    if(waveNum>=17){

        pool.push([
            "cheetah",
            .22
        ]);

    }


    const total =
        pool.reduce(
            (s,p)=>s+p[1],
            0
        );


    let r = roll*total;


    for(const [type,weight] of pool){

        if(r<=weight){
            return type;
        }

        r -= weight;

    }


    return "normal";

}


function spawnForWave(){

    const count =
        8+wave*2;


    if(waveTimer>=count){

        waveRunning = false;


        const bonus =
            100+wave*10;


        money += bonus;


        setMessage(
            `Wave ${wave} cleared. +$${bonus} bonus.`
        );


        updateUI();

        return;

    }


    const isLast =
        waveTimer===count-1;


    const type =
        pickEnemyType(
            wave,
            isLast
        );


    spawnEnemy(
        type,
        wave
    );


    waveTimer++;

}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(
    x,
    y,
    count
){

    for(let i=0;i<count;i++){

        const a =
            Math.random() *
            Math.PI*2;

        const s =
            30 +
            Math.random()*80;


        particles.push({

            x,
            y,

            vx:Math.cos(a)*s,
            vy:Math.sin(a)*s,

            life:
                .5 +
                Math.random()*.4

        });

    }

}


function updateParticles(dt){

    for(const p of particles){

        p.life -=
            dt/1000 *
            gameSpeed;


        p.x +=
            p.vx *
            dt/1000 *
            gameSpeed;


        p.y +=
            p.vy *
            dt/1000 *
            gameSpeed;


        p.vx *= .97;
        p.vy *= .97;

    }


    particles =
        particles.filter(
            p=>p.life>0
        );

}


/* =========================================================
   GAME UPDATE
========================================================= */

function update(dt){

    if(gameState!=="playing"){
        return;
    }


    if(waveRunning){

        spawnTimer -=
            dt *
            gameSpeed;


        if(spawnTimer<=0){

            spawnForWave();

            spawnTimer = 850;

        }

    }

    else if(
        autoplay &&
        lives>0
    ){

        autoplayTimer -=
            dt *
            gameSpeed;


        if(autoplayTimer<=0){

            startWave();

        }

    }


    for(const e of enemies){

        if(!e.alive){
            continue;
        }


        let speedMult = e.slow;


        e.progress +=
            e.speed *
            dt *
            gameSpeed *
            speedMult;


        if(e.regen){

            e.hp =
                Math.min(
                    e.maxHp,
                    e.hp+
                    e.maxHp*
                    .00002*
                    dt*
                    gameSpeed
                );

        }


        if(e.progress>=1){

            e.alive = false;


            lives -=
                e.type==="boss"
                ? 25
                : 5;


            if(lives<0){
                lives=0;
            }


            if(lives<=0){

                waveRunning=false;

                setMessage(
                    "Defeat. Restart or return to menu."
                );

            }

        }


        if(e.slow<1){

            e.slow =
                Math.min(
                    1,
                    e.slow+
                    dt/1000*.05
                );

        }

    }


    for(const e of enemies){

        const t =
            enemyTypes[e.type];

        e.camo = t.camo;
        e.armored = t.armored;
        e.iceImmune = t.iceImmune;
        e.regen = t.regen;
        e.boss = t.boss;

    }


    enemies =
        enemies.filter(
            e=>e.alive
        );


    for(const tower of towers){

        const data =
            towerTypes[tower.type];


        tower.cooldown -=
            dt *
            gameSpeed;


        /* Income */

        if(
            data.income &&
            waveRunning
        ){

            tower.incomeTimer -=
                dt *
                gameSpeed;


            if(tower.incomeTimer<=0){

                let amt =
                    data.income *
                    tower.incomeMult;


                if(tower.tradeRoute){

                    amt *=
                        1+
                        wave*.05;

                }


                if(tower.bank){

                    tower.storedInterest +=
                        amt*.1;

                }


                money +=
                    amt+
                    (
                        tower.bank
                        ? tower.storedInterest*.02
                        : 0
                    );


                tower.incomeTimer =
                    data.incomeTime *
                    tower.incomeTimeMult;


                createParticles(
                    tower.x,
                    tower.y,
                    5
                );

            }

        }


        /* Reactor Core Breach */

        if(tower.coreBreach){

            tower.coreTimer =
                (tower.coreTimer||0) -
                dt *
                gameSpeed;


            if(tower.coreTimer<=0){

                for(const e of enemies){

                    if(!e.alive){
                        continue;
                    }


                    const q =
                        pointOnPath(
                            e.progress
                        );


                    if(
                        Math.hypot(
                            q.x-tower.x,
                            q.y-tower.y
                        )<=
                        towerTypes.reactor.range*1.4
                    ){

                        damageEnemy(
                            e,
                            600,
                            true
                        );

                    }

                }


                createParticles(
                    tower.x,
                    tower.y,
                    20
                );


                tower.coreTimer = 6000;

            }

        }


        /* Frost aura */

        if(tower.auraSlow){

            for(const e of enemies){

                if(
                    !e.alive ||
                    e.iceImmune
                ){
                    continue;
                }


                const q =
                    pointOnPath(
                        e.progress
                    );


                if(
                    Math.hypot(
                        q.x-tower.x,
                        q.y-tower.y
                    )<=tower.auraRange
                ){

                    e.slow =
                        Math.min(
                            e.slow,
                            1-tower.auraSlow
                        );

                }

            }

        }


        /* Normal attack */

        if(
            data.damage &&
            tower.cooldown<=0
        ){

            const target =
                getTarget(tower);


            if(target){

                fireTower(
                    tower,
                    target
                );


                tower.cooldown =
                    data.cooldown /
                    tower.rateMult;

            }

        }

    }


    updateProjectiles(dt);

    updateParticles(dt);

    updateUI();

}


/* =========================================================
   DRAWING
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    ctx.fillStyle="#fff";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.strokeStyle =
        "rgba(0,0,0,.06)";

    ctx.lineWidth=1;


    for(
        let x=0;
        x<W;
        x+=40
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);
        ctx.lineTo(x,H);

        ctx.stroke();

    }


    for(
        let y=0;
        y<H;
        y+=40
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();

    }


    if(gameState==="menu"){
        return;
    }


    drawWater();
    drawPath();
    drawTowers();
    drawEnemies();
    drawProjectiles();
    drawParticles();


    if(selectedTowerType){

        drawPlacementPreview();

    }

}


function drawWater(){

    for(const r of currentWater){

        const x = r.x*W;
        const y = r.y*H;

        const w = r.w*W;
        const h = r.h*H;


        ctx.strokeStyle =
            "rgba(20,90,150,.7)";

        ctx.lineWidth=1.5;

        ctx.strokeRect(
            x,
            y,
            w,
            h
        );


        ctx.strokeStyle =
            "rgba(20,90,150,.3)";

        ctx.lineWidth=1;


        for(
            let yy=y+12;
            yy<y+h;
            yy+=12
        ){

            ctx.beginPath();

            ctx.moveTo(
                x+5,
                yy
            );

            ctx.lineTo(
                x+w-5,
                yy
            );

            ctx.stroke();

        }

    }

}


function drawPath(){

    ctx.beginPath();


    for(
        let i=0;
        i<currentPath.length;
        i++
    ){

        const p =
            currentPath[i];


        const x =
            p.x*W;

        const y =
            p.y*H;


        if(i===0){

            ctx.moveTo(
                x,
                y
            );

        }

        else{

            ctx.lineTo(
                x,
                y
            );

        }

    }


    ctx.strokeStyle="#000";

    ctx.lineWidth=3;

    ctx.lineCap="round";
    ctx.lineJoin="round";

    ctx.stroke();


    const start =
        currentPath[0];

    const end =
        currentPath[
            currentPath.length-1
        ];


    ctx.fillStyle="#000";


    ctx.beginPath();

    ctx.arc(
        start.x*W,
        start.y*H,
        5,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        end.x*W,
        end.y*H,
        5,
        0,
        Math.PI*2
    );

    ctx.fill();

}


function drawTowers(){

    for(const tower of towers){

        const data =
            towerTypes[tower.type];


        if(tower===selectedTower){

            ctx.strokeStyle =
                "rgba(0,0,0,.4)";

            ctx.lineWidth=1;


            ctx.beginPath();

            ctx.arc(
                tower.x,
                tower.y,
                data.range*tower.rangeMult,
                0,
                Math.PI*2
            );

            ctx.stroke();


            ctx.setLineDash([
                4,
                4
            ]);

            ctx.strokeStyle =
                "rgba(255,180,120,.55)";


            ctx.beginPath();

            ctx.arc(
                tower.x,
                tower.y,
                (data.splash||22)*
                .6*
                tower.splashMult,
                0,
                Math.PI*2
            );

            ctx.stroke();

            ctx.setLineDash([]);

        }


        if(tower.blessing){

            ctx.strokeStyle =
                tower.blessing.color;

            ctx.lineWidth=2;


            ctx.beginPath();

            ctx.arc(
                tower.x,
                tower.y,
                19,
                0,
                Math.PI*2
            );

            ctx.stroke();

        }


        ctx.fillStyle="#1b232c";

        ctx.strokeStyle=data.color;

        ctx.lineWidth=2;


        ctx.beginPath();

        ctx.arc(
            tower.x,
            tower.y,
            15,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.stroke();


        ctx.fillStyle=data.color;

        ctx.font="bold 12px Arial";

        ctx.textAlign="center";
        ctx.textBaseline="middle";


        ctx.fillText(
            data.icon,
            tower.x,
            tower.y
        );


        ctx.font="9px sans-serif";

        ctx.fillStyle="#333";


        ctx.fillText(
            data.name,
            tower.x,
            tower.y+26
        );


        if(data.income){

            ctx.font="10px Arial";

            ctx.fillStyle="#b8c9a9";


            ctx.fillText(
                "$",
                tower.x,
                tower.y-23
            );

        }

    }

}


function drawEnemies(){

    for(const e of enemies){

        const p =
            pointOnPath(
                e.progress
            );


        const t =
            enemyTypes[e.type];


        ctx.globalAlpha =
            t.alpha || 1;


        ctx.fillStyle =
            t.color;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            e.radius,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.strokeStyle="#26313b";

        ctx.lineWidth=2;

        ctx.stroke();


        ctx.globalAlpha=1;


        const barW =
            e.radius*2.5;


        const hp =
            e.hp/e.maxHp;


        ctx.fillStyle="#222";


        ctx.fillRect(
            p.x-barW/2,
            p.y-e.radius-8,
            barW,
            3
        );


        ctx.fillStyle="#aebcc6";


        ctx.fillRect(
            p.x-barW/2,
            p.y-e.radius-8,
            barW*Math.max(0,hp),
            3
        );


        if(t.label){

            ctx.font="bold 9px Arial";

            ctx.fillStyle =
                t.labelColor;

            ctx.textAlign="center";


            ctx.fillText(
                t.label,
                p.x,
                p.y-e.radius-13
            );

        }

    }

}


function drawProjectiles(){

    for(const p of projectiles){

        ctx.fillStyle="#000";


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life
            );


        ctx.fillStyle="#555";


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            2.5,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.globalAlpha=1;

    }

}


function drawPlacementPreview(){

    if(!selectedTowerType){
        return;
    }


    const data =
        towerTypes[
            selectedTowerType
        ];


    const valid =
        canPlace(
            mouseX,
            mouseY,
            selectedTowerType
        );


    ctx.globalAlpha=.35;


    ctx.fillStyle =
        valid
        ? "#000"
        : "#aaa";


    ctx.beginPath();

    ctx.arc(
        mouseX,
        mouseY,
        15,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.globalAlpha=.25;


    ctx.strokeStyle =
        valid
        ? "#000"
        : "#aaa";


    ctx.lineWidth=1;


    ctx.beginPath();

    ctx.arc(
        mouseX,
        mouseY,
        data.range,
        0,
        Math.PI*2
    );

    ctx.stroke();


    ctx.setLineDash([
        4,
        4
    ]);


    ctx.strokeStyle =
        "rgba(255,180,120,.5)";


    ctx.beginPath();

    ctx.arc(
        mouseX,
        mouseY,
        (data.splash||22)*.6,
        0,
        Math.PI*2
    );

    ctx.stroke();


    ctx.setLineDash([]);

    ctx.globalAlpha=1;

}


/* =========================================================
   CANVAS INPUT
========================================================= */

canvas.addEventListener(
    "mousemove",
    e=>{

        const rect =
            canvas.getBoundingClientRect();


        mouseX =
            e.clientX-rect.left;

        mouseY =
            e.clientY-rect.top;

    }
);


/*
=========================================================
LEFT CLICK ON CANVAS

This is where the new deselection behavior happens.

- Clicking a tower selects that tower.
- Clicking a valid location while placing places it.
- Clicking empty space while placing cancels placement.
- Clicking empty space with no placement simply deselects.
=========================================================
*/

canvas.addEventListener(
    "click",
    e=>{

        if(gameState!=="playing"){
            return;
        }


        const rect =
            canvas.getBoundingClientRect();


        const x =
            e.clientX-rect.left;

        const y =
            e.clientY-rect.top;


        /*
        First check whether the player clicked
        an already placed tower.
        */

        for(
            let i=towers.length-1;
            i>=0;
            i--
        ){

            const tower =
                towers[i];


            if(
                Math.hypot(
                    x-tower.x,
                    y-tower.y
                )<=18
            ){

                selectedTower =
                    tower;

                selectedTowerType =
                    null;

                showSelectedInfo(tower);

                renderTowerList();

                return;

            }

        }


        /*
        If the player is currently placing a tower,
        clicking empty space cancels placement.

        This is the important fix.
        */

        if(selectedTowerType){

            /*
            If the location is valid, place it.
            Otherwise, cancel only when clicking empty
            space. A failed placement currently keeps
            the selection so the player can try again.
            */

            if(
                canPlace(
                    x,
                    y,
                    selectedTowerType
                )
            ){

                placeTower(x,y);

            }

            else{

                /*
                Clicking empty space now cancels
                the selected tower.
                */

                cancelTowerPlacement();

                selectedTower = null;

                hideSelectedInfo();

                setMessage(
                    "Tower placement cancelled."
                );

            }

            return;

        }


        /*
        Nothing was clicked:
        deselect any selected tower.
        */

        selectedTower = null;

        hideSelectedInfo();

    }
);


/*
=========================================================
RIGHT CLICK

Right-click selling has intentionally been removed.

We still prevent the browser context menu from appearing
over the game, but it no longer sells towers.
=========================================================
*/

canvas.addEventListener(
    "contextmenu",
    e=>{
        e.preventDefault();

        if(gameState!=="playing"){
            return;
        }

        /*
        Right-click now simply cancels placement.
        It NEVER sells a tower.
        */

        if(selectedTowerType){

            cancelTowerPlacement();

            selectedTower = null;

            hideSelectedInfo();

            setMessage(
                "Tower placement cancelled."
            );

        }

    }
);


/*
=========================================================
ESCAPE

Escape is another convenient way to cancel placement.
=========================================================
*/

document.addEventListener(
    "keydown",
    e=>{

        if(e.key==="Escape"){

            if(selectedTowerType){

                cancelTowerPlacement();

                selectedTower = null;

                hideSelectedInfo();

                setMessage(
                    "Tower placement cancelled."
                );

            }

        }

    }
);


/* =========================================================
   TOWER PANEL DESELECTION

Clicking anywhere inside the tower panel that is NOT
a tower/filter button cancels placement.
========================================================= */

towerPanel.addEventListener(
    "click",
    e=>{

        /*
        Do not cancel when the player is deliberately
        clicking a tower card or filter button.
        */

        if(
            e.target.closest(".towerCard") ||
            e.target.closest(".filterBtn")
        ){

            return;

        }


        if(selectedTowerType){

            cancelTowerPlacement();

            selectedTower = null;

            hideSelectedInfo();

            setMessage(
                "Tower placement cancelled."
            );

        }

    }
);


/*
Clicking the tower panel background also removes
the selected placed tower information.
*/

towerPanel.addEventListener(
    "mousedown",
    e=>{

        if(
            !e.target.closest(".towerCard") &&
            !e.target.closest(".filterBtn")
        ){

            selectedTower = null;

            hideSelectedInfo();

        }

    }
);


/* =========================================================
   WAVE / SPEED / AUTOPLAY
========================================================= */

document
    .getElementById("startWave")
    .addEventListener(
        "click",
        startWave
    );


document
    .getElementById("speedSlider")
    .addEventListener(
        "input",
        e=>{

            gameSpeed =
                Number(e.target.value);


            document
                .getElementById("speedLabel")
                .textContent =
                    gameSpeed+"x";

        }
    );


document
    .getElementById("autoToggle")
    .addEventListener(
        "change",
        e=>{

            autoplay =
                e.target.checked;

            autoplayTimer = 1200;


            setMessage(
                autoplay
                ? "Autoplay enabled."
                : "Autoplay disabled."
            );

        }
    );


/* =========================================================
   SELECTED TOWER INFO
========================================================= */

function showSelectedInfo(tower){

    const box =
        document.getElementById(
            "selectedInfo"
        );


    const data =
        towerTypes[tower.type];


    box.style.display = "block";


    let html = `
        <b style="color:${data.color}">
            ${data.name}
        </b>
    `;


    html += `
        <div class="row">
            Placed:
            ${getTowerCount(tower.type)}/${data.limit}
        </div>
    `;


    if(data.damage){

        html += `
            <div class="row">
                Damage:
                ${Math.round(
                    data.damage*tower.dmgMult
                )}
            </div>
        `;

    }


    if(data.range){

        html += `
            <div class="row">
                Range:
                ${Math.round(
                    data.range*tower.rangeMult
                )}
            </div>
        `;

    }


    if(data.income){

        html += `
            <div class="row">
                Income:
                $${Math.round(
                    data.income*tower.incomeMult
                )}
                / active-wave tick
            </div>
        `;

    }


    if(tower.blessing){

        html += `
            <div class="blessTag">
                ✦ ${tower.blessing.name}:
                ${tower.blessing.desc}
            </div>
        `;

    }


    ["A","B"].forEach(pathKey=>{

        const path =
            data.upgrades[pathKey];


        const levelProp =
            pathKey==="A"
            ? "pathALevel"
            : "pathBLevel";


        const level =
            tower[levelProp];


        html += `
            <div class="pathBox">

                <h4 style="color:${path.color}">
                    ${path.name}
                    (${level}/${path.tiers.length})
                </h4>
        `;


        if(level<path.tiers.length){

            const tier =
                path.tiers[level];


            html += `
                <div class="pathTier">
                    ${tier.desc}
                </div>

                <button
                    class="upgBtn"
                    data-tower="${tower.id}"
                    data-path="${pathKey}"
                    ${money<tier.cost?"disabled":""}
                >
                    Upgrade — $${tier.cost}
                </button>
            `;

        }

        else{

            html += `
                <div class="pathTier">
                    Maxed out.
                </div>
            `;

        }


        html += `
            </div>
        `;

    });


    html += `
        <button class="sellBtn" id="sellSelectedBtn">
            Sell for $${Math.floor(data.cost*.7)}
        </button>
    `;


    box.innerHTML = html;


    box.querySelectorAll(".upgBtn")
        .forEach(btn=>{

            btn.addEventListener(
                "click",
                e=>{

                    e.stopPropagation();

                    upgradeTower(
                        tower,
                        btn.dataset.path
                    );

                }
            );

        });


    const sellBtn =
        document.getElementById(
            "sellSelectedBtn"
        );


    if(sellBtn){

        sellBtn.addEventListener(
            "click",
            e=>{

                e.stopPropagation();


                const idx =
                    towers.indexOf(tower);


                if(idx>=0){

                    money +=
                        Math.floor(
                            data.cost*.7
                        );


                    towers.splice(
                        idx,
                        1
                    );


                    selectedTower = null;

                    hideSelectedInfo();


                    setMessage(
                        `${data.name} sold.`
                    );


                    renderTowerList();

                    updateUI();

                }

            }
        );

    }

}


function hideSelectedInfo(){

    document.getElementById(
        "selectedInfo"
    ).style.display = "none";

}


/* =========================================================
   UI
========================================================= */

function updateUI(){

    document.getElementById(
        "money"
    ).textContent =
        Math.floor(money);


    document.getElementById(
        "lives"
    ).textContent =
        Math.max(
            0,
            Math.floor(lives)
        );


    document.getElementById(
        "wave"
    ).textContent =
        wave;


    document.getElementById(
        "startWave"
    ).disabled =
        waveRunning ||
        gameState!=="playing";


    if(
        selectedTower &&
        towers.includes(selectedTower)
    ){

        showSelectedInfo(
            selectedTower
        );

    }

    else if(selectedTower){

        hideSelectedInfo();

    }

}


function setMessage(text){

    document.getElementById(
        "message"
    ).textContent = text;

}


/* =========================================================
   MAIN LOOP
========================================================= */

let lastTime =
    performance.now();


function loop(now){

    let dt =
        now-lastTime;


    lastTime = now;


    dt =
        Math.min(
            dt,
            50
        );


    update(dt);

    draw();


    requestAnimationFrame(
        loop
    );

}


/* =========================================================
   INITIALIZATION
========================================================= */

renderTowerList();

updateUI();

requestAnimationFrame(
    loop
);

</script>

</body>
</html>
