<!DOCTYPE html>
<html>
<head>
<title>bullet</title>
<style>
body{background:#000;color:#fff;font-family:monospace;margin:0}
#top{padding:5px;border-bottom:1px solid #fff}
button{background:#000;color:#fff;border:1px solid #fff;font-family:monospace}
#game{position:relative;width:900px;height:600px;margin:10px auto;border:1px solid #fff;overflow:hidden}
#road{position:absolute;top:270px;left:0;width:900px;height:70px;border-top:1px solid #555;border-bottom:1px solid #555}
#road2{position:absolute;left:540px;top:120px;width:70px;height:190px;border-left:1px solid #555;border-right:1px solid #555}
#road3{position:absolute;left:540px;top:120px;width:360px;height:70px;border-top:1px solid #555;border-bottom:1px solid #555}

.tower{
    position:absolute;
    color:cyan;
    font-weight:bold;
    cursor:pointer;
    transform:translate(-50%,-50%);
}

.enemy{
    position:absolute;
    color:red;
    font-weight:bold;
    white-space:nowrap;
    transform:translate(-50%,-50%);
}

.bullet{
    position:absolute;
    color:yellow;
    font-size:10px;
    white-space:nowrap;
}

.hp{
    position:absolute;
    width:35px;
    height:3px;
    background:#333;
    top:18px;
    left:50%;
    transform:translateX(-50%);
}

.hp2{
    height:100%;
    background:#0f0;
}

#over{
    display:none;
    position:absolute;
    inset:0;
    background:#000;
    color:#fff;
    text-align:center;
    padding-top:200px;
    z-index:100;
}

#over button{
    padding:5px 15px;
}
</style>
</head>

<body>

<div id="top">
money: <span id="money">100</span> |
lives: <span id="lives">10</span> |
wave: <span id="wave">1</span> |
score: <span id="score">0</span>
<button onclick="startWave()">start wave</button>
<button onclick="speed()">speed: <span id="speed">1</span>x</button>
</div>

<div id="game">

<div id="road"></div>
<div id="road2"></div>
<div id="road3"></div>

<div id="over">
    <h2>game over</h2>
    score: <span id="final">0</span><br><br>
    <button onclick="restart()">restart</button>
</div>

</div>

<script>

let money=100;
let lives=10;
let wave=1;
let score=0;

let enemies=[];
let towers=[];
let bullets=[];

let spawning=false;
let leftToSpawn=0;
let spawnTimer=0;

let gameSpeed=1;
let last=performance.now();

const game=document.getElementById("game");

const moneyText=document.getElementById("money");
const livesText=document.getElementById("lives");
const waveText=document.getElementById("wave");
const scoreText=document.getElementById("score");
const speedText=document.getElementById("speed");

function ui(){
    moneyText.textContent=money;
    livesText.textContent=lives;
    waveText.textContent=wave;
    scoreText.textContent=score;
}

function path(d){

    let y=305;
    let x=610;

    if(d<x){
        return {x:d,y:y};
    }

    d-=x;

    if(d<180){
        return {x:x,y:y-d};
    }

    d-=180;

    return {
        x:x+d,
        y:125
    };
}

function onRoad(x,y){

    if(y>260 && y<350) return true;

    if(x>500 && x<650 && y>100 && y<340) return true;

    if(y>90 && y<210 && x>500) return true;

    return false;
}

game.onclick=function(e){

    if(e.target!==game &&
       !e.target.classList.contains("road")) return;

    let r=game.getBoundingClientRect();

    let x=e.clientX-r.left;
    let y=e.clientY-r.top;

    if(money<25) return;
    if(onRoad(x,y)) return;

    for(let t of towers){

        let dx=t.x-x;
        let dy=t.y-y;

        if(Math.hypot(dx,dy)<40) return;
    }

    money-=25;

    let el=document.createElement("div");

    el.className="tower";
    el.textContent="T";

    el.style.left=x+"px";
    el.style.top=y+"px";

    game.appendChild(el);

    towers.push({
        x:x,
        y:y,
        el:el,
        cooldown:0,
        range:180,
        fire:.65,
        damage:20
    });

    ui();
};

let types=[
    {name:"cat",hp:35,speed:75,reward:8},
    {name:"dog",hp:60,speed:50,reward:12},
    {name:"bird",hp:25,speed:110,reward:10},
    {name:"dragon",hp:180,speed:30,reward:30}
];

function spawn(){

    let type;

    if(wave>=5 && Math.random()<.15){
        type=types[3];
    }else if(Math.random()<.3){
        type=types[2];
    }else if(Math.random()<.5){
        type=types[1];
    }else{
        type=types[0];
    }

    let el=document.createElement("div");

    el.className="enemy";
    el.textContent=type.name;

    if(type.name==="dragon"){
        el.style.fontSize="18px";
    }

    game.appendChild(el);

    let hp=type.hp+wave*5;

    el.innerHTML=
        type.name+
        '<div class="hp"><div class="hp2"></div></div>';

    enemies.push({
        type:type,
        hp:hp,
        max:hp,
        d:0,
        el:el
    });
}

function startWave(){

    if(spawning) return;

    spawning=true;
    leftToSpawn=5+wave*2;
    spawnTimer=0;
}

function updateWave(dt){

    if(!spawning) return;

    spawnTimer-=dt;

    if(leftToSpawn>0 && spawnTimer<=0){

        spawn();

        leftToSpawn--;
        spawnTimer=.35;
    }

    if(leftToSpawn===0 && enemies.length===0){

        spawning=false;

        money+=20+wave*3;

        wave++;

        ui();
    }
}

function towerUpdate(dt){

    for(let t of towers){

        t.cooldown-=dt;

        if(t.cooldown>0) continue;

        let target=null;
        let best=Infinity;

        for(let e of enemies){

            let p=path(e.d);

            let dis=Math.hypot(
                p.x-t.x,
                p.y-t.y
            );

            if(dis<t.range && dis<best){

                target=e;
                best=dis;
            }
        }

        if(target){

            shoot(t,target);

            t.cooldown=t.fire;
        }
    }
}

function shoot(t,e){

    let el=document.createElement("div");

    el.className="bullet";
    el.textContent="bullet";

    game.appendChild(el);

    bullets.push({
        x:t.x,
        y:t.y,
        target:e,
        speed:450,
        damage:t.damage,
        el:el
    });
}

function bulletUpdate(dt){

    for(let i=bullets.length-1;i>=0;i--){

        let b=bullets[i];

        if(!enemies.includes(b.target)){

            b.el.remove();
            bullets.splice(i,1);
            continue;
        }

        let p=path(b.target.d);

        let dx=p.x-b.x;
        let dy=p.y-b.y;

        let dis=Math.hypot(dx,dy);
        let move=b.speed*dt;

        if(dis<=move){

            damage(b.target,b.damage);

            b.el.remove();
            bullets.splice(i,1);

        }else{

            b.x+=dx/dis*move;
            b.y+=dy/dis*move;

            b.el.style.left=b.x+"px";
            b.el.style.top=b.y+"px";
        }
    }
}

function damage(e,n){

    e.hp-=n;

    e.el.querySelector(".hp2").style.width=
        Math.max(0,e.hp/e.max*100)+"%";

    if(e.hp<=0){

        money+=e.type.reward;
        score+=e.type.reward*10;

        e.el.remove();

        let i=enemies.indexOf(e);

        if(i>=0) enemies.splice(i,1);

        ui();
    }
}

function enemyUpdate(dt){

    for(let i=enemies.length-1;i>=0;i--){

        let e=enemies[i];

        e.d+=e.type.speed*dt;

        let p=path(e.d);

        e.el.style.left=p.x+"px";
        e.el.style.top=p.y+"px";

        if(p.x>game.clientWidth+50){

            e.el.remove();
            enemies.splice(i,1);

            lives--;

            ui();

            if(lives<=0){
                end();
            }
        }
    }
}

function end(){

    document.getElementById("final").textContent=score;
    document.getElementById("over").style.display="block";
}

function speed(){

    gameSpeed=gameSpeed===1?2:1;

    speedText.textContent=gameSpeed;
}

function restart(){

    for(let t of towers)t.el.remove();
    for(let e of enemies)e.el.remove();
    for(let b of bullets)b.el.remove();

    towers=[];
    enemies=[];
    bullets=[];

    money=100;
    lives=10;
    wave=1;
    score=0;

    spawning=false;
    gameSpeed=1;

    speedText.textContent=1;

    document.getElementById("over").style.display="none";

    ui();
}

function loop(now){

    let dt=(now-last)/1000;
    last=now;

    dt=Math.min(dt,.05);
    dt*=gameSpeed;

    updateWave(dt);
    enemyUpdate(dt);
    towerUpdate(dt);
    bulletUpdate(dt);

    requestAnimationFrame(loop);
}

ui();
requestAnimationFrame(loop);

</script>

</body>
</html>
