<script>

/* =====================================================

function setDifficulty(value) {

/* =====================================================
   START GAME
===================================================== */

function startGame() {

document.getElementById(
"menu"

"none";

document.getElementById(
"gameScreen"
).style.display =
"block";


const d =
difficulties[
chosenDifficulty

).textContent =
maps[chosenMap].name;

/* =====================================================
   BUILD MAP
===================================================== */

function buildMap() {

game.innerHTML = "";


const map =
maps[chosenMap];


for (
let road of map.roads
) {

const r =
document.createElement("div");


r.style.position =
"absolute";

r.style.left =
road[0] + "px";

r.style.top =
road[1] + "px";

r.style.width =
road[2] + "px";

r.style.height =
road[3] + "px";

r.style.borderTop =
"1px solid black";

r.style.borderBottom =
"1px solid black";


game.appendChild(r);

}

}


/* =====================================================
   RESTART
===================================================== */

function restartGame() {

startGame();

}


/* =====================================================
   PAUSE
===================================================== */

function pauseGame() {

paused =
!paused;


document.getElementById(
"pauseButton"
).textContent =
paused ?
"Resume" :
"Pause";

}


/* =====================================================
   MENU
===================================================== */

function backToMenu() {

paused = true;


document.getElementById(
"gameScreen"
).style.display =
"none";

document.getElementById(
"menu"
).style.display =
"block";

}


/* =====================================================
   UI
===================================================== */

function updateUI() {

document.getElementById(
"money"
).textContent =
Math.floor(money);

document.getElementById(
"lives"
).textContent =
lives;

document.getElementById(
"round"
).textContent =
round;

document.getElementById(
"score"
).textContent =
score;

}


/* =====================================================
   SELECT TOWER
===================================================== */

function selectTowerType(type) {

selectedType = type;

selectedTower = null;

document.getElementById(
"selected"
).textContent =
towerTypes[type].name;

showNoTowerSelected();

}


/* =====================================================
   ROAD CHECK
===================================================== */

function onRoad(x,y) {

const roads =
maps[chosenMap].roads;


for (
let road of roads
) {

if (
x >= road[0] &&
x <= road[0]+road[2] &&
y >= road[1] &&
y <= road[1]+road[3]
) {

return true;

}

}

return false;

}


/* =====================================================
   BUILD TOWER
===================================================== */

game.addEventListener(
"click",
function(event) {

if (
paused
) return;


if (
event.target.classList.contains(
"tower"
)
) {

const tower =
towers.find(
t =>
t.element ===
event.target
);


if (tower) {

selectedTower =
tower;

selectedType =
tower.type;

showTowerInfo();

}

return;

}


const rect =
game.getBoundingClientRect();


const x =
event.clientX -
rect.left;

const y =
event.clientY -
rect.top;


const data =
towerTypes[
selectedType
];


if (
money <
data.cost
) return;


if (
onRoad(x,y)
) return;


for (
let tower of towers
) {

if (
Math.hypot(
tower.x-x,
tower.y-y
) < 35
) {

return;

}

}


money -=
data.cost;


const element =
document.createElement(
"span"
);


element.className =
"tower";


element.textContent =
data.name;


element.style.position =
"absolute";

element.style.left =
x+"px";

element.style.top =
y+"px";

element.style.transform =
"translate(-50%,-50%)";

element.style.fontWeight =
"bold";

element.style.cursor =
"pointer";


game.appendChild(
element
);


const tower = {

x:x,
y:y,

type:selectedType,

element:element,

cooldown:0,

farmTimer:5,

path1:0,
path2:0

};


towers.push(
tower
);

selectedTower =
tower;


showTowerInfo();

updateUI();

});


/* =====================================================
   UPGRADE COST
===================================================== */

function upgradeCost(level) {

return [
50,
100,
175,
275,
400
][level] || null;

}


/* =====================================================
   STATS
===================================================== */

function getStats(tower) {

const base =
towerTypes[
tower.type
];


let range =
base.range;

let damage =
base.damage;

let reload =
base.reload;

let splash =
0;

let slow =
0;

let pierce =
1;


if (
tower.type ===
"Arrow"
) {

damage *=
1 +
tower.path1*.35;

range +=
tower.path2*35;

}


if (
tower.type ===
"Rapid"
) {

reload /=
1+
tower.path1*.25;

damage *=
1+
tower.path2*.30;

}


if (
tower.type ===
"Cannon"
) {

splash =
tower.path1*20;

damage *=
1+
tower.path2*.35;

}


if (
tower.type ===
"Sniper"
) {

damage *=
1+
tower.path1*.45;

range +=
tower.path2*80;

}


if (
tower.type ===
"Ice"
) {

slow =
tower.path1*.5;

range +=
tower.path2*35;

}


if (
tower.type ===
"Wizard"
) {

damage *=
1+
tower.path1*.30;

pierce +=
tower.path2*2;

}


return {

range,
damage,
reload,
splash,
slow,
pierce

};

}


/* =====================================================
   FARM STATS
===================================================== */

function farmIncome(tower) {

let income =
15;


/*
   Income path:
   +$10 every level
*/

income +=
tower.path1*10;


/*
   Production path:
   makes the farm pay
   more frequently.
*/

let interval =
5 -
tower.path2*.7;


interval =
Math.max(
1.2,
interval
);


return {

income,
interval

};

}


/* =====================================================
   UPGRADE UI
===================================================== */

function showNoTowerSelected() {

document.getElementById(
"upgrades"
).innerHTML =
"Select a tower to see upgrades.";

}

}

towerTypes[

];

upgradeCost(
tower.path1

const cost2 =
upgradeCost(

);

"<hr>";

"<b>" +
data.name +

if (
tower.type ===

) {

farmIncome(tower);

"Current income: $" +

"Current interval: " +

}


html +=
data.tree1 +
" level " +
tower.path1 +
"/5<br>";


if (
tower.path1 >= 5
) {

"MAX";

}

else {

html +=
"<button onclick=\"upgradePath(1)\">" +
"Upgrade " +
data.tree1 +
" ($" +
cost1 +
")" +
"</button>";

}


html +=
"<br><br>";


html +=
data.tree2 +
" level " +

"/5<br>";


if (

) {

html +=
"MAX";

}

else {

"<button onclick=\"upgradePath(2)\">" +
"Upgrade " +

" ($" +
cost2 +
")" +
"</button>";

}


html +=
"<br><br>";


html +=
"<b>Next upgrades:</b>";


if (
tower.path1 < 5
) {

html +=
"<br>" +
data.tree1 +
": " +
upgradeDescription(
tower,

);

}


if (
tower.path2 < 5
) {

html +=
"<br>" +
data.tree2 +
": " +
upgradeDescription(
tower,
2
);

document.getElementById(
"upgrades"
).innerHTML =
html;

}


/* =====================================================
   UPGRADE DESCRIPTIONS
===================================================== */

function upgradeDescription(
tower,
path
) {

const level =
path === 1 ?
tower.path1 :
tower.path2;


if (
tower.type ===
"Farm"
) {

if (path === 1) {

return "$10 more income per payment";

}

return "payments happen faster";

}


if (
tower.type ===
"Arrow"
) {

return path===1 ?
"more damage" :
"more range";

}


if (
tower.type ===
"Rapid"
) {

return path===1 ?
"faster firing" :
"more damage";

}


if (
tower.type ===
"Cannon"
) {

return path===1 ?
"larger explosions" :
"more damage";

}


if (
tower.type ===
"Sniper"
) {

return path===1 ?
"more damage" :
"more range";

}


if (
tower.type ===
"Ice"
) {

return path===1 ?
"stronger slowing" :
"more range";

}


if (
tower.type ===
"Wizard"
) {

return path===1 ?
"more damage" :
"more targets hit";

}


return "stronger";

}


/* =====================================================
   UPGRADE
===================================================== */

function upgradePath(path) {

if (!selectedTower)
return;


const tower =
selectedTower;


const level =
path === 1 ?
tower.path1 :
tower.path2;


if (
level >= 5
)
return;


const cost =
upgradeCost(level);


if (
money <
cost
)
return;


money -=
cost;


if (
path === 1
) {

tower.path1++;

}

else {

tower.path2++;

}


updateTowerText(
tower
);

showTowerInfo();

updateUI();

}


/* =====================================================
   TOWER TEXT
===================================================== */

function updateTowerText(tower) {

const data =
towerTypes[
tower.type
];


const totalLevel =
tower.path1 +
tower.path2;


tower.element.textContent =
data.name +
" " +
totalLevel;

}


/* =====================================================
   PATH POSITION
===================================================== */

function getPath(distance) {

const path =
maps[chosenMap].path;


let remaining =
distance;


for (
let i=0;
i<path.length-1;
i++
) {

const a =
path[i];

const b =
path[i+1];


const dx =
b.x-a.x;

const dy =
b.y-a.y;


const length =
Math.hypot(
dx,
dy
);


if (
remaining <=
length
) {

const ratio =
remaining/
length;


return {

x:
a.x+
dx*ratio,

y:
a.y+
dy*ratio

};

}


remaining -=
length;

}


return path[
path.length-1
];

}


/* =====================================================
   PATH LENGTH
===================================================== */

function pathLength() {

const path =
maps[chosenMap].path;

let total=0;


for (
let i=0;
i<path.length-1;
i++
) {

total +=
Math.hypot(
path[i+1].x-
path[i].x,

path[i+1].y-
path[i].y
);

}


return total;

}


/* =====================================================
   SPAWN ENEMY
===================================================== */

function spawnEnemy() {

let type;

const r =
Math.random();


if (
round >= 12 &&
Math.random()<.06
) {

type =
enemyTypes[5];

}

else if (
round>=6 &&
r<.20
) {

type =
enemyTypes[4];

}

else if (
r<.40
) {

type =
enemyTypes[3];

}

else if (
r<.65
) {

type =
enemyTypes[2];

}

else if (
r<.85
) {

type =
enemyTypes[1];

}

else {

type =
enemyTypes[0];

}


const difficulty =
difficulties[
chosenDifficulty
];


let hp =
type.hp *
difficulty.enemyHealth;


hp +=
round*6;


if (
type.name ===
"boss"
) {

hp +=
round*40;

}


const element =
document.createElement(
"span"
);


element.textContent =
type.name;


element.style.position =
"absolute";

element.style.color =
"red";

element.style.fontWeight =
"bold";

element.style.transform =
"translate(-50%,-50%)";

element.style.whiteSpace =
"nowrap";


if (
type.name ===
"boss"
) {

element.style.fontSize =
"20px";

}


game.appendChild(
element
);


enemies.push({

type:type,

hp:hp,

distance:0,

speed:
type.speed*
difficulty.enemySpeed,

slow:0,

element:element

});

}


/* =====================================================
   START ROUND
===================================================== */

function startRound() {

if (
roundRunning ||
paused
)
return;


roundRunning =
true;


const difficulty =
difficulties[
chosenDifficulty
];


enemiesToSpawn =
Math.floor(
(
7+
round*2
)*
difficulty.roundSize
);


if (
round%5===0
) {

enemiesToSpawn +=5;

}


spawnTimer=0;

}


/* =====================================================
   ROUND UPDATE
===================================================== */

function roundUpdate(dt) {

if (
!roundRunning
) {

nextRoundTimer -=
dt;


if (
autoplay &&
nextRoundTimer<=0
) {

startRound();

}


return;

}


spawnTimer -=
dt;


if (
enemiesToSpawn>0 &&
spawnTimer<=0
) {

spawnEnemy();

enemiesToSpawn--;

spawnTimer =
Math.max(
.15,
.45-
round*.005
);

}


if (
enemiesToSpawn===0 &&
enemies.length===0
) {

roundRunning=false;

nextRoundTimer=3;

money +=
20+
round*3;

round++;

updateUI();

}

}


/* =====================================================
   TOWER UPDATE
===================================================== */

function towerUpdate(dt) {

for (
let tower of towers
) {


/*
   FARM
*/

if (
tower.type ===
"Farm"
) {

const farm =
farmIncome(tower);


tower.farmTimer -=
dt;


if (
tower.farmTimer<=0
) {

money +=
farm.income;

tower.farmTimer =
farm.interval;

updateUI();

}

continue;

}


/*
   COMBAT TOWER
*/

const stats =
getStats(tower);


tower.cooldown -=
dt;


if (
tower.cooldown>0
)
continue;


let target=null;

let best=-Infinity;


for (
let enemy of enemies
) {

const p =
getPath(
enemy.distance
);


const distance =
Math.hypot(
p.x-tower.x,
p.y-tower.y
);


if (
distance<=
stats.range
) {

if (
enemy.distance>
best
) {

target=enemy;

best=
enemy.distance;

}

}

}


if (target) {

fire(
tower,
target
);

tower.cooldown =
stats.reload;

}

}

}


/* =====================================================
   FIRE
===================================================== */

function fire(
tower,
target
) {

const stats =
getStats(tower);


const element =
document.createElement(
"span"
);


element.textContent =
"bullet";


element.style.position =
"absolute";

element.style.fontSize =
"10px";

element.style.fontWeight =
"bold";


game.appendChild(
element
);


bullets.push({

x:tower.x,

y:tower.y,

target:target,

speed:
towerTypes[
tower.type
].speed,

damage:
stats.damage,

splash:
stats.splash,

slow:
stats.slow,

pierce:
stats.pierce,

element:element

});

}


/* =====================================================
   BULLET UPDATE
===================================================== */

function bulletUpdate(dt) {

for (
let i=
bullets.length-1;

i>=0;

i--
) {

const bullet =
bullets[i];


if (
!enemies.includes(
bullet.target
)
) {

bullet.element.remove();

bullets.splice(
i,
1
);

continue;

}


const p =
getPath(
bullet.target.distance
);


const dx =
p.x-bullet.x;

const dy =
p.y-bullet.y;


const distance =
Math.hypot(
dx,
dy
);


const movement =
bullet.speed*dt;


if (
distance<=
movement
) {

hit(bullet);

bullet.element.remove();

bullets.splice(
i,
1
);

}

else {

bullet.x +=
dx/distance*
movement;

bullet.y +=
dy/distance*
movement;


bullet.element.style.left =
bullet.x+"px";

bullet.element.style.top =
bullet.y+"px";

}

}

}


/* =====================================================
   HIT
===================================================== */

function hit(bullet) {

const target =
bullet.target;


target.hp -=
bullet.damage;


/*
   ICE
*/

if (
bullet.slow>0
) {

target.slow =
Math.max(
target.slow,
1.5+
bullet.slow
);

}


/*
   CANNON SPLASH
*/

if (
bullet.splash>0
) {

const center =
getPath(
target.distance
);


for (
let enemy of enemies
) {

if (
enemy===target
)
continue;


const p =
getPath(
enemy.distance
);


if (
Math.hypot(
center.x-p.x,
center.y-p.y
)
<
55+
bullet.splash
) {

enemy.hp -=
bullet.damage*.45;

}

}

}


/*
   WIZARD PIERCE
*/

if (
bullet.pierce>1
) {

let hits=0;


const center =
getPath(
target.distance
);


for (
let enemy of enemies
) {

if (
enemy===target
)
continue;


if (
hits>=
bullet.pierce-1
)
break;


const p =
getPath(
enemy.distance
);


if (
Math.hypot(
center.x-p.x,
center.y-p.y
)
<
50
) {

enemy.hp -=
bullet.damage*.5;

hits++;

}

}

}


checkDeaths();

}


/* =====================================================
   DEATHS
===================================================== */

function checkDeaths() {

const difficulty =
difficulties[
chosenDifficulty
];


for (
let i=
enemies.length-1;

i>=0;

i--
) {

const enemy =
enemies[i];


if (
enemy.hp<=0
) {

money +=
enemy.type.reward*
difficulty.moneyMultiplier;

score +=
enemy.type.reward*10;


enemy.element.remove();


enemies.splice(
i,
1
);


updateUI();

}

}

}


/* =====================================================
   ENEMY UPDATE
===================================================== */

function enemyUpdate(dt) {

const total =
pathLength();


for (
let i=
enemies.length-1;

i>=0;

i--
) {

const enemy =
enemies[i];


let speed =
enemy.speed;


if (
enemy.slow>0
) {

speed*=.45;

enemy.slow-=dt;

}


enemy.distance +=
speed*dt;


const p =
getPath(
enemy.distance
);


enemy.element.style.left =
p.x+"px";

enemy.element.style.top =
p.y+"px";


if (
enemy.distance>
total
) {

enemy.element.remove();


enemies.splice(
i,
1
);


if (
enemy.type.name===
"boss"
) {

lives-=5;

}

else {

lives--;

}


updateUI();


if (
lives<=0
) {

gameOver();

}

}

}

}


/* =====================================================
   AUTOPLAY
===================================================== */

function toggleAuto() {

autoplay =
!autoplay;


document.getElementById(
"auto"
).textContent =
autoplay ?
"ON":
"OFF";


if (
autoplay &&
!roundRunning &&
enemies.length===0
) {

startRound();

}

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver() {

roundRunning=false;

paused=true;


document.getElementById(
"finalScore"
).textContent =
score;


document.getElementById(
"gameOver"
).style.display =
"block";

}


/* =====================================================
   GAME LOOP
===================================================== */

function loop(time) {

let dt =
(time-lastTime)/1000;


lastTime =
time;


dt =
Math.min(
dt,
.05
);


if (
!paused &&
document.getElementById(
"gameScreen"
).style.display!=="none"
) {

roundUpdate(dt);

enemyUpdate(dt);

towerUpdate(dt);

bulletUpdate(dt);

}


requestAnimationFrame(
loop
);

}


/* =====================================================
   INITIALIZE
===================================================== */

showNoTowerSelected();

requestAnimationFrame(
loop
);

</script>

</body>
</html>
