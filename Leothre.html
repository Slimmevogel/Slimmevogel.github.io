function startGame(diff) {

  paused = false;

  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "block";

  createTowerButtons();
  updateUI();
}

========================================================= */

  const bar =

  bar.innerHTML = "";

  Object.keys(towerTypes).forEach(key => {

    const t = towerTypes[key];

    const button =
      document.createElement("button");

    button.textContent =
      t.name + " ($" + t.cost + ")";

    button.onclick = () => {

      selectedTowerType = key;
      selectedTower = null;

    };

    bar.appendChild(button);

  });

}

  mouseX =

  mouseY =
    e.clientY - r.top;

});

  if(!gameRunning || paused)
    return;

  const r =
    canvas.getBoundingClientRect();

  const x =
    e.clientX-r.left;

  const y =
    e.clientY-r.top;


  if(selectedTowerType) {

    placeTower(x,y);

    return;
  }


  selectedTower = null;

  for(const t of towers) {

    if(
      distance(
        x,y,
        t.x,t.y
      ) < 25
    ) {

      selectedTower = t;
      break;

    }

  }

});


/* =========================================================
   PLACE TOWER
========================================================= */

function placeTower(x,y) {

  const type =
    towerTypes[selectedTowerType];

  if(!type)
    return;

  if(money < type.cost)
    return;

  const count =
    towers.filter(
      t => t.type === selectedTowerType
    ).length;

  if(count >= type.max)
    return;

  if(type.water && !isWater(x,y))
    return;

  if(type.land && isWater(x,y))
    return;

  if(isPath(x,y))
    return;


  towers.push({

    type:selectedTowerType,

    x,
    y,

    level:[0,0,0],

    lastShot:0,

    incomeTimer:0,

    kills:0

  });


  money -= type.cost;

  selectedTowerType = null;

  selectedTower = null;

  updateUI();

}


/* =========================================================
   WATER
========================================================= */

function isWater(x,y) {

  return waterZones.some(z =>

    x > z.x &&
    x < z.x+z.w &&
    y > z.y &&
    y < z.y+z.h

  );

}


/* =========================================================
   PATH COLLISION
========================================================= */

function isPath(x,y) {

  for(
    let i=0;
    i<path.length-1;
    i++
  ) {

    const a = path[i];
    const b = path[i+1];

    const d =
      pointSegmentDistance(
        x,y,
        a[0],a[1],
        b[0],b[1]
      );

    if(d < 35)
      return true;

  }

  return false;

}


function pointSegmentDistance(
  px,py,
  x1,y1,
  x2,y2
) {

  const dx = x2-x1;
  const dy = y2-y1;

  if(dx === 0 && dy === 0)
    return distance(
      px,py,
      x1,y1
    );

  let t =
    (
      (px-x1)*dx+
      (py-y1)*dy
    ) /
    (
      dx*dx+
      dy*dy
    );

  t =
    Math.max(
      0,
      Math.min(1,t)
    );

  return distance(
    px,
    py,
    x1+t*dx,
    y1+t*dy
  );

}


/* =========================================================
   START WAVE
========================================================= */

function startWave() {

  if(waveActive)
    return;

  wave++;

  spawnQueue = [];


  if(wave % 10 === 0) {

    spawnQueue.push({
      type:"boss"
    });


    for(
      let i=0;
      i<5+Math.floor(wave/5);
      i++
    ) {

      spawnQueue.push({
        type:randomEnemyType()
      });

    }

  }
  else {

    const amount =
      Math.floor(
        8+wave*2.4
      );

    for(
      let i=0;
      i<amount;
      i++
    ) {

      spawnQueue.push({
        type:randomEnemyType()
      });

    }

  }


  waveActive = true;
  spawnTimer = 0;

}


/* =========================================================
   ENEMY TYPE SELECTION
========================================================= */

function randomEnemyType() {

  const pool = ["normal"];


  if(wave >= 2)
    pool.push("speedy");

  if(wave >= 3)
    pool.push("healthy");

  if(wave >= 4)
    pool.push("armored");

  if(wave >= 5)
    pool.push("bombonly");

  if(wave >= 6)
    pool.push("iceproof");

  if(wave >= 7)
    pool.push("camouflage");

  if(wave >= 8)
    pool.push("regeneration");

  if(wave >= 9)
    pool.push("shielded");

  if(wave >= 11)
    pool.push("flying");

  if(wave >= 12)
    pool.push("swarm");

  if(wave >= 13)
    pool.push("splitter");

  if(wave >= 14)
    pool.push("giant");

  if(wave >= 15)
    pool.push("burning");

  if(wave >= 16)
    pool.push("electric");


  let chosen =
    pool[
      Math.floor(
        Math.random()*pool.length
      )
    ];


  /*
    Special enemy types are deliberately
    less common than normal enemies.
  */

  if(
    chosen !== "normal" &&
    Math.random() < 0.45
  ) {

    chosen = "normal";

  }


  return chosen;

}


/* =========================================================
   PLAYER DAMAGE SCALING
========================================================= */

function getPlayerDamageScale() {

  if(towers.length === 0)
    return 1;


  let totalDamage = 0;


  for(const t of towers) {

    const type =
      towerTypes[t.type];

    if(!type.damage)
      continue;


    let damage =
      type.damage *
      (1+t.level[0]*0.35);


    damage *=
      (1+t.level[1]*0.20);


    /*
      Ability upgrades increase
      the overall potential slightly.
    */

    damage *=
      (1+t.level[2]*0.10);


    totalDamage += damage;

  }


  /*
    Maximum extra scaling is 3x.
    This prevents tower power from
    making enemies completely impossible.
  */

  return 1+
    Math.min(
      3,
      totalDamage/100
    );

}


/* =========================================================
   SPAWN ENEMY
========================================================= */

function spawnEnemy(type) {

  const d =
    difficulties[difficulty];

  const base =
    enemyTypes[type];


  /*
    Normal wave scaling.
  */

  const waveScale =
    1+
    Math.pow(
      wave,
      1.18
    )*0.055;


  /*
    Extra scaling every five waves.
  */

  const milestoneScale =
    1+
    Math.floor(wave/5)*0.08;


  /*
    Scaling based on the damage
    potential of the player's army.
  */

  const playerDamageScale =
    getPlayerDamageScale();


  let hp =
    base.hp *
    d.hp *
    waveScale *
    milestoneScale *
    playerDamageScale;


  /*
    Bosses massively scale.
  */

  if(base.boss) {

    hp =
      1000 *
      d.hp *
      Math.pow(
        1.16,
        wave/10
      );

    hp *=
      1+
      wave*0.12;

    /*
      Bosses also react strongly
      to tower power.
    */

    hp *=
      1+
      getPlayerDamageScale()*0.75;

  }


  enemies.push({

    type:type,

    x:path[0][0],
    y:path[0][1],

    pathIndex:0,

    hp:hp,
    maxHp:hp,

    speed:
      base.speed *
      d.speed *
      (
        1+
        wave*0.008
      ),

    reward:
      Math.round(
        base.reward *
        d.reward *
        (
          1+
          wave*0.025
        )
      ),

    shield:
      base.shield || 0,

    slow:1,

    dead:false,

    distanceTravelled:0,

    regenTimer:0

  });

}


/* =========================================================
   MAIN UPDATE
========================================================= */

function update(dt) {

  if(
    !gameRunning ||
    paused
  )
    return;


  dt *= gameSpeed;


  /* -----------------------------------------
     SPAWNING
  ----------------------------------------- */

  if(waveActive) {

    spawnTimer -= dt;


    if(
      spawnTimer <= 0 &&
      spawnQueue.length > 0
    ) {

      const next =
        spawnQueue.shift();

      spawnEnemy(next.type);

      spawnTimer = 220;

    }


    if(
      spawnQueue.length === 0 &&
      enemies.length === 0
    ) {

      waveActive = false;


      if(autoplay) {

        setTimeout(() => {

          if(
            gameRunning &&
            autoplay
          ) {

            startWave();

          }

        },300);

      }

    }

  }


  /* -----------------------------------------
     FARM INCOME
     ONLY DURING ACTIVE WAVES
  ----------------------------------------- */

  if(waveActive) {

    for(const t of towers) {

      const type =
        towerTypes[t.type];

      if(!type.farm)
        continue;


      t.incomeTimer += dt;


      if(t.incomeTimer >= 1000) {

        const times =
          Math.floor(
            t.incomeTimer/1000
          );


        const income =
          type.income *
          (
            1+
            t.level[0]*0.25
          );


        money +=
          income*times;


        t.incomeTimer %= 1000;

      }

    }

  }


  updateEnemies(dt);
  updateTowers(dt);
  updateBullets(dt);
  updateEffects(dt);


  if(lives <= 0) {

    gameRunning = false;

    alert(
      "Game over. You reached wave "+
      wave+"."
    );

    document.getElementById(
      "game"
    ).style.display="none";

    document.getElementById(
      "menu"
    ).style.display="block";

  }


  updateUI();

}


/* =========================================================
   UPDATE ENEMIES
========================================================= */

function updateEnemies(dt) {

  for(const e of enemies) {

    if(e.dead)
      continue;


    const type =
      enemyTypes[e.type];


    /* Regeneration */

    if(type.regen) {

      e.regenTimer += dt;


      if(e.regenTimer >= 1000) {

        e.hp =
          Math.min(
            e.maxHp,
            e.hp+
            e.maxHp*0.025
          );

        e.regenTimer=0;

      }

    }


    const target =
      path[
        e.pathIndex+1
      ];


    if(!target) {

      e.dead=true;

      /*
        Bosses deal much more damage
        to the player's HP.
      */

      if(type.boss)
        lives -= 20;
      else
        lives -= 1;

      continue;

    }


    let dx =
      target[0]-e.x;

    let dy =
      target[1]-e.y;


    const dist =
      Math.sqrt(
        dx*dx+
        dy*dy
      );


    if(dist < 2) {

      e.pathIndex++;

      continue;

    }


    dx /= dist;
    dy /= dist;


    const movement =
      e.speed *
      e.slow *
      dt *
      0.08;


    e.x +=
      dx*movement;

    e.y +=
      dy*movement;


    e.distanceTravelled +=
      movement;

  }


  enemies =
    enemies.filter(
      e=>!e.dead
    );

}


/* =========================================================
   UPDATE TOWERS
========================================================= */

function updateTowers(dt) {

  for(const t of towers) {

    const type =
      towerTypes[t.type];


    if(type.farm)
      continue;


    t.lastShot += dt;


    const fireRate =
      type.fireRate *
      Math.pow(
        0.9,
        t.level[1]
      );


    if(
      t.lastShot <
      fireRate
    )
      continue;


    const target =
      findTarget(t);


    if(!target)
      continue;


    t.lastShot=0;

    fireTower(
      t,
      target
    );

  }

}


/* =========================================================
   FIND TARGET
========================================================= */

function findTarget(t) {

  const type =
    towerTypes[t.type];


  let best=null;
  let bestDistance=-Infinity;


  for(const e of enemies) {

    if(e.dead)
      continue;


    const dist =
      distance(
        t.x,t.y,
        e.x,e.y
      );


    if(dist > type.range)
      continue;


    if(
      e.type==="camouflage" &&
      !towerCanSeeCamo(t)
    )
      continue;


    if(
      enemyTypes[e.type].flying &&
      !towerCanHitFlying(t)
    )
      continue;


    if(
      enemyTypes[e.type].bombOnly &&
      !type.bomb
    )
      continue;


    if(
      e.distanceTravelled >
      bestDistance
    ) {

      best=e;
      bestDistance=
        e.distanceTravelled;

    }

  }


  return best;

}


/* =========================================================
   SPECIAL TOWER CAPABILITIES
========================================================= */

function towerCanSeeCamo(t) {

  const type =
    towerTypes[t.type];

  return !!(
    type.camo ||
    t.level[1] >= 2
  );

}


function towerCanHitFlying(t) {

  const type =
    towerTypes[t.type];

  return !!(
    type.antiAir ||
    t.level[0] >= 2
  );

}


/* =========================================================
   FIRE
========================================================= */

function fireTower(
  t,
  target
) {

  const type =
    towerTypes[t.type];


  let damage =
    type.damage *
    (
      1+
      t.level[0]*0.35
    );


  damage *=
    (
      1+
      t.level[1]*0.20
    );


  bullets.push({

    x:t.x,
    y:t.y,

    target:target,

    damage:damage,

    type:type.projectile,

    splash:type.splash || 0,

    slow:type.slow || 0,

    tower:t

  });

}


/* =========================================================
   BULLETS
========================================================= */

function updateBullets(dt) {

  for(const b of bullets) {

    if(
      !b.target ||
      b.target.dead
    ) {

      b.dead=true;
      continue;

    }


    const dx =
      b.target.x-b.x;

    const dy =
      b.target.y-b.y;


    const dist =
      Math.sqrt(
        dx*dx+
        dy*dy
      );


    const speed =
      b.type==="laser"
      ?1.8
      :b.type==="storm"
      ?1.4
      :b.type==="missile"
      ?0.7
      :1.0;


    if(dist < 8) {

      hitEnemy(
        b,
        b.target
      );

      b.dead=true;

      continue;

    }


    b.x +=
      dx/dist*
      speed*
      dt;

    b.y +=
      dy/dist*
      speed*
      dt;

  }


  bullets =
    bullets.filter(
      b=>!b.dead
    );

}


/* =========================================================
   HIT ENEMY
========================================================= */

function hitEnemy(
  b,
  e
) {

  if(e.dead)
    return;


  const type =
    enemyTypes[e.type];


  /* Bomb-only */

  if(
    type.bombOnly &&
    !b.tower.type.includes("cannon") &&
    b.type!=="bomb" &&
    b.type!=="missile"
  ) {

    createTextEffect(
      e.x,
      e.y-25,
      "immune"
    );

    return;

  }


  /* Ice protection */

  if(
    type.iceImmune &&
    b.type==="ice"
  ) {

    createTextEffect(
      e.x,
      e.y-25,
      "ice immune"
    );

    return;

  }


  /* Electric protection */

  if(
    type.electricImmune &&
    b.type==="electric"
  ) {

    createTextEffect(
      e.x,
      e.y-25,
      "electric immune"
    );

    return;

  }


  let damage =
    b.damage;


  /* Armor */

  if(
    type.armor &&
    b.type!=="bomb" &&
    b.type!=="missile"
  ) {

    damage =
      Math.max(
        1,
        damage*0.25
      );

  }


  /* Shield */

  if(e.shield > 0) {

    const absorbed =
      Math.min(
        e.shield,
        damage
      );

    e.shield -=
      absorbed;

    damage -=
      absorbed;

  }


  if(damage > 0)
    e.hp -= damage;


  /* Slow */

  if(
    b.slow &&
    !type.iceImmune
  ) {

    e.slow =
      Math.min(
        e.slow,
        b.slow
      );


    setTimeout(() => {

      if(e && !e.dead)
        e.slow=1;

    },1200);

  }


  /* Splash */

  if(b.splash > 0) {

    for(
      const other
      of enemies
    ) {

      if(
        other===e ||
        other.dead
      )
        continue;


      if(
        distance(
          e.x,e.y,
          other.x,other.y
        ) <= b.splash
      ) {

        let splashDamage =
          b.damage*0.6;


        if(
          enemyTypes[
            other.type
          ].armor
        ) {

          splashDamage *= 0.25;

        }


        other.hp -=
          splashDamage;

      }

    }

  }


  createHitEffect(
    e.x,
    e.y,
    b.type
  );


  if(e.hp <= 0)
    killEnemy(
      e,
      b.tower
    );

}


/* =========================================================
   KILL
========================================================= */

function killEnemy(
  e,
  tower
) {

  if(e.dead)
    return;


  e.dead=true;

  money +=
    e.reward;


  if(tower)
    tower.kills++;


  /* Splitter */

  if(
    enemyTypes[e.type].split
  ) {

    for(
      let i=0;
      i<3;
      i++
    ) {

      const child =
        enemyTypes.swarm;


      enemies.push({

        type:"swarm",

        x:
          e.x+
          Math.random()*15-7,

        y:
          e.y+
          Math.random()*15-7,

        pathIndex:
          e.pathIndex,

        hp:child.hp,

        maxHp:child.hp,

        speed:child.speed,

        reward:child.reward,

        shield:0,

        slow:1,

        dead:false,

        distanceTravelled:
          e.distanceTravelled,

        regenTimer:0

      });

    }

  }

}


/* =========================================================
   EFFECTS
========================================================= */

function createHitEffect(
  x,y,type
) {

  effects.push({

    kind:"hit",

    x:x,
    y:y,

    type:type,

    life:250,

    maxLife:250,

    radius:5

  });

}


function createTextEffect(
  x,y,text
) {

  effects.push({

    kind:"text",

    x:x,
    y:y,

    text:text,

    life:700,

    maxLife:700

  });

}


function updateEffects(dt) {

  for(const e of effects) {

    e.life -= dt;


    if(e.kind==="hit")
      e.radius +=
        dt*0.04;


    if(e.kind==="text")
      e.y -=
        dt*0.025;

  }


  effects =
    effects.filter(
      e=>e.life>0
    );

}


/* =========================================================
   UPGRADES
========================================================= */

function upgradeSelected(
  pathIndex
) {

  const t =
    selectedTower;


  if(!t)
    return;


  if(t.level[pathIndex]>=5)
    return;


  const costs = [
    120,
    220,
    400,
    700,
    1200
  ];


  const cost =
    costs[
      t.level[pathIndex]
    ]*
    (
      pathIndex===2
      ?1.4
      :1
    );


  if(money < cost)
    return;


  money -= cost;

  t.level[pathIndex]++;

  updateUI();

}


/* =========================================================
   SELL
========================================================= */

function sellSelected() {

  if(!selectedTower)
    return;


  const type =
    towerTypes[
      selectedTower.type
    ];


  let value =
    type.cost*0.7;


  const upgrades =
    selectedTower.level[0]+
    selectedTower.level[1]+
    selectedTower.level[2];


  value *=
    1+
    upgrades*0.25;


  money +=
    Math.floor(value);


  towers =
    towers.filter(
      t=>t!==selectedTower
    );


  selectedTower=null;

  updateUI();

}


/* =========================================================
   DRAW
========================================================= */

function draw() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  drawWater();
  drawPath();
  drawTowers();
  drawEnemies();
  drawBullets();
  drawEffects();


  if(paused) {

    ctx.font="40px Arial";

    ctx.fillText(
      "PAUSED",
      650,
      400
    );

  }

}


/* =========================================================
   DRAW WATER
========================================================= */

function drawWater() {

  ctx.font="20px Arial";


  for(const z of waterZones) {

    ctx.strokeRect(
      z.x,
      z.y,
      z.w,
      z.h
    );


    ctx.fillText(
      "water",
      z.x+10,
      z.y+25
    );

  }

}


/* =========================================================
   DRAW PATH
========================================================= */

function drawPath() {

  ctx.lineWidth=45;

  ctx.beginPath();


  ctx.moveTo(
    path[0][0],
    path[0][1]
  );


  for(
    let i=1;
    i<path.length;
    i++
  ) {

    ctx.lineTo(
      path[i][0],
      path[i][1]
    );

  }


  ctx.stroke();

  ctx.lineWidth=1;

}


/* =========================================================
   DRAW TOWERS
========================================================= */

function drawTowers() {

  ctx.textAlign="center";


  for(const t of towers) {

    const type =
      towerTypes[t.type];


    /*
      Range circle.
    */

    if(
      selectedTower===t
    ) {

      ctx.beginPath();

      ctx.arc(
        t.x,
        t.y,
        type.range,
        0,
        Math.PI*2
      );

      ctx.stroke();


      /*
        Hitbox circle.
      */

      ctx.beginPath();

      ctx.arc(
        t.x,
        t.y,
        22,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }


    ctx.font="16px Arial";


    ctx.fillText(
      type.name,
      t.x,
      t.y+5
    );


    /*
      Ability visual.
    */

    if(t.level[2]>0) {

      ctx.beginPath();

      ctx.arc(
        t.x,
        t.y,
        27+
        t.level[2]*3,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }

  }


  ctx.textAlign="left";

}


/* =========================================================
   DRAW ENEMIES
========================================================= */

function drawEnemies() {

  ctx.textAlign="center";


  for(const e of enemies) {

    const type =
      enemyTypes[e.type];


    ctx.font =
      Math.max(
        12,
        type.size
      )+
      "px Arial";


    /*
      Normal enemies simply say enemy.
      They do NOT display "normal".
    */

    const name =
      e.type==="normal"
      ?"enemy"
      :enemyName(e.type);


    ctx.fillText(
      name,
      e.x,
      e.y
    );


    /*
      Special property is above
      the enemy.
    */

    if(type.name) {

      ctx.font="12px Arial";

      ctx.fillText(
        type.name,
        e.x,
        e.y-type.size-5
      );

    }


    /*
      Boss health bar.
    */

    if(type.boss) {

      ctx.strokeRect(
        e.x-50,
        e.y-65,
        100,
        8
      );


      ctx.fillRect(
        e.x-50,
        e.y-65,
        100*
        Math.max(
          0,
          e.hp/e.maxHp
        ),
        8
      );

    }


    /*
      Shield visual.
    */

    if(e.shield>0) {

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        type.size+5,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }


    /*
      Health bar.
    */

    ctx.strokeRect(
      e.x-20,
      e.y+10,
      40,
      4
    );


    ctx.fillRect(
      e.x-20,
      e.y+10,
      40*
      Math.max(
        0,
        e.hp/e.maxHp
      ),
      4
    );

  }


  ctx.textAlign="left";

}


/* =========================================================
   ENEMY DISPLAY NAMES
========================================================= */

function enemyName(type) {

  const names = {

    speedy:"runner",

    healthy:"tank",

    armored:"armor",

    bombonly:"bomb only",

    iceproof:"ice protection",

    camouflage:"hidden",

    regeneration:"healing",

    shielded:"shield",

    flying:"flying",

    swarm:"swarm",

    splitter:"splitter",

    giant:"giant",

    burning:"burning",

    electric:"electric",

    boss:"BOSS"

  };


  return names[type] ||
    "enemy";

}


/* =========================================================
   DRAW BULLETS
========================================================= */

function drawBullets() {

  ctx.textAlign="center";


  for(const b of bullets) {

    ctx.font="12px Arial";


    ctx.fillText(
      b.type,
      b.x,
      b.y
    );

  }


  ctx.textAlign="left";

}


/* =========================================================
   DRAW EFFECTS
========================================================= */

function drawEffects() {

  for(const e of effects) {

    const alpha =
      e.life/e.maxLife;


    ctx.globalAlpha =
      alpha;


    if(e.kind==="hit") {

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        e.radius,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }


    if(e.kind==="text") {

      ctx.font="13px Arial";

      ctx.fillText(
        e.text,
        e.x,
        e.y
      );

    }


    ctx.globalAlpha=1;

  }

}


/* =========================================================
   PLACEMENT PREVIEW
========================================================= */

function drawPlacementPreview() {

  if(!selectedTowerType)
    return;


  const type =
    towerTypes[
      selectedTowerType
    ];


  /*
    Range.
  */

  ctx.beginPath();

  ctx.arc(
    mouseX,
    mouseY,
    type.range,
    0,
    Math.PI*2
  );

  ctx.stroke();


  /*
    Hitbox.
  */

  ctx.beginPath();

  ctx.arc(
    mouseX,
    mouseY,
    22,
    0,
    Math.PI*2
  );

  ctx.stroke();


  ctx.font="14px Arial";

  ctx.fillText(
    type.name,
    mouseX,
    mouseY
  );

}


/* =========================================================
   UI
========================================================= */

function updateUI() {

  document.getElementById(
    "moneyText"
  ).textContent =
    "Money: "+
    Math.floor(money);


  document.getElementById(
    "livesText"
  ).textContent =
    "HP: "+
    Math.floor(lives);


  document.getElementById(
    "waveText"
  ).textContent =
    "Wave: "+
    wave;


  if(selectedTower) {

    const type =
      towerTypes[
        selectedTower.type
      ];


    const costs = [
      120,
      220,
      400,
      700,
      1200
    ];


    let text =
      "Selected: "+
      type.name+
      " | Level "+
      selectedTower.level.join("-");


    text +=
      " | Upgrades: ";


    for(
      let i=0;
      i<3;
      i++
    ) {

      const level =
        selectedTower.level[i];


      if(level < 5) {

        const cost =
          Math.floor(
            costs[level]*
            (
              i===2
              ?1.4
              :1
            )
          );


        text +=
          "Path "+
          (i+1)+
          " $"+
          cost+
          " ";

      }
      else {

        text +=
          "Path "+
          (i+1)+
          " MAX ";

      }

    }


    document.getElementById(
      "selectedInfo"
    ).textContent =
      text;

  }
  else {

    document.getElementById(
      "selectedInfo"
    ).textContent =
      selectedTowerType
      ?
      "Placing: "+
      towerTypes[
        selectedTowerType
      ].name
      :
      "";

  }

}


/* =========================================================
   HELPERS
========================================================= */

function distance(
  x1,y1,
  x2,y2
) {

  const dx =
    x2-x1;

  const dy =
    y2-y1;

  return Math.sqrt(
    dx*dx+
    dy*dy
  );

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  e => {

    if(e.key===" ")
      pauseGame();


    if(
      e.key.toLowerCase()==="r" &&
      gameRunning
    )
      restartGame();


    if(e.key==="Enter")
      startWave();

  }
);


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(now) {

  const dt =
    Math.min(
      50,
      now-lastTime
    );


  lastTime=now;


  update(dt);

  draw();

  drawPlacementPreview();


  requestAnimationFrame(
    loop
  );

}


requestAnimationFrame(
  loop
);


/* =========================================================
   INITIAL STATE
========================================================= */

document.getElementById(
  "menu"
).style.display="block";


document.getElementById(
  "game"
).style.display="none";

</script>
