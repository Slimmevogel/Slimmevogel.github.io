<!DOCTYPE html>
<html>
<head>
<title>letter defense</title>
</head>

<body>

<h2>letter defense</h2>

<div>
Money: $<span id="money">200</span>
&nbsp; | &nbsp;
Lives: <span id="lives">40</span>
&nbsp; | &nbsp;
Round: <span id="round">1</span>
&nbsp; | &nbsp;
Score: <span id="score">0</span>
</div>

<br>

<button onclick="selectTower('Arrow')">Arrow Tower $30</button>
<button onclick="selectTower('Rapid')">Rapid Tower $55</button>
<button onclick="selectTower('Cannon')">Cannon Tower $90</button>
<button onclick="selectTower('Sniper')">Sniper Tower $120</button>
<button onclick="selectTower('Ice')">Ice Tower $100</button>
<button onclick="selectTower('Wizard')">Wizard Tower $150</button>

<br><br>

Selected tower:
<b id="selected">Arrow Tower</b>

<br><br>

<button onclick="toggleAuto()">
Autoplay: <span id="auto">OFF</span>
</button>

<button onclick="startRound()">
Start Round
</button>

<button onclick="upgradeSelected()">
Upgrade selected tower
</button>

<div
    id="game"
    style="
        position:relative;
        width:900px;
        height:600px;
        border:1px solid black;
        overflow:hidden;
        margin-top:15px;
    "
>

    <!-- PATH -->

    <div style="
        position:absolute;
        left:0;
        top:270px;
        width:560px;
        height:80px;
        border-top:1px solid black;
        border-bottom:1px solid black;
    "></div>

    <div style="
        position:absolute;
        left:520px;
        top:150px;
        width:80px;
        height:160px;
        border-left:1px solid black;
        border-right:1px solid black;
    "></div>

    <div style="
        position:absolute;
        left:520px;
        top:120px;
        width:380px;
        height:80px;
        border-top:1px solid black;
        border-bottom:1px solid black;
    "></div>

</div>

<p>
Click empty ground to build a tower.
Click a tower to select it.
</p>

<div id="gameOver" style="display:none;">

    <h2>Game Over</h2>

    Score:
    <span id="finalScore"></span>

    <br><br>

    <button onclick="location.reload()">
        Restart
    </button>

</div>


<script>

const game =
    document.getElementById("game");


/* -------------------------
   GAME VARIABLES
------------------------- */

let money = 200;
let lives = 40;
let round = 1;
let score = 0;

let enemies = [];
let towers = [];
let bullets = [];

let selectedType = "Arrow";
let selectedTower = null;

let autoplay = false;

let roundRunning = false;
let enemiesToSpawn = 0;
let spawnTimer = 0;

let nextRoundTimer = 3;

let lastTime = performance.now();


/* -------------------------
   TOWER TYPES
------------------------- */

const towerTypes = {

    Arrow: {

        cost: 30,

        range: 150,

        damage: 25,

        reload: 0.8,

        projectileSpeed: 500,

        name: "Arrow Tower",

        special: "single"

    },

    Rapid: {

        cost: 55,

        range: 125,

        damage: 9,

        reload: 0.16,

        projectileSpeed: 550,

        name: "Rapid Tower",

        special: "single"

    },

    Cannon: {

        cost: 90,

        range: 170,

        damage: 45,

        reload: 1.2,

        projectileSpeed: 350,

        name: "Cannon Tower",

        special: "splash"

    },

    Sniper: {

        cost: 120,

        range: 500,

        damage: 120,

        reload: 2.5,

        projectileSpeed: 900,

        name: "Sniper Tower",

        special: "single"

    },

    Ice: {

        cost: 100,

        range: 140,

        damage: 8,

        reload: 0.7,

        projectileSpeed: 400,

        name: "Ice Tower",

        special: "slow"

    },

    Wizard: {

        cost: 150,

        range: 200,

        damage: 35,

        reload: 0.55,

        projectileSpeed: 600,

        name: "Wizard Tower",

        special: "pierce"

    }

};


/* -------------------------
   ENEMIES
------------------------- */

const enemyTypes = [

    {
        name: "dot",
        hp: 20,
        speed: 75,
        reward: 5
    },

    {
        name: "cat",
        hp: 40,
        speed: 65,
        reward: 8
    },

    {
        name: "dog",
        hp: 75,
        speed: 48,
        reward: 12
    },

    {
        name: "bird",
        hp: 30,
        speed: 105,
        reward: 10
    },

    {
        name: "armored",
        hp: 180,
        speed: 30,
        reward: 25
    },

    {
        name: "boss",
        hp: 700,
        speed: 18,
        reward: 100
    }

];


/* -------------------------
   UI
------------------------- */

function updateUI() {

    document.getElementById("money")
        .textContent = money;

    document.getElementById("lives")
        .textContent = lives;

    document.getElementById("round")
        .textContent = round;

    document.getElementById("score")
        .textContent = score;

}


/* -------------------------
   SELECT TOWER
------------------------- */

function selectTower(type) {

    selectedType = type;

    document.getElementById("selected")
        .textContent =
        towerTypes[type].name;

}


/* -------------------------
   ROAD CHECK
------------------------- */

function onRoad(x, y) {

    if (
        x < 570 &&
        y > 245 &&
        y < 375
    ) {
        return true;
    }

    if (
        x > 510 &&
        x < 650 &&
        y > 100 &&
        y < 370
    ) {
        return true;
    }

    if (
        x > 510 &&
        y > 95 &&
        y < 220
    ) {
        return true;
    }

    return false;
}


/* -------------------------
   BUILD TOWER
------------------------- */

game.addEventListener(
    "click",
    function(event) {

        if (
            event.target.classList.contains(
                "tower"
            )
        ) {

            for (
                let tower of towers
            ) {

                if (
                    event.target ===
                    tower.element
                ) {

                    selectedTower = tower;

                    document.getElementById(
                        "selected"
                    ).textContent =
                        towerTypes[
                            tower.type
                        ].name +
                        " level " +
                        tower.level;

                    return;
                }

            }

            return;
        }


        const rect =
            game.getBoundingClientRect();

        const x =
            event.clientX -
            rect.left;

        const y =
            event.clientY -
            rect.top;


        const data =
            towerTypes[selectedType];


        if (money < data.cost) {
            return;
        }

        if (onRoad(x, y)) {
            return;
        }


        for (
            let tower of towers
        ) {

            if (
                Math.hypot(
                    tower.x - x,
                    tower.y - y
                ) < 35
            ) {

                return;

            }

        }


        money -= data.cost;


        const element =
            document.createElement("span");

        element.className = "tower";

        element.textContent =
            data.name;


        element.style.position =
            "absolute";

        element.style.left =
            x + "px";

        element.style.top =
            y + "px";

        element.style.transform =
            "translate(-50%,-50%)";

        element.style.fontWeight =
            "bold";

        element.style.cursor =
            "pointer";

        element.title =
            data.name;


        game.appendChild(element);


        const tower = {

            x: x,

            y: y,

            type: selectedType,

            level: 1,

            cooldown: 0,

            element: element

        };


        towers.push(tower);

        selectedTower = tower;

        updateUI();

    }
);


/* -------------------------
   UPGRADE
------------------------- */

function upgradeSelected() {

    if (!selectedTower) {
        return;
    }


    const tower =
        selectedTower;

    const cost =
        50 * tower.level;


    if (money < cost) {
        return;
    }


    if (tower.level >= 5) {
        return;
    }


    money -= cost;

    tower.level++;


    tower.element.textContent =
        towerTypes[
            tower.type
        ].name +
        " " +
        tower.level;


    updateUI();

}


/* -------------------------
   PATH
------------------------- */

function getPath(distance) {

    const first = 560;

    const vertical = 150;


    if (distance < first) {

        return {

            x: distance,

            y: 310

        };

    }


    if (
        distance <
        first + vertical
    ) {

        return {

            x: 560,

            y:
                310 -
                (
                    distance -
                    first
                )

        };

    }


    return {

        x:
            560 +
            (
                distance -
                first -
                vertical
            ),

        y: 160

    };

}


/* -------------------------
   SPAWN
------------------------- */

function spawnEnemy() {

    let type;


    const r =
        Math.random();


    if (
        round >= 12 &&
        Math.random() < 0.06
    ) {

        type =
            enemyTypes[5];

    }

    else if (
        round >= 6 &&
        r < 0.20
    ) {

        type =
            enemyTypes[4];

    }

    else if (r < 0.40) {

        type =
            enemyTypes[3];

    }

    else if (r < 0.65) {

        type =
            enemyTypes[2];

    }

    else if (r < 0.85) {

        type =
            enemyTypes[1];

    }

    else {

        type =
            enemyTypes[0];

    }


    let hp =
        type.hp +
        round * 6;


    if (
        type.name === "boss"
    ) {

        hp +=
            round * 40;

    }


    const element =
        document.createElement("span");


    element.textContent =
        type.name;


    element.style.position =
        "absolute";

    element.style.color =
        "red";

    element.style.fontWeight =
        "bold";

    element.style.transform =
        "translate(-50%,-50%)";

    element.style.whiteSpace =
        "nowrap";


    if (
        type.name === "boss"
    ) {

        element.style.fontSize =
            "20px";

    }


    game.appendChild(element);


    enemies.push({

        type: type,

        hp: hp,

        maxHp: hp,

        distance: 0,

        speed: type.speed,

        slow: 0,

        element: element

    });

}


/* -------------------------
   ROUND SYSTEM
------------------------- */

function startRound() {

    if (roundRunning) {
        return;
    }


    roundRunning = true;


    enemiesToSpawn =
        7 +
        round * 2;


    if (
        round % 5 === 0
    ) {

        enemiesToSpawn += 5;

    }


    spawnTimer = 0;

}


function roundUpdate(dt) {

    if (!roundRunning) {

        nextRoundTimer -= dt;


        if (
            autoplay &&
            nextRoundTimer <= 0
        ) {

            startRound();

        }

        return;

    }


    spawnTimer -= dt;


    if (
        enemiesToSpawn > 0 &&
        spawnTimer <= 0
    ) {

        spawnEnemy();

        enemiesToSpawn--;

        spawnTimer =
            Math.max(
                0.15,
                0.45 -
                round * 0.005
            );

    }


    if (
        enemiesToSpawn === 0 &&
        enemies.length === 0
    ) {

        roundRunning = false;

        nextRoundTimer = 3;

        money +=
            20 +
            round * 3;

        round++;

        updateUI();

    }

}


/* -------------------------
   TOWER TARGETING
------------------------- */

function towerUpdate(dt) {

    for (
        let tower of towers
    ) {

        const data =
            towerTypes[
                tower.type
            ];


        tower.cooldown -= dt;


        if (
            tower.cooldown > 0
        ) {

            continue;

        }


        let target = null;

        let bestDistance =
            -Infinity;


        for (
            let enemy of enemies
        ) {

            const p =
                getPath(
                    enemy.distance
                );


            const distance =
                Math.hypot(
                    p.x - tower.x,
                    p.y - tower.y
                );


            if (
                distance <=
                data.range
            ) {

                /*
                    Prefer enemies
                    furthest along
                    the path.
                */

                if (
                    enemy.distance >
                    bestDistance
                ) {

                    target =
                        enemy;

                    bestDistance =
                        enemy.distance;

                }

            }

        }


        if (target) {

            fire(
                tower,
                target
            );

            tower.cooldown =
                data.reload /
                (
                    1 +
                    (tower.level - 1)
                    * 0.12
                );

        }

    }

}


/* -------------------------
   FIRE
------------------------- */

function fire(
    tower,
    target
) {

    const data =
        towerTypes[
            tower.type
        ];


    const element =
        document.createElement(
            "span"
        );


    element.textContent =
        "bullet";


    element.style.position =
        "absolute";

    element.style.fontSize =
        "10px";

    element.style.fontWeight =
        "bold";


    game.appendChild(element);


    bullets.push({

        x: tower.x,

        y: tower.y,

        target: target,

        speed:
            data.projectileSpeed,

        damage:
            data.damage *
            (
                1 +
                (tower.level - 1)
                * 0.25
            ),

        special:
            data.special,

        element:
            element

    });

}


/* -------------------------
   BULLETS
------------------------- */

function bulletUpdate(dt) {

    for (
        let i =
            bullets.length - 1;

        i >= 0;

        i--
    ) {

        const bullet =
            bullets[i];


        if (
            !enemies.includes(
                bullet.target
            )
        ) {

            bullet.element.remove();

            bullets.splice(i, 1);

            continue;

        }


        const targetPosition =
            getPath(
                bullet.target.distance
            );


        const dx =
            targetPosition.x -
            bullet.x;

        const dy =
            targetPosition.y -
            bullet.y;


        const distance =
            Math.hypot(
                dx,
                dy
            );


        const movement =
            bullet.speed * dt;


        if (
            distance <= movement
        ) {

            hit(
                bullet
            );


            bullet.element.remove();

            bullets.splice(i, 1);

        }

        else {

            bullet.x +=
                dx /
                distance *
                movement;

            bullet.y +=
                dy /
                distance *
                movement;


            bullet.element.style.left =
                bullet.x + "px";

            bullet.element.style.top =
                bullet.y + "px";

        }

    }

}


/* -------------------------
   HIT
------------------------- */

function hit(bullet) {

    const enemy =
        bullet.target;


    enemy.hp -=
        bullet.damage;


    /*
        Ice tower slows.
    */

    if (
        bullet.special ===
        "slow"
    ) {

        enemy.slow = 2.5;

    }


    /*
        Cannon splash.
    */

    if (
        bullet.special ===
        "splash"
    ) {

        for (
            let other of enemies
        ) {

            if (
                other === enemy
            ) {
                continue;
            }


            const a =
                getPath(
                    enemy.distance
                );

            const b =
                getPath(
                    other.distance
                );


            if (
                Math.hypot(
                    a.x - b.x,
                    a.y - b.y
                ) < 65
            ) {

                other.hp -=
                    bullet.damage *
                    0.45;

            }

        }

    }


    /*
        Wizard can pierce
        several nearby enemies.
    */

    if (
        bullet.special ===
        "pierce"
    ) {

        let hits = 0;


        for (
            let other of enemies
        ) {

            if (
                other === enemy
            ) {
                continue;
            }


            if (hits >= 2) {
                break;
            }


            const a =
                getPath(
                    enemy.distance
                );

            const b =
                getPath(
                    other.distance
                );


            if (
                Math.hypot(
                    a.x - b.x,
                    a.y - b.y
                ) < 50
            ) {

                other.hp -=
                    bullet.damage *
                    0.5;

                hits++;

            }

        }

    }


    checkDeaths();

}


/* -------------------------
   DEATHS
------------------------- */

function checkDeaths() {

    for (
        let i =
            enemies.length - 1;

        i >= 0;

        i--
    ) {

        const enemy =
            enemies[i];


        if (
            enemy.hp <= 0
        ) {

            money +=
                enemy.type.reward;

            score +=
                enemy.type.reward *
                10;


            enemy.element.remove();

            enemies.splice(
                i,
                1
            );


            updateUI();

        }

    }

}


/* -------------------------
   ENEMIES
------------------------- */

function enemyUpdate(dt) {

    for (
        let i =
            enemies.length - 1;

        i >= 0;

        i--
    ) {

        const enemy =
            enemies[i];


        let speed =
            enemy.speed;


        if (
            enemy.slow > 0
        ) {

            speed *= 0.45;

            enemy.slow -= dt;

        }


        enemy.distance +=
            speed * dt;


        const p =
            getPath(
                enemy.distance
            );


        enemy.element.style.left =
            p.x + "px";

        enemy.element.style.top =
            p.y + "px";


        if (
            p.x >
            game.clientWidth + 50
        ) {

            enemy.element.remove();

            enemies.splice(
                i,
                1
            );


            /*
                Bosses cost more lives.
            */

            if (
                enemy.type.name ===
                "boss"
            ) {

                lives -= 5;

            }

            else {

                lives--;

            }


            updateUI();


            if (
                lives <= 0
            ) {

                gameOver();

            }

        }

    }

}


/* -------------------------
   AUTOPLAY
------------------------- */

function toggleAuto() {

    autoplay =
        !autoplay;


    document.getElementById(
        "auto"
    ).textContent =
        autoplay ?
        "ON" :
        "OFF";


    /*
        Turning autoplay on
        starts a round if
        nothing is happening.
    */

    if (
        autoplay &&
        !roundRunning &&
        enemies.length === 0
    ) {

        startRound();

    }

}


/* -------------------------
   GAME OVER
------------------------- */

function gameOver() {

    document.getElementById(
        "finalScore"
    ).textContent =
        score;


    document.getElementById(
        "gameOver"
    ).style.display =
        "block";

}


/* -------------------------
   GAME LOOP
------------------------- */

function loop(time) {

    let dt =
        (time - lastTime) /
        1000;


    lastTime =
        time;


    dt =
        Math.min(
            dt,
            0.05
        );


    roundUpdate(dt);

    enemyUpdate(dt);

    towerUpdate(dt);

    bulletUpdate(dt);


    requestAnimationFrame(
        loop
    );

}


updateUI();

requestAnimationFrame(
    loop
);

</script>

</body>
</html>
