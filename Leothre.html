/* =========================================================
   START / MENU
========================================================= */

function startGame(diff){

  difficulty = diff;

  const d = difficulties[diff];

  money = d.money;
  lives = d.lives;
  wave = 0;

  enemies = [];
  towers = [];
  bullets = [];
  effects = [];

  selectedTower = null;
  selectedTowerType = null;

  path = maps[selectedMap];

  document.getElementById("menu").style.display="none";
  document.getElementById("game").style.display="block";

  gameRunning = true;
  paused = false;

  createTowerButtons();

  updateUI();
}

function backMenu(){
  gameRunning=false;
  document.getElementById("game").style.display="none";
  document.getElementById("menu").style.display="block";
}

function restartGame(){
  startGame(difficulty);
}

function pauseGame(){
  paused=!paused;
}

function toggleAuto(){
  autoplay=!autoplay;
  document.getElementById("autoText").textContent=autoplay?"ON":"OFF";
}

/* =========================================================
   TOWER BUTTONS
========================================================= */

function createTowerButtons(){

  const bar=document.getElementById("towerBar");
  bar.innerHTML="";

  Object.keys(towerTypes).forEach(key=>{

    const t=towerTypes[key];

    const b=document.createElement("button");

    b.innerHTML=t.name+" ($"+t.cost+")";

    b.onclick=()=>{
      selectedTowerType=key;
      selectedTower=null;
    };

    bar.appendChild(b);
  });
}

/* =========================================================
   PLACING TOWERS
========================================================= */

canvas.addEventListener("click",function(e){

  if(!gameRunning || paused) return;

  const r=canvas.getBoundingClientRect();

  const x=e.clientX-r.left;
  const y=e.clientY-r.top;

  if(selectedTowerType){

    placeTower(x,y);
    return;
  }

  let found=null;

  for(const t of towers){

    if(distance(x,y,t.x,t.y)<22){
      found=t;
      break;
    }
  }

  selectedTower=found;
});

function placeTower(x,y){

  const type=towerTypes[selectedTowerType];

  if(!type) return;

  if(money<type.cost) return;

  const count=towers.filter(t=>t.type===selectedTowerType).length;

  if(count>=type.max) return;

  if(type.water && !isWater(x,y)) return;

  if(type.land && isWater(x,y)) return;

  if(isPath(x,y)) return;

  towers.push({

    type:selectedTowerType,
    x,
    y,

    level:[0,0,0],

    lastShot:0,
    incomeTimer:0,

    kills:0
  });

  money-=type.cost;

  selectedTower=null;
  selectedTowerType=null;

  updateUI();
}

/* =========================================================
   WATER / PATH
========================================================= */

function isWater(x,y){

  return waterZones.some(z=>
    x>z.x &&
    x<z.x+z.w &&
    y>z.y &&
    y<z.y+z.h
  );
}

function isPath(x,y){

  for(let i=0;i<path.length-1;i++){

    const a=path[i];
    const b=path[i+1];

    const d=pointSegmentDistance(
      x,y,a[0],a[1],b[0],b[1]
    );

    if(d<35) return true;
  }

  return false;
}

function pointSegmentDistance(px,py,x1,y1,x2,y2){

  const dx=x2-x1;
  const dy=y2-y1;

  if(dx===0 && dy===0)
    return distance(px,py,x1,y1);

  let t=((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy);

  t=Math.max(0,Math.min(1,t));

  return distance(
    px,py,
    x1+t*dx,
    y1+t*dy
  );
}

/* =========================================================
   WAVE GENERATION
========================================================= */

function startWave(){

  if(waveActive) return;

  wave++;

  spawnQueue=[];

  const d=difficulties[difficulty];

  /* boss every 10 waves */
  if(wave%10===0){

    spawnQueue.push({
      type:"boss",
      amount:1
    });

    /* bosses also have support */
    for(let i=0;i<5+wave/5;i++){

      spawnQueue.push({
        type:randomEnemyType(),
        amount:1
      });
    }

  }else{

    const amount=Math.floor(
      8+
      wave*2.4
    );

    for(let i=0;i<amount;i++){

      spawnQueue.push({
        type:randomEnemyType(),
        amount:1
      });
    }
  }

  waveActive=true;
  spawnTimer=0;
}

/* Only introduce special enemy types as waves become stronger. */
function randomEnemyType(){

  const pool=["normal"];

  if(wave>=2)
    pool.push("speedy");

  if(wave>=3)
    pool.push("healthy");

  if(wave>=4)
    pool.push("armored");

  if(wave>=5)
    pool.push("bombonly");

  if(wave>=6)
    pool.push("iceproof");

  if(wave>=7)
    pool.push("camouflage");

  if(wave>=8)
    pool.push("regeneration");

  if(wave>=9)
    pool.push("shielded");

  if(wave>=11)
    pool.push("flying");

  if(wave>=12)
    pool.push("swarm");

  if(wave>=13)
    pool.push("splitter");

  if(wave>=14)
    pool.push("giant");

  if(wave>=15)
    pool.push("burning");

  if(wave>=16)
    pool.push("electric");

  /* rare special types */
  let chosen=pool[Math.floor(Math.random()*pool.length)];

  /* Keep specials relatively uncommon. */
  if(chosen!=="normal" && Math.random()<0.45)
    chosen="normal";

  return chosen;
}

/* =========================================================
   ENEMY SPAWNING
========================================================= */

function spawnEnemy(type){

  const d=difficulties[difficulty];
  const base=enemyTypes[type];

  const hp=
    base.hp*
    d.hp*
    (1+wave*.055);

  enemies.push({

    type,

    x:path[0][0],
    y:path[0][1],

    pathIndex:0,

    hp,
    maxHp:hp,

    speed:
      base.speed*
      d.speed*
      (1+wave*.008),

    reward:
      Math.round(base.reward*d.reward),

    shield:base.shield||0,

    slow:1,

    dead:false,

    distanceTravelled:0
  });
}

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  if(!gameRunning || paused) return;

  dt*=gameSpeed;

  /* spawn */
  if(waveActive){

    spawnTimer-=dt;

    if(
      spawnTimer<=0 &&
      spawnQueue.length
    ){

      const next=spawnQueue.shift();

      spawnEnemy(next.type);

      spawnTimer=220;
    }

    if(
      spawnQueue.length===0 &&
      enemies.length===0
    ){

      waveActive=false;

      if(autoplay){

        setTimeout(()=>{
          if(gameRunning && autoplay)
            startWave();
        },300);
      }
    }
  }

  /* farm income only while wave is active */
  if(waveActive){

    for(const t of towers){

      const type=towerTypes[t.type];

      if(type.farm){

        t.incomeTimer+=dt;

        if(t.incomeTimer>=1000){

          const times=Math.floor(
            t.incomeTimer/1000
          );

          money+=
            type.income*
            times*
            (1+t.level[0]*.25);

          t.incomeTimer%=1000;
        }
      }
    }
  }

  updateEnemies(dt);
  updateTowers(dt);
  updateBullets(dt);
  updateEffects(dt);

  if(lives<=0){

    alert("Game over");

    gameRunning=false;
    document.getElementById("game").style.display="none";
    document.getElementById("menu").style.display="block";
  }

  updateUI();
}

/* =========================================================
   ENEMIES
========================================================= */

function updateEnemies(dt){

  for(const e of enemies){

    if(e.dead) continue;

    if(e.regenTimer===undefined)
      e.regenTimer=0;

    if(enemyTypes[e.type].regen){

      e.regenTimer+=dt;

      if(e.regenTimer>=1000){

        e.hp=Math.min(
          e.maxHp,
          e.hp+e.maxHp*.025
        );

        e.regenTimer=0;
      }
    }

    const target=path[e.pathIndex+1];

    if(!target){

      e.dead=true;
      lives-=enemyTypes[e.type].boss?20:1;
      continue;
    }

    let dx=target[0]-e.x;
    let dy=target[1]-e.y;

    let dist=Math.sqrt(dx*dx+dy*dy);

    if(dist<2){

      e.pathIndex++;

      continue;
    }

    dx/=dist;
    dy/=dist;

    const movement=
      e.speed*
      e.slow*
      dt*.08;

    e.x+=dx*movement;
    e.y+=dy*movement;

    e.distanceTravelled+=movement;
  }

  enemies=enemies.filter(e=>!e.dead);
}

/* =========================================================
   TOWER UPDATE
========================================================= */

function updateTowers(dt){

  for(const t of towers){

    const type=towerTypes[t.type];

    if(type.farm) continue;

    t.lastShot+=dt;

    const fireRate=
      type.fireRate*
      Math.pow(.9,t.level[1]);

    if(t.lastShot<fireRate) continue;

    let target=findTarget(t);

    if(!target) continue;

    t.lastShot=0;

    fireTower(t,target);
  }
}

function findTarget(t){

  const type=towerTypes[t.type];

  let best=null;
  let bestDistance=-Infinity;

  for(const e of enemies){

    if(e.dead) continue;

    const dist=distance(
      t.x,t.y,
      e.x,e.y
    );

    if(dist>type.range) continue;

    if(e.type==="camouflage" && !towerCanSeeCamo(t))
      continue;

    /* Flying enemies require anti-air towers. */
    if(enemyTypes[e.type].flying && !towerCanHitFlying(t))
      continue;

    /* Bomb-only enemies cannot be damaged by normal attacks. */
    if(enemyTypes[e.type].bombOnly && !type.bomb)
      continue;

    /* Prefer enemies further along the route. */
    if(e.distanceTravelled>bestDistance){

      best=e;
      bestDistance=e.distanceTravelled;
    }
  }

  return best;
}

/* =========================================================
   SPECIAL TOWER CAPABILITIES
========================================================= */

function towerCanSeeCamo(t){

  return (
    t.type==="sniper" ||
    t.type==="laser" ||
    t.level[1]>=2
  );
}

function towerCanHitFlying(t){

  return (
    t.type==="sniper" ||
    t.type==="gun" ||
    t.type==="laser" ||
    t.type==="storm" ||
    t.type==="dart" ||
    t.level[0]>=2
  );
}

/* =========================================================
   SHOOTING
========================================================= */

function fireTower(t,target){

  const type=towerTypes[t.type];

  const damage=
    type.damage*
    (1+t.level[0]*.35)*
    (1+t.level[1]*.2);

  bullets.push({

    x:t.x,
    y:t.y,

    target,

    damage,

    type:type.projectile,

    splash:type.splash||0,

    slow:type.slow||0,

    tower:t
  });
}

/* =========================================================
   BULLETS
========================================================= */

function updateBullets(dt){

  for(const b of bullets){

    if(!b.target || b.target.dead){

      b.dead=true;
      continue;
    }

    const dx=b.target.x-b.x;
    const dy=b.target.y-b.y;

    const dist=Math.sqrt(dx*dx+dy*dy);

    const speed=
      b.type==="laser" ? 1.8 :
      b.type==="storm" ? 1.4 :
      1.0;

    if(dist<8){

      hitEnemy(b,b.target);

      b.dead=true;

      continue;
    }

    b.x+=dx/dist*speed*dt;
    b.y+=dy/dist*speed*dt;
  }

  bullets=bullets.filter(b=>!b.dead);
}

function hitEnemy(b,e){

  if(e.dead) return;

  const et=enemyTypes[e.type];

  /* bomb-only */
  if(et.bombOnly && b.type!=="bomb"){

    createTextEffect(
      e.x,
      e.y-25,
      "immune"
    );

    return;
  }

  /* ice immunity */
  if(et.iceImmune && b.type==="ice"){

    createTextEffect(
      e.x,
      e.y-25,
      "ice immune"
    );

    return;
  }

  /* electric immunity */
  if(et.electricImmune && b.type==="electric"){

    createTextEffect(
      e.x,
      e.y-25,
      "electric immune"
    );

    return;
  }

  let damage=b.damage;

  /* armor heavily reduces non-bomb damage */
  if(et.armor && b.type!=="bomb"){

    damage=Math.max(
      1,
      damage*.25
    );
  }

  /* shield absorbs damage first */
  if(e.shield>0){

    const absorbed=Math.min(
      e.shield,
      damage
    );

    e.shield-=absorbed;
    damage-=absorbed;
  }

  if(damage>0)
    e.hp-=damage;

  /* ice slow */
  if(
    b.slow &&
    !et.iceImmune
  ){

    e.slow=Math.min(
      e.slow,
      b.slow
    );

    setTimeout(()=>{
      if(e && !e.dead)
        e.slow=1;
    },1200);
  }

  /* splash */
  if(b.splash>0){

    for(const other of enemies){

      if(other===e || other.dead)
        continue;

      if(distance(
        e.x,e.y,
        other.x,other.y
      )<=b.splash){

        let splashDamage=b.damage*.6;

        if(enemyTypes[other.type].armor)
          splashDamage*=.25;

        other.hp-=splashDamage;
      }
    }
  }

  createHitEffect(
    e.x,
    e.y,
    b.type
  );

  if(e.hp<=0)
    killEnemy(e,b.tower);
}

function killEnemy(e,tower){

  if(e.dead) return;

  e.dead=true;

  money+=e.reward;

  if(tower)
    tower.kills++;

  /* splitter creates smaller enemies */
  if(enemyTypes[e.type].split){

    for(let i=0;i<3;i++){

      const child=enemyTypes["swarm"];

      enemies.push({

        type:"swarm",

        x:e.x+Math.random()*15-7,
        y:e.y+Math.random()*15-7,

        pathIndex:e.pathIndex,

        hp:child.hp,
        maxHp:child.hp,

        speed:child.speed,
        reward:child.reward,

        shield:0,
        slow:1,

        dead:false,

        distanceTravelled:e.distanceTravelled
      });
    }
  }
}

/* =========================================================
   EFFECTS
========================================================= */

function createHitEffect(x,y,type){

  effects.push({

    kind:"hit",

    x,
    y,

    type,

    life:250,
    maxLife:250,

    radius:5
  });
}

function createTextEffect(x,y,text){

  effects.push({

    kind:"text",

    x,
    y,

    text,

    life:700,
    maxLife:700
  });
}

function updateEffects(dt){

  for(const e of effects){

    e.life-=dt;

    if(e.kind==="hit")
      e.radius+=dt*.04;

    if(e.kind==="text")
      e.y-=dt*.025;
  }

  effects=effects.filter(e=>e.life>0);
}

/* =========================================================
   UPGRADES
========================================================= */

function upgradeSelected(pathIndex){

  const t=selectedTower;

  if(!t) return;

  const type=towerTypes[t.type];

  const level=t.level[pathIndex];

  if(level>=5) return;

  const costs=[
    120,
    220,
    400,
    700,
    1200
  ];

  const cost=
    costs[level]*
    (pathIndex===2?1.4:1);

  if(money<cost) return;

  money-=cost;

  t.level[pathIndex]++;

  updateUI();
}

/* =========================================================
   SELLING
========================================================= */

function sellSelected(){

  if(!selectedTower) return;

  const type=towerTypes[selectedTower.type];

  let value=type.cost*.7;

  value*=
    1+
    (
      selectedTower.level[0]+
      selectedTower.level[1]+
      selectedTower.level[2]
    )*.25;

  money+=Math.floor(value);

  towers=towers.filter(
    t=>t!==selectedTower
  );

  selectedTower=null;

  updateUI();
}

/* =========================================================
   DRAW
========================================================= */

function draw(){

  ctx.clearRect(
    0,0,
    canvas.width,
    canvas.height
  );

  drawWater();
  drawPath();
  drawTowers();
  drawEnemies();
  drawBullets();
  drawEffects();

  if(selectedTowerType){

    /* placement preview */
    const mouseX=canvas.width/2;
    const mouseY=canvas.height/2;
  }

  if(paused){

    ctx.font="40px Arial";
    ctx.fillText(
      "PAUSED",
      650,
      400
    );
  }
}

/* =========================================================
   WATER
========================================================= */

function drawWater(){

  ctx.font="20px Arial";

  for(const z of waterZones){

    ctx.strokeRect(
      z.x,z.y,
      z.w,z.h
    );

    ctx.fillText(
      "water",
      z.x+10,
      z.y+25
    );
  }
}

/* =========================================================
   PATH
========================================================= */

function drawPath(){

  ctx.lineWidth=45;

  ctx.beginPath();

  ctx.moveTo(
    path[0][0],
    path[0][1]
  );

  for(let i=1;i<path.length;i++){

    ctx.lineTo(
      path[i][0],
      path[i][1]
    );
  }

  ctx.stroke();

  ctx.lineWidth=1;
}

/* =========================================================
   TOWERS
========================================================= */

function drawTowers(){

  for(const t of towers){

    const type=towerTypes[t.type];

    /* range circle */
    if(
      selectedTower===t ||
      selectedTowerType===t.type
    ){

      ctx.beginPath();

      ctx.arc(
        t.x,
        t.y,
        type.range,
        0,
        Math.PI*2
      );

      ctx.stroke();

      /* hitbox circle */
      ctx.beginPath();

      ctx.arc(
        t.x,
        t.y,
        22,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }

    ctx.font="16px Arial";

    ctx.textAlign="center";

    ctx.fillText(
      type.name,
      t.x,
      t.y+5
    );

    ctx.textAlign="left";

    /* ability visual */
    if(t.level[2]>0){

      ctx.beginPath();

      ctx.arc(
        t.x,
        t.y,
        27+t.level[2]*3,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }
  }
}

/* =========================================================
   ENEMIES
========================================================= */

function drawEnemies(){

  ctx.textAlign="center";

  for(const e of enemies){

    const type=enemyTypes[e.type];

    ctx.font=
      Math.max(
        12,
        type.size
      )+"px Arial";

    /* enemy itself is literally its name */
    let displayName;

    if(e.type==="normal"){
      displayName="enemy";
    }else{
      displayName=enemyName(e.type);
    }

    ctx.fillText(
      displayName,
      e.x,
      e.y
    );

    /* special property above enemy */
    if(type.name){

      ctx.font="12px Arial";

      ctx.fillText(
        type.name,
        e.x,
        e.y-type.size-5
      );
    }

    /* boss health bar */
    if(type.boss){

      ctx.strokeRect(
        e.x-50,
        e.y-65,
        100,
        8
      );

      ctx.fillRect(
        e.x-50,
        e.y-65,
        100*(e.hp/e.maxHp),
        8
      );
    }

    /* shield */
    if(e.shield>0){

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        type.size+5,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }

    /* health bar */
    ctx.strokeRect(
      e.x-20,
      e.y+10,
      40,
      4
    );

    ctx.fillRect(
      e.x-20,
      e.y+10,
      40*Math.max(
        0,
        e.hp/e.maxHp
      ),
      4
    );
  }

  ctx.textAlign="left";
}

/* Animal-like enemies are described by what they do. */
function enemyName(type){

  const names={

    speedy:"runner",
    healthy:"tank",
    armored:"armor",
    bombonly:"bomb only",
    iceproof:"ice protection",
    camouflage:"hidden",
    regeneration:"healing",
    shielded:"shield",
    flying:"flying",
    swarm:"swarm",
    splitter:"splitter",
    giant:"giant",
    burning:"burning",
    electric:"electric",
    boss:"BOSS"
  };

  return names[type]||"enemy";
}

/* =========================================================
   BULLETS
========================================================= */

function drawBullets(){

  ctx.textAlign="center";

  for(const b of bullets){

    ctx.font="12px Arial";

    ctx.fillText(
      b.type,
      b.x,
      b.y
    );
  }

  ctx.textAlign="left";
}

/* =========================================================
   VISUAL EFFECTS
========================================================= */

function drawEffects(){

  for(const e of effects){

    const alpha=
      e.life/e.maxLife;

    ctx.globalAlpha=alpha;

    if(e.kind==="hit"){

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        e.radius,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }

    if(e.kind==="text"){

      ctx.font="13px Arial";

      ctx.fillText(
        e.text,
        e.x,
        e.y
      );
    }

    ctx.globalAlpha=1;
  }
}

/* =========================================================
   UI
========================================================= */

function updateUI(){

  document.getElementById("moneyText")
    .textContent="Money: "+Math.floor(money);

  document.getElementById("livesText")
    .textContent="Lives: "+Math.floor(lives);

  document.getElementById("waveText")
    .textContent="Wave: "+wave;

  if(selectedTower){

    const type=towerTypes[selectedTower.type];

    const upgradeCosts=[
      120,220,400,700,1200
    ];

    let text=
      "Selected: "+type.name+
      " | Level "+
      selectedTower.level.join("-");

    text+=" | Upgrades: ";

    for(let i=0;i<3;i++){

      const level=
        selectedTower.level[i];

      if(level<5){

        const cost=
          Math.floor(
            upgradeCosts[level]*
            (i===2?1.4:1)
          );

        text+=
          "Path "+(i+1)+
          " $"+cost+" ";
      }else{

        text+="Path "+(i+1)+" MAX ";
      }
    }

    document.getElementById(
      "selectedInfo"
    ).textContent=text;

  }else{

    document.getElementById(
      "selectedInfo"
    ).textContent=
      selectedTowerType
      ?"Placing: "+towerTypes[selectedTowerType].name
      :"";
  }
}

/* =========================================================
   MOUSE RANGE PREVIEW
========================================================= */

let mouseX=0;
let mouseY=0;

canvas.addEventListener("mousemove",e=>{

  const r=canvas.getBoundingClientRect();

  mouseX=e.clientX-r.left;
  mouseY=e.clientY-r.top;
});

/* draw placement range */
function drawPlacementPreview(){

  if(!selectedTowerType)
    return;

  const type=
    towerTypes[selectedTowerType];

  ctx.beginPath();

  ctx.arc(
    mouseX,
    mouseY,
    type.range,
    0,
    Math.PI*2
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.arc(
    mouseX,
    mouseY,
    22,
    0,
    Math.PI*2
  );

  ctx.stroke();

  ctx.font="14px Arial";

  ctx.fillText(
    type.name,
    mouseX,
    mouseY
  );
}

/* =========================================================
   MAIN LOOP
========================================================= */

function loop(now){

  const dt=
    Math.min(
      50,
      now-lastTime
    );

  lastTime=now;

  update(dt);

  draw();
  drawPlacementPreview();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* =========================================================
   HELPERS
========================================================= */

function distance(x1,y1,x2,y2){

  const dx=x2-x1;
  const dy=y2-y1;

  return Math.sqrt(
    dx*dx+dy*dy
  );
}

/* =========================================================
   KEYBOARD CONTROLS
========================================================= */

document.addEventListener("keydown",e=>{

  if(e.key===" "){
    pauseGame();
  }

  if(e.key==="r"){
    restartGame();
  }

  if(e.key==="Enter"){
    startWave();
  }
});

/* =========================================================
   INITIAL STATE
========================================================= */

document.getElementById("menu").style.display="block";
document.getElementById("game").style.display="none";

</script>
