}

}

}

}

#menuSelection{

#startButton{

#game{

}

#top{

}

#towers{

    gap:4px;
    flex-wrap:wrap;

}

#controls{

    gap:5px;
    align-items:center;

}

#upgradeBox{
    display:none;

    flex-wrap:wrap;
}

#selected{
    margin-left:5px;
}

#towerInfo{
    display:none;
    border-bottom:1px solid black;
    padding:5px;
    font-size:13px;
}

canvas{
    display:block;
    margin:5px;
    border:1px solid black;
    background:white;
}
</style>
</head>

<div id="menu">

<h1>letter tower defence</h1>

<div class="menuSection">
<b>difficulty:</b><br><br>

<button onclick="setDifficulty('easy')">easy</button>
<button onclick="setDifficulty('normal')">normal</button>
<button onclick="setDifficulty('hard')">hard</button>
<button onclick="setDifficulty('insane')">insane</button>
</div>

<div class="menuSection">
<b>map:</b><br><br>

<button onclick="setMap(0)">map 1</button>
<button onclick="setMap(1)">map 2</button>
<button onclick="setMap(2)">map 3</button>
<button onclick="setMap(3)">map 4</button>
</div>

<div id="menuSelection">
Selected: normal, map 1
</div>

<button id="startButton" onclick="startGame()">
START GAME
</button>

</div>


<div id="game">

<div id="top">

<button onclick="restartGame()">Restart</button>
<button onclick="togglePause()">Pause</button>
<button onclick="backToMenu()">Menu</button>

<span id="money">Money: 0</span>
<span id="hp">HP: 0</span>
<span id="wave">Wave: 0</span>
<span id="alive">Enemies: 0</span>

<label>
Speed:
<select onchange="gameSpeed=Number(this.value)">
<option value="1">1x</option>
<option value="2">2x</option>
<option value="3">3x</option>
<option value="4">4x</option>
</select>
</label>

<button onclick="toggleAutoplay()">

</button>

</div>

<div id="towers"></div>

<div id="controls">

<button onclick="startWave()">Start Wave</button>

<button
id="sellButton"
style="display:none"

Sell
</button>

<div id="upgradeBox">

<button id="upgrade0" onclick="upgradeTower(0)">
Path 1
</button>

<button id="upgrade1" onclick="upgradeTower(1)">
Path 2
</button>

<button id="upgrade2" onclick="upgradeTower(2)">
Ability
</button>

</div>

<button
id="abilityButton"
style="display:none"

</button>

<span id="selected"></span>

</div>

<div id="towerInfo"></div>

<canvas id="canvas" width="1500" height="850"></canvas>

/* =========================================================
                       WATER
========================================================= */

function isWater(x,y){

    return water.some(function(z){

        return(
            x>z.x &&
            x<z.x+z.w &&
            y>z.y &&
            y<z.y+z.h
        );

    });

}


/* =========================================================
                       PATH
========================================================= */

function pointSegmentDistance(px,py,x1,y1,x2,y2){

    const dx=x2-x1;
    const dy=y2-y1;

    if(dx===0&&dy===0)
        return distance(px,py,x1,y1);

    let t=
        ((px-x1)*dx+
        (py-y1)*dy)/
        (dx*dx+dy*dy);

    t=Math.max(0,Math.min(1,t));

    return distance(
        px,
        py,
        x1+t*dx,
        y1+t*dy
    );

}


function isPath(x,y){

    for(let i=0;i<path.length-1;i++){

        if(
            pointSegmentDistance(
                x,
                y,
                path[i][0],
                path[i][1],
                path[i+1][0],
                path[i+1][1]
            )<35
        ){

            return true;

        }

    }

    return false;

}


/* =========================================================
                  TOWER EFFECT ROLL
========================================================= */

function rollTowerEffect(){

    let roll=Math.random();
    let total=0;

    for(const effect of towerEffects){

        total+=effect.chance;

        if(roll<total)
            return effect;

    }

    return null;

}


/* =========================================================
                     PLACE TOWER
========================================================= */

function placeTower(x,y){

    const type=towerTypes[selectedTowerType];

    if(!type)return;

    if(money<type.cost)return;

    const amount=
        towers.filter(
            t=>t.type===selectedTowerType
        ).length;

    if(amount>=20){

        alert(
            "You can only have 20 "+
            type.name+
            " towers."
        );

        return;

    }

    if(type.water&&!isWater(x,y))
        return;

    if(type.land&&isWater(x,y))
        return;

    if(isPath(x,y))
        return;

    const effect=rollTowerEffect();

    towers.push({

        type:selectedTowerType,

        x:x,
        y:y,

        level:[0,0,0],

        lastShot:0,

        incomeTimer:0,

        kills:0,

        effect:effect,

        abilityCooldown:0,

        abilityActive:0,

        abilityUses:0,

        invested:type.cost

    });

    money-=type.cost;

    selectedTowerType=null;
    selectedTower=null;

    updateUI();

}


/* =========================================================
                       WAVE SYSTEM
========================================================= */

function startWave(){

    if(waveActive||!gameRunning)
        return;

    wave++;

    spawnQueue=[];

    if(wave%10===0){

        /*
          Every tenth wave gets a major boss.
        */

        spawnQueue.push({
            type:"boss"
        });

        /*
          Additional boss variants appear
          occasionally in later boss rounds.
        */

        if(wave>=20)
            spawnQueue.push({
                type:"bossArmor"
            });

        if(wave>=30)
            spawnQueue.push({
                type:"bossRegeneration"
            });

        if(wave>=40)
            spawnQueue.push({
                type:"bossCamouflage"
            });

        if(wave>=50)
            spawnQueue.push({
                type:"bossShield"
            });

        for(
            let i=0;
            i<5+Math.floor(wave/5);
            i++
        ){

            spawnQueue.push({
                type:randomEnemy()
            });

        }

    }else{

        const amount=
            Math.floor(
                8+
                wave*2.4
            );

        for(let i=0;i<amount;i++){

            spawnQueue.push({
                type:randomEnemy()
            });

        }

    }

    waveActive=true;
    spawnTimer=0;

}


/*
  Special enemies are deliberately uncommon.
*/

function randomEnemy(){

    const normalPool=["normal"];

    const special=[];

    if(wave>=2)special.push("speedy");
    if(wave>=3)special.push("healthy");
    if(wave>=4)special.push("armored");
    if(wave>=5)special.push("bombonly");
    if(wave>=6)special.push("iceproof");
    if(wave>=7)special.push("camouflage");
    if(wave>=8)special.push("regeneration");
    if(wave>=9)special.push("shielded");
    if(wave>=11)special.push("flying");
    if(wave>=12)special.push("swarm");
    if(wave>=13)special.push("splitter");
    if(wave>=14)special.push("giant");
    if(wave>=15)special.push("burning");
    if(wave>=16)special.push("electricEnemy");
    if(wave>=18)special.push("waterproof");
    if(wave>=22)special.push("fastArmor");

    /*
      Most enemies remain normal.
    */

    if(
        special.length>0 &&
        Math.random()<.38
    ){

        return special[
            Math.floor(
                Math.random()*special.length
            )
        ];

    }

    return "normal";

}


/* =========================================================
                TOWER POWER / ENEMY SCALING
========================================================= */

/*
  Enemy scaling explicitly responds to the player's
  total offensive tower strength.

  The result is intentionally bounded so that adding
  more towers does not create an infinite feedback loop.
*/

function calculateTowerPower(){

    let power=0;

    for(const t of towers){

        const type=towerTypes[t.type];

        if(!type.damage)
            continue;

        let damage=type.damage;

        damage*=getPathDamageMultiplier(t);

        damage*=towerDamageMultiplier(t);

        power+=damage;

    }

    return power;

}


function getDamageScale(){

    const power=calculateTowerPower();

    /*
      Baseline 1.
      Stronger tower setups produce tougher enemies.
    */

    return 1+
        Math.min(
            5,
            power/120
        );

}


/* =========================================================
                  UPGRADE CALCULATIONS
========================================================= */

function getPathDamageMultiplier(t){

    const level=t.level[0];

    if(level<=0)
        return 1;

    return 1+
        level*.30+
        Math.pow(level,1.35)*.035;

}


function getRangeMultiplier(t){

    let result=1;

    const level=t.level[1];

    if(level>=1)
        result*=1.15;

    if(level>=4)
        result*=1.30;

    if(
        t.effect &&
        t.effect.name==="long range"
    )
        result*=1.25;

    if(
        t.effect &&
        t.effect.name==="unstable"
    )
        result*=.80;

    return result;

}


function getFireRateMultiplier(t){

    let result=1;

    const level=t.level[1];

    if(level>=2)
        result*=.82;

    if(level>=3)
        result*=.68;

    if(level>=5)
        result*=.60;

    if(
        t.effect &&
        t.effect.name==="rapid"
    )
        result*=.70;

    return result;

}


function towerDamageMultiplier(t){

    let result=1;

    if(!t.effect)
        return result;

    if(t.effect.name==="powerful")
        result*=1.35;

    if(t.effect.name==="unstable")
        result*=1.60;

    if(t.effect.name==="weak")
        result*=.75;

    return result;

}


function towerRangeMultiplier(t){

    return getRangeMultiplier(t);

}


function towerIncomeMultiplier(t){

    let result=1;

    if(
        t.effect &&
        t.effect.name==="wealthy"
    )
        result*=1.5;

    return result;

}


/* =========================================================
                    SPAWN ENEMY
========================================================= */

function spawnEnemy(typeName){

    const base=enemyTypes[typeName];

    const d=difficultyData[difficulty];

    /*
      Wave scaling.
    */

    let waveScale=
        1+
        Math.pow(wave,1.18)*.055;

    /*
      Player-power scaling.
    */

    let playerScale=
        getDamageScale();

    let hpValue=
        base.hp*
        d.enemyScale*
        waveScale*
        playerScale;

    if(base.boss){

        hpValue=
            base.hp*
            d.enemyScale*
            Math.pow(1.16,wave/10)*
            (1+wave*.12)*
            (1+getDamageScale());

    }


    enemies.push({

        type:typeName,

        x:path[0][0],
        y:path[0][1],

        pathIndex:0,

        hp:hpValue,
        maxHp:hpValue,

        speed:
            base.speed*
            d.enemySpeed*
            (1+wave*.008),

        reward:
            Math.round(
                base.reward*
                d.reward*
                (1+wave*.025)
            ),

        shield:base.shield||0,

        slow:1,

        dead:false,

        distanceTravelled:0,

        regenTimer:0,

        burnTimer:0

    });

}


/* =========================================================
                       UPDATE
========================================================= */

function update(dt){

    if(!gameRunning||paused)
        return;

    dt*=gameSpeed;


    /* ---------------------------------------------
       Spawn enemies
    --------------------------------------------- */

    if(waveActive){

        spawnTimer-=dt;

        if(
            spawnTimer<=0 &&
            spawnQueue.length>0
        ){

            spawnEnemy(
                spawnQueue.shift().type
            );

            /*
              Bosses enter slower so they do not
              appear as an instant pile.
            */

            spawnTimer=
                wave%10===0?
                450:
                220;

        }

    }


    /* ---------------------------------------------
       Farms ONLY work during active rounds
    --------------------------------------------- */

    if(waveActive){

        for(const t of towers){

            const type=towerTypes[t.type];

            if(!type.farm)
                continue;

            t.incomeTimer+=dt;

            if(t.incomeTimer>=1000){

                const times=
                    Math.floor(
                        t.incomeTimer/1000
                    );

                let income=
                    type.income;

                /*
                  Path 1 and 2 improve farms.
                */

                income*=
                    1+
                    t.level[0]*.25;

                income*=
                    1+
                    t.level[1]*.15;

                income*=
                    towerIncomeMultiplier(t);

                if(t.level[2]>=3)
                    income*=1.20;

                money+=
                    income*times;

                t.incomeTimer%=1000;

            }

        }

    }


    updateEnemies(dt);
    updateTowers(dt);
    updateBullets(dt);
    updateVisualEffects(dt);
    updateTowerAbilities(dt);


    /*
      Round finished.
    */

    if(
        waveActive &&
        spawnQueue.length===0 &&
        enemies.length===0
    ){

        waveActive=false;

        /*
          Small round completion reward.
        */

        money+=
            Math.floor(
                25+
                wave*3
            );

        if(autoplay){

            autoplayTimer=700;

        }

    }


    if(autoplayTimer>0){

        autoplayTimer-=dt;

        if(
            autoplayTimer<=0 &&
            autoplay &&
            !waveActive &&
            gameRunning
        ){

            startWave();

        }

    }


    if(hp<=0){

        hp=0;
        gameRunning=false;

        alert(
            "Game over.\n"+
            "You reached wave "+
            wave+"."
        );

        backToMenu();

    }

    updateUI();

}


/* =========================================================
                       ENEMIES
========================================================= */

function updateEnemies(dt){

    for(const e of enemies){

        if(e.dead)
            continue;

        const type=enemyTypes[e.type];


        /*
          Regeneration.
        */

        if(type.regen){

            e.regenTimer+=dt;

            if(e.regenTimer>=1000){

                e.hp=
                    Math.min(
                        e.maxHp,
                        e.hp+
                        e.maxHp*.025
                    );

                e.regenTimer=0;

            }

        }


        /*
          Burning enemies are fire immune.
        */


        /*
          Path movement.
        */

        const target=
            path[e.pathIndex+1];

        if(!target){

            e.dead=true;

            /*
              Bosses cause a much larger leak.
            */

            hp-=
                type.boss?
                20:
                1;

            continue;

        }


        let dx=target[0]-e.x;
        let dy=target[1]-e.y;

        const dist=
            Math.sqrt(
                dx*dx+
                dy*dy
            );

        if(dist<2){

            e.pathIndex++;

            continue;

        }

        dx/=dist;
        dy/=dist;

        const movement=
            e.speed*
            e.slow*
            dt*
            .08;

        e.x+=dx*movement;
        e.y+=dy*movement;

        e.distanceTravelled+=movement;

    }


    enemies=
        enemies.filter(
            e=>!e.dead
        );

}


/* =========================================================
                     TOWER UPDATE
========================================================= */

function updateTowers(dt){

    for(const t of towers){

        const type=towerTypes[t.type];

        if(type.farm||type.support)
            continue;

        t.lastShot+=dt;

        if(t.abilityCooldown>0)
            t.abilityCooldown-=dt;

        const fireRate=
            type.fireRate*
            getFireRateMultiplier(t);

        if(t.lastShot<fireRate)
            continue;

        const target=findTarget(t);

        if(!target)
            continue;

        t.lastShot=0;

        fireTower(t,target);

    }

}


/* =========================================================
                      TARGETING
========================================================= */

function findTarget(t){

    const type=towerTypes[t.type];

    const range=
        type.range*
        towerRangeMultiplier(t);

    let target=null;

    let furthest=-Infinity;

    for(const e of enemies){

        if(e.dead)
            continue;

        if(
            distance(
                t.x,
                t.y,
                e.x,
                e.y
            )>range
        )
            continue;


        if(
            enemyTypes[e.type].camo &&
            !canSeeCamo(t)
        )
            continue;


        if(
            enemyTypes[e.type].flying &&
            !canHitFlying(t)
        )
            continue;


        if(
            enemyTypes[e.type].bombOnly &&
            !type.bomb &&
            t.level[0]<4
        )
            continue;


        if(
            e.distanceTravelled>
            furthest
        ){

            furthest=e.distanceTravelled;
            target=e;

        }

    }

    return target;

}


function canSeeCamo(t){

    const type=towerTypes[t.type];

    if(type.camo)
        return true;

    if(t.level[1]>=4)
        return true;

    for(const s of towers){

        if(
            towerTypes[s.type].name==="sonar" &&
            distance(
                s.x,
                s.y,
                t.x,
                t.y
            )<=
            towerTypes[s.type].range
        ){

            return true;

        }

    }

    return false;

}


function canHitFlying(t){

    const type=towerTypes[t.type];

    return(
        !!type.antiAir ||
        t.level[1]>=2
    );

}


/* =========================================================
                    FIRE PROJECTILE
========================================================= */

function fireTower(t,target){

    const type=towerTypes[t.type];

    let damage=
        type.damage*
        getPathDamageMultiplier(t)*
        towerDamageMultiplier(t);


    /*
      Lucky tower effect.
    */

    if(
        t.effect &&
        t.effect.name==="lucky" &&
        Math.random()<.15
    ){

        damage*=2;

        textEffect(
            target.x,
            target.y-25,
            "lucky"
        );

    }


    bullets.push({

        x:t.x,
        y:t.y,

        target:target,

        damage:damage,

        type:type.projectile,

        splash:type.splash||0,

        slow:type.slow||0,

        tower:t,

        speed:
            type.projectile==="laser"?
            2:
            1

    });

}


/* =========================================================
                    BULLET UPDATE
========================================================= */

function updateBullets(dt){

    for(const b of bullets){

        if(
            !b.target ||
            b.target.dead
        ){

            b.dead=true;
            continue;

        }

        const dx=
            b.target.x-b.x;

        const dy=
            b.target.y-b.y;

        const dist=
            Math.sqrt(
                dx*dx+
                dy*dy
            );

        let speed=b.speed;

        if(b.type==="missile")
            speed=.75;

        if(b.type==="meteor")
            speed=.65;

        if(b.type==="nuke")
            speed=.55;

        if(b.type==="rail")
            speed=4;

        if(dist<8){

            hitEnemy(
                b,
                b.target
            );

            b.dead=true;

            continue;

        }

        b.x+=
            dx/dist*
            speed*
            dt;

        b.y+=
            dy/dist*
            speed*
            dt;

    }


    bullets=
        bullets.filter(
            b=>!b.dead
        );

}


/* =========================================================
                     DAMAGE / IMMUNITIES
========================================================= */

function hitEnemy(b,e){

    if(e.dead)
        return;

    const type=enemyTypes[e.type];

    const towerType=
        towerTypes[b.tower.type];


    /*
      Bomb-only enemy.
    */

    if(
        type.bombOnly &&
        !towerType.bomb &&
        ![
            "bomb",
            "missile",
            "meteor",
            "nuke"
        ].includes(b.type)
    ){

        textEffect(
            e.x,
            e.y-20,
            "bomb only"
        );

        return;

    }


    /*
      Ice immunity.
    */

    if(
        type.iceImmune &&
        b.type==="ice"
    ){

        textEffect(
            e.x,
            e.y-20,
            "ice immune"
        );

        return;

    }


    /*
      Fire immunity.
    */

    if(
        type.fireImmune &&
        [
            "fire",
            "fireball"
        ].includes(b.type)
    ){

        textEffect(
            e.x,
            e.y-20,
            "fire immune"
        );

        return;

    }


    /*
      Electric immunity.
    */

    if(
        type.electricImmune &&
        b.type==="electric"
    ){

        textEffect(
            e.x,
            e.y-20,
            "electric immune"
        );

        return;

    }


    /*
      Water immunity.
    */

    if(
        type.waterImmune &&
        b.type==="water"
    ){

        textEffect(
            e.x,
            e.y-20,
            "water immune"
        );

        return;

    }


    let damage=b.damage;


    /*
      Armor.
    */

    if(
        type.armor &&
        ![
            "bomb",
            "missile",
            "meteor",
            "nuke",
            "rail"
        ].includes(b.type)
    ){

        damage=
            Math.max(
                1,
                damage*.25
            );

        if(
            b.tower.effect &&
            b.tower.effect.name==="piercing"
        ){

            damage*=1.8;

        }

    }


    /*
      Shield.
    */

    if(e.shield>0){

        const absorbed=
            Math.min(
                e.shield,
                damage
            );

        e.shield-=absorbed;

        damage-=absorbed;

    }


    if(damage>0)
        e.hp-=damage;


    /*
      Slow.
    */

    if(
        b.slow &&
        !type.iceImmune
    ){

        e.slow=
            Math.min(
                e.slow,
                b.slow
            );

        setTimeout(function(){

            if(!e.dead)
                e.slow=1;

        },1200);

    }


    /*
      Splash.
    */

    if(b.splash){

        for(const other of enemies){

            if(
                other===e ||
                other.dead
            )
                continue;

            if(
                distance(
                    e.x,
                    e.y,
                    other.x,
                    other.y
                )<=b.splash
            ){

                let splashDamage=
                    b.damage*.6;

                if(
                    enemyTypes[
                        other.type
                    ].armor
                ){

                    splashDamage*=.25;

                }

                other.hp-=splashDamage;

                if(other.hp<=0){

                    killEnemy(
                        other,
                        b.tower
                    );

                }

            }

        }

    }


    hitEffect(
        e.x,
        e.y,
        b.type
    );


    if(e.hp<=0){

        killEnemy(
            e,
            b.tower
        );

    }

}


/* =========================================================
                     KILL ENEMY
========================================================= */

function killEnemy(e,tower){

    if(e.dead)
        return;

    e.dead=true;

    money+=e.reward;

    if(tower)
        tower.kills++;


    /*
      Splitters produce several small enemies.
    */

    if(
        enemyTypes[e.type].split
    ){

        for(let i=0;i<3;i++){

            const child=
                enemyTypes.swarm;

            enemies.push({

                type:"swarm",

                x:e.x+
                    Math.random()*16-8,

                y:e.y+
                    Math.random()*16-8,

                pathIndex:e.pathIndex,

                hp:child.hp,
                maxHp:child.hp,

                speed:child.speed,

                reward:child.reward,

                shield:0,

                slow:1,

                dead:false,

                distanceTravelled:
                    e.distanceTravelled,

                regenTimer:0

            });

        }

    }

}


/* =========================================================
                     UPGRADES
========================================================= */

function getUpgradeCost(pathNumber,level){

    if(level>=5)
        return Infinity;

    let base=
        defaultUpgrades[
            "path"+
            (pathNumber+1)
        ][level].cost;

    /*
      Higher-tier upgrades become increasingly expensive.
    */

    base*=
        1+
        Math.max(
            0,
            wave-10
        )*.015;

    return Math.floor(base);

}


function upgradeTower(pathNumber){

    if(!selectedTower)
        return;

    const level=
        selectedTower.level[pathNumber];

    if(level>=5)
        return;

    const cost=
        getUpgradeCost(
            pathNumber,
            level
        );

    if(money<cost)
        return;

    money-=cost;

    selectedTower.invested+=cost;

    selectedTower.level[pathNumber]++;

    /*
      Unlocking tier 3 of path 3 gives
      the active ability.
    */

    if(
        pathNumber===2 &&
        selectedTower.level[2]===3
    ){

        selectedTower.abilityCooldown=0;

        textEffect(
            selectedTower.x,
            selectedTower.y-35,
            "ABILITY READY"
        );

    }

    updateUI();

}


/* =========================================================
                    SPECIAL ABILITIES
========================================================= */

function abilityName(t){

    const theme=
        upgradeThemes[t.type];

    if(!theme)
        return "ability";

    return theme.p3;

}


function activateAbility(){

    if(!selectedTower)
        return;

    const t=selectedTower;

    if(t.level[2]<3)
        return;

    if(t.abilityCooldown>0)
        return;

    const type=towerTypes[t.type];

    const power=
        1+
        t.level[2]*.35;

    t.abilityCooldown=
        Math.max(
            5000,
            18000-
            t.level[2]*1500
        );

    t.abilityActive=
        1800+
        t.level[2]*500;

    t.abilityUses++;

    /*
      Different towers have different ability behavior.
    */

    if(type.farm){

        money+=
            type.income*
            10*
            power;

        textEffect(
            t.x,
            t.y-30,
            abilityName(t)
        );

    }else{

        for(const e of enemies){

            if(e.dead)
                continue;

            if(
                distance(
                    t.x,
                    t.y,
                    e.x,
                    e.y
                )<=
                type.range*
                towerRangeMultiplier(t)*
                1.5
            ){

                e.hp-=
                    (type.damage||5)*
                    8*
                    power;

                if(type.slow){

                    e.slow=
                        Math.min(
                            e.slow,
                            .2
                        );

                }

                if(e.hp<=0)
                    killEnemy(e,t);

            }

        }

        textEffect(
            t.x,
            t.y-35,
            abilityName(t)
        );

    }

}


/* =========================================================
                  ABILITY UPDATE / VISUALS
========================================================= */

function updateTowerAbilities(dt){

    for(const t of towers){

        if(t.abilityActive>0){

            t.abilityActive-=dt;

            if(t.abilityActive<0)
                t.abilityActive=0;

        }

    }

}


/* =========================================================
                         SELL
========================================================= */

function sellTower(){

    if(!selectedTower)
        return;

    const refund=
        Math.floor(
            selectedTower.invested*.70
        );

    money+=refund;

    towers=
        towers.filter(
            t=>t!==selectedTower
        );

    selectedTower=null;

    updateUI();

}


/* =========================================================
                       EFFECTS
========================================================= */

function hitEffect(x,y,type){

    visualEffects.push({

        type:"hit",
        x:x,
        y:y,
        radius:5,
        life:250,
        maxLife:250,
        projectile:type

    });

}


function textEffect(x,y,text){

    visualEffects.push({

        type:"text",
        x:x,
        y:y,
        text:text,
        life:800,
        maxLife:800

    });

}


function updateVisualEffects(dt){

    for(const e of visualEffects){

        e.life-=dt;

        if(e.type==="hit")
            e.radius+=dt*.04;

        if(e.type==="text")
            e.y-=dt*.025;

    }

    visualEffects=
        visualEffects.filter(
            e=>e.life>0
        );

}


/* =========================================================
                         UI
========================================================= */

function updateUI(){

    document.getElementById("money").textContent=
        "Money: "+
        Math.floor(money);

    document.getElementById("hp").textContent=
        "HP: "+
        Math.floor(hp);

    document.getElementById("wave").textContent=
        "Wave: "+
        wave;

    document.getElementById("alive").textContent=
        "Enemies: "+
        enemies.length;


    const upgrades=
        document.getElementById(
            "upgradeBox"
        );

    const sell=
        document.getElementById(
            "sellButton"
        );

    const abilityButton=
        document.getElementById(
            "abilityButton"
        );

    const info=
        document.getElementById(
            "towerInfo"
        );


    /*
      Upgrade controls ONLY appear
      when a tower is selected.
    */

    if(selectedTower){

        upgrades.style.display="flex";
        sell.style.display="inline-block";

        const type=
            towerTypes[
                selectedTower.type
            ];

        let text=
            "Selected: "+
            type.name+
            " | levels "+
            selectedTower.level.join("-");


        if(selectedTower.effect){

            text+=
                " | effect: "+
                selectedTower.effect.name+
                " ("+
                selectedTower.effect.description+
                ")";

        }


        document.getElementById(
            "selected"
        ).textContent=text;


        /*
          Detailed tower information.
        */

        info.style.display="block";

        let damage=
            type.damage?
            type.damage*
            getPathDamageMultiplier(selectedTower)*
            towerDamageMultiplier(selectedTower):
            0;

        let range=
            type.range*
            towerRangeMultiplier(selectedTower);

        let rate=
            type.fireRate?
            type.fireRate*
            getFireRateMultiplier(selectedTower):
            0;

        let extra="";

        if(type.farm){

            extra=
                " income: "+
                Math.floor(
                    type.income*
                    (
                        1+
                        selectedTower.level[0]*.25
                    )*
                    (
                        1+
                        selectedTower.level[1]*.15
                    )*
                    towerIncomeMultiplier(
                        selectedTower
                    )
                )+
                "/second";

        }

        info.textContent=
            type.name+
            " | damage: "+
            (damage?
                damage.toFixed(1):
                "-")+
            " | range: "+
            range.toFixed(0)+
            " | fire rate: "+
            (rate?
                rate.toFixed(0)+"ms":
                "-")+
            extra+
            " | kills: "+
            selectedTower.kills;


        /*
          Upgrade buttons.
        */

        for(let i=0;i<3;i++){

            const button=
                document.getElementById(
                    "upgrade"+i
                );

            const level=
                selectedTower.level[i];


            if(level>=5){

                button.textContent=
                    i===2?
                    "Ability MAX":
                    "Path "+(i+1)+" MAX";

                button.disabled=true;

            }else{

                const cost=
                    getUpgradeCost(
                        i,
                        level
                    );

                const upgrade=
                    defaultUpgrades[
                        "path"+(i+1)
                    ][level];

                let name=
                    upgrade.name;

                if(
                    i===0 &&
                    upgradeThemes[
                        selectedTower.type
                    ]
                ){

                    name=
                        upgradeThemes[
                            selectedTower.type
                        ].p1+
                        " "+
                        (level+1);

                }

                if(
                    i===1 &&
                    upgradeThemes[
                        selectedTower.type
                    ]
                ){

                    name=
                        upgradeThemes[
                            selectedTower.type
                        ].p2+
                        " "+
                        (level+1);

                }

                if(
                    i===2 &&
                    upgradeThemes[
                        selectedTower.type
                    ]
                ){

                    name=
                        upgradeThemes[
                            selectedTower.type
                        ].p3+
                        " "+
                        (level+1);

                }


                button.textContent=
                    name+
                    " $"+
                    cost;

                button.disabled=
                    money<cost;

            }

        }


        /*
          Active ability button.
        */

        if(selectedTower.level[2]>=3){

            abilityButton.style.display="inline-block";

            abilityButton.textContent=
                selectedTower.abilityCooldown>0?
                "Ability cooldown "+
                Math.ceil(
                    selectedTower.abilityCooldown/1000
                )+
                "s":
                "Use "+
                abilityName(selectedTower);

            abilityButton.disabled=
                selectedTower.abilityCooldown>0;

        }else{

            abilityButton.style.display="none";

        }

    }else{

        upgrades.style.display="none";
        sell.style.display="none";
        abilityButton.style.display="none";
        info.style.display="none";

        if(selectedTowerType){

            document.getElementById(
                "selected"
            ).textContent=
                "Placing: "+
                towerTypes[
                    selectedTowerType
                ].name;

        }else{

            document.getElementById(
                "selected"
            ).textContent="";

        }

    }

}


/* =========================================================
                    PAUSE / AUTOPLAY
========================================================= */

function togglePause(){

    if(!gameRunning)
        return;

    paused=!paused;

}


function toggleAutoplay(){

    autoplay=!autoplay;

    document.getElementById(
        "auto"
    ).textContent=
        autoplay?
        "ON":
        "OFF";

}


/* =========================================================
                        DRAW
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBackground();
    drawWater();
    drawPath();
    drawTowers();
    drawEnemies();
    drawBullets();
    drawEffects();

    if(paused){

        ctx.font="42px Arial";

        ctx.fillText(
            "PAUSED",
            650,
            400
        );

    }

}


/* =========================================================
                    BACKGROUND
========================================================= */

function drawBackground(){

    ctx.fillStyle="white";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}


/* =========================================================
                        WATER
========================================================= */

function drawWater(){

    ctx.strokeStyle="black";
    ctx.fillStyle="white";

    for(const z of water){

        ctx.strokeRect(
            z.x,
            z.y,
            z.w,
            z.h
        );

        ctx.font="16px Arial";

        ctx.fillText(
            "water",
            z.x+10,
            z.y+22
        );

    }

}


/* =========================================================
                         PATH
========================================================= */

function drawPath(){

    ctx.lineCap="round";
    ctx.lineJoin="round";

    ctx.beginPath();

    ctx.moveTo(
        path[0][0],
        path[0][1]
    );

    for(let i=1;i<path.length;i++){

        ctx.lineTo(
            path[i][0],
            path[i][1]
        );

    }

    ctx.lineWidth=54;
    ctx.strokeStyle="black";
    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        path[0][0],
        path[0][1]
    );

    for(let i=1;i<path.length;i++){

        ctx.lineTo(
            path[i][0],
            path[i][1]
        );

    }

    ctx.lineWidth=46;
    ctx.strokeStyle="white";
    ctx.stroke();

    ctx.lineCap="butt";
    ctx.lineJoin="miter";

}


/* =========================================================
                         TOWERS
========================================================= */

function drawTowers(){

    ctx.textAlign="center";

    for(const t of towers){

        const type=
            towerTypes[t.type];


        /*
          RANGE CIRCLE
        */

        if(selectedTower===t){

            ctx.beginPath();

            ctx.arc(
                t.x,
                t.y,
                type.range*
                towerRangeMultiplier(t),
                0,
                Math.PI*2
            );

            ctx.stroke();


            /*
              PHYSICAL HITBOX
            */

            ctx.beginPath();

            ctx.arc(
                t.x,
                t.y,
                22,
                0,
                Math.PI*2
            );

            ctx.stroke();

        }


        /*
          Ability visual.
        */

        if(t.abilityActive>0){

            ctx.beginPath();

            ctx.arc(
                t.x,
                t.y,
                32+
                t.level[2]*5,
                0,
                Math.PI*2
            );

            ctx.stroke();

            ctx.beginPath();

            ctx.arc(
                t.x,
                t.y,
                42+
                t.level[2]*6,
                0,
                Math.PI*2
            );

            ctx.stroke();

        }


        /*
          Third-path permanent visual.
        */

        if(t.level[2]>0){

            ctx.beginPath();

            ctx.arc(
                t.x,
                t.y,
                27+
                t.level[2]*3,
                0,
                Math.PI*2
            );

            ctx.stroke();

        }


        ctx.font="16px Arial";

        ctx.fillText(
            type.name,
            t.x,
            t.y+5
        );


        /*
          Tower effect above tower.
        */

        if(t.effect){

            ctx.font="11px Arial";

            ctx.fillText(
                t.effect.name,
                t.x,
                t.y-15
            );

        }

    }

    ctx.textAlign="left";

}


/* =========================================================
                        ENEMIES
========================================================= */

function drawEnemies(){

    ctx.textAlign="center";

    for(const e of enemies){

        const type=
            enemyTypes[e.type];


        /*
          Main enemy name.
        */

        let enemyName="enemy";

        /*
          Animals/creatures are represented
          by what they do rather than merely
          naming the animal.
        */

        if(e.type==="flying")
            enemyName="flying";

        if(e.type==="giant")
            enemyName="giant";

        if(e.type==="swarm")
            enemyName="swarm";

        if(type.boss)
            enemyName="BOSS";


        ctx.font=
            Math.max(
                12,
                type.size
            )+
            "px Arial";


        ctx.fillText(
            enemyName,
            e.x,
            e.y
        );


        /*
          Normal enemies have NO label.
        */

        if(
            e.type!=="normal" &&
            type.label
        ){

            ctx.font="12px Arial";

            ctx.fillStyle=
                type.color||
                "black";

            ctx.fillText(
                type.label,
                e.x,
                e.y-type.size-6
            );

            ctx.fillStyle="black";

        }


        /*
          HP BAR
        */

        ctx.strokeRect(
            e.x-20,
            e.y+11,
            40,
            4
        );

        ctx.fillRect(
            e.x-20,
            e.y+11,
            40*
            Math.max(
                0,
                e.hp/e.maxHp
            ),
            4
        );


        /*
          Shield.
        */

        if(e.shield>0){

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                type.size+7,
                0,
                Math.PI*2
            );

            ctx.stroke();

        }


        /*
          Boss bar.
        */

        if(type.boss){

            ctx.strokeRect(
                e.x-60,
                e.y-65,
                120,
                8
            );

            ctx.fillRect(
                e.x-60,
                e.y-65,
                120*
                Math.max(
                    0,
                    e.hp/e.maxHp
                ),
                8
            );

        }

    }

    ctx.textAlign="left";

}


/* =========================================================
                       PROJECTILES
========================================================= */

function drawBullets(){

    ctx.textAlign="center";

    for(const b of bullets){

        ctx.font="12px Arial";

        ctx.fillText(
            b.type,
            b.x,
            b.y
        );

    }

    ctx.textAlign="left";

}


/* =========================================================
                        EFFECTS
========================================================= */

function drawEffects(){

    for(const e of visualEffects){

        ctx.globalAlpha=
            e.life/e.maxLife;


        if(e.type==="hit"){

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                e.radius,
                0,
                Math.PI*2
            );

            ctx.stroke();

        }else{

            ctx.font="13px Arial";

            ctx.fillText(
                e.text,
                e.x,
                e.y
            );

        }


        ctx.globalAlpha=1;

    }

}


/* =========================================================
                   PLACEMENT PREVIEW
========================================================= */

function drawPlacementPreview(){

    if(!selectedTowerType)
        return;

    const type=
        towerTypes[
            selectedTowerType
        ];

    ctx.globalAlpha=.6;


    /*
      Range.
    */

    ctx.beginPath();

    ctx.arc(
        mouseX,
        mouseY,
        type.range,
        0,
        Math.PI*2
    );

    ctx.stroke();


    /*
      Hitbox.
    */

    ctx.beginPath();

    ctx.arc(
        mouseX,
        mouseY,
        22,
        0,
        Math.PI*2
    );

    ctx.stroke();


    ctx.font="14px Arial";

    ctx.fillText(
        type.name,
        mouseX,
        mouseY
    );

    ctx.globalAlpha=1;

}


/* =========================================================
                       HELPERS
========================================================= */

function distance(
    x1,
    y1,
    x2,
    y2
){

    const dx=x2-x1;
    const dy=y2-y1;

    return Math.sqrt(
        dx*dx+
        dy*dy
    );

}


/* =========================================================
                       KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key===" ")
            togglePause();

        if(
            e.key.toLowerCase()==="r" &&
            gameRunning
        )
            restartGame();

        if(
            e.key==="Enter" &&
            gameRunning
        )
            startWave();

    }
);


/* =========================================================
                       GAME LOOP
========================================================= */

function gameLoop(now){

    const dt=
        Math.min(
            50,
            now-lastTime
        );

    lastTime=now;

    update(dt);

    draw();

    drawPlacementPreview();

    requestAnimationFrame(
        gameLoop
    );

}


updateMenu();

requestAnimationFrame(
    gameLoop
);

</script>
