/* =====================================================
   MAP
===================================================== */

function buildMap(){

game.innerHTML="";

const path=maps[chosenMap].path;


for(
let i=0;
i<path.length-1;
i++
){

const a=path[i];

const b=path[i+1];

const dx=b.x-a.x;

const dy=b.y-a.y;


const road=document.createElement("div");

road.style.position="absolute";


if(
Math.abs(dx)>Math.abs(dy)
){

road.style.left=
Math.min(a.x,b.x)+"px";

road.style.top=
a.y-20+"px";

road.style.width=
Math.abs(dx)+"px";

road.style.height="40px";

}

else{

road.style.left=
a.x-20+"px";

road.style.top=
Math.min(a.y,b.y)+"px";

road.style.width="40px";

road.style.height=
Math.abs(dy)+"px";

}


road.style.background="#eee";

road.style.border="1px solid #ccc";

road.style.boxSizing="border-box";

road.style.pointerEvents="none";


game.appendChild(road);

}


const start=
document.createElement("span");

start.textContent="start";

start.style.position="absolute";

start.style.left="5px";

start.style.top=
path[0].y-35+"px";

start.style.pointerEvents="none";

game.appendChild(start);


const end=
document.createElement("span");

end.textContent="end";

end.style.position="absolute";

end.style.left="850px";

end.style.top=
path[path.length-1].y-35+"px";

end.style.pointerEvents="none";

game.appendChild(end);

}


/* =====================================================
   RANGE CIRCLE
===================================================== */

function showRange(tower,x,y){

let range;

if(tower){

range=getStats(tower).range;

}

else{

range=towerTypes[selectedType].range;

}


/*
   Farms have no attack range.
*/

if(
range<=0
){

hideRange();

return;

}


let circle=
document.getElementById("rangeCircle");


if(!circle){

circle=
document.createElement("div");

circle.id="rangeCircle";

circle.style.position="absolute";

circle.style.border="1px solid black";

circle.style.borderRadius="50%";

circle.style.background="rgba(0,0,0,0.05)";

circle.style.pointerEvents="none";

circle.style.boxSizing="border-box";

circle.style.zIndex="5";

game.appendChild(circle);

}


circle.style.width=
(range*2)+"px";

circle.style.height=
(range*2)+"px";

circle.style.left=
(x-range)+"px";

circle.style.top=
(y-range)+"px";

circle.style.display="block";

}


function hideRange(){

const circle=
document.getElementById(
"rangeCircle"
);

if(circle){

circle.style.display="none";

}

}

/* =====================================================
   DISTANCE TO SEGMENT
===================================================== */

function distanceToSegment(
px,
py,
ax,
ay,
bx,
by
){

const dx=bx-ax;

const dy=by-ay;


if(
dx===0 &&
dy===0
){

return Math.hypot(
px-ax,
py-ay
);

}


const t=
Math.max(
0,
Math.min(
1,
(
(px-ax)*dx+
(py-ay)*dy
)/
(
dx*dx+
dy*dy
)
)
);


const x=ax+t*dx;

const y=ay+t*dy;


return Math.hypot(
px-x,
py-y
);

}


/* =====================================================
   ROAD CHECK
===================================================== */

function onRoad(x,y){

const path=
maps[chosenMap].path;

const roadWidth=55;


for(
let i=0;
i<path.length-1;
i++
){

const a=path[i];

const b=path[i+1];


if(
distanceToSegment(
x,
y,
a.x,
a.y,
b.x,
b.y
)<roadWidth
){

return true;

}

}


for(
let point of path
){

if(
Math.hypot(
x-point.x,
y-point.y
)<roadWidth
){

return true;

}

}


return false;

}


/* =====================================================
   GAME MOUSE MOVE
===================================================== */

game.addEventListener(
"mousemove",
function(event){

if(
paused
){

return;

}


const rect=
game.getBoundingClientRect();


const x=
event.clientX-rect.left;

const y=
event.clientY-rect.top;


/*
   If an existing tower is selected,
   keep its circle on it.
*/

if(
selectedTower
){

showRange(
selectedTower,
selectedTower.x,
selectedTower.y
);

return;

}


/*
   Otherwise show the selected tower's
   range at the mouse cursor.
*/

if(
towerTypes[selectedType].range>0
){

showRange(
null,
x,
y
);

}

});


/* =====================================================
   CLICK
===================================================== */

game.addEventListener(
"click",
function(event){

if(
paused
){

return;

}


/*
   Existing tower selected.
*/

if(
event.target.classList.contains("tower")
){

const tower=
towers.find(
t=>t.element===event.target
);


if(tower){

selectedTower=tower;

selectedType=tower.type;


document.getElementById(
"selected"
).textContent=
towerTypes[tower.type].name;


showTowerInfo();


showRange(
tower,
tower.x,
tower.y
);

}


return;

}


/*
   Build location.
*/

const rect=
game.getBoundingClientRect();


const x=
event.clientX-rect.left;

const y=
event.clientY-rect.top;


const data=
towerTypes[selectedType];


if(
towerCounts[selectedType]>=
MAX_TOWERS_PER_CLASS
){

alert(
"You already have 20 "+
data.name+
"s."
);

return;

}


if(
money<data.cost
){

return;

}


if(
onRoad(x,y)
){

return;

}


for(
let tower of towers
){

if(
Math.hypot(
tower.x-x,
tower.y-y
)<35
){

return;

}

}


money-=data.cost;


const element=
document.createElement("span");


element.className="tower";

element.textContent=data.name;

element.style.position="absolute";

element.style.left=x+"px";

element.style.top=y+"px";

element.style.transform=
"translate(-50%,-50%)";

element.style.fontWeight="bold";

element.style.cursor="pointer";

element.style.whiteSpace="nowrap";

element.style.zIndex="10";


game.appendChild(element);


const tower={

x:x,

y:y,

type:selectedType,

element:element,

cooldown:0,

farmTimer:5,

path1:0,

path2:0,

spent:data.cost

};


towers.push(tower);

towerCounts[selectedType]++;


selectedTower=tower;


document.getElementById(
"selected"
).textContent=
data.name;


showTowerInfo();


showRange(
tower,
x,
y
);


updateUI();

});


/* =====================================================
   UPGRADE COSTS
===================================================== */

function upgradeCost(level){

const costs=[
50,
100,
175,
275,
400
];

return costs[level]||null;

}


/* =====================================================
   STATS
===================================================== */

function getStats(tower){

const base=
towerTypes[tower.type];


let range=base.range;

let damage=base.damage;

let reload=base.reload;

let splash=0;

let slow=0;

let pierce=1;


if(
tower.type==="Arrow"
){

damage*=
1+tower.path1*.35;

range+=
tower.path2*35;

}


if(
tower.type==="Rapid"
){

reload/=
1+tower.path1*.25;

damage*=
1+tower.path2*.30;

}


if(
tower.type==="Cannon"
){

splash=
tower.path1*20;

damage*=
1+tower.path2*.35;

}


if(
tower.type==="Sniper"
){

damage*=
1+tower.path1*.45;

range+=
tower.path2*80;

}


if(
tower.type==="Ice"
){

slow=
tower.path1*.5;

range+=
tower.path2*35;

}


if(
tower.type==="Wizard"
){

damage*=
1+tower.path1*.30;

pierce+=
tower.path2*2;

}


return{

range,
damage,
reload,
splash,
slow,
pierce

};

}


/* =====================================================
   FARM
===================================================== */

function farmIncome(tower){

let income=
15+tower.path1*10;


let interval=
5-tower.path2*.7;


interval=
Math.max(
1.2,
interval
);


return{

income,
interval

};

}

const tower=selectedTower;

const data=
towerTypes[tower.type];


const cost1=
upgradeCost(tower.path1);

const cost2=
upgradeCost(tower.path2);

html+=
"<b>"+
data.name+
"</b><br>";


if(
tower.type==="Farm"
){

const farm=
farmIncome(tower);


html+=
"Income: $"+
farm.income+
"<br>";

html+=
"Every "+
farm.interval.toFixed(1)+
" seconds<br>";

"Only produces money during rounds.<br>";

}


html+=
"<br>"+
data.tree1+
" level "+
tower.path1+
"/5<br>";


if(
tower.path1>=5
){

html+="MAX";

}

else{

html+=
"<button onclick=\"upgradePath(1)\">"+
"Upgrade "+
data.tree1+
" ($"+
cost1+
")"+
"</button>";

}


html+="<br><br>";


html+=
data.tree2+
" level "+
tower.path2+
"/5<br>";


if(
tower.path2>=5
){

html+="MAX";

}

else{

html+=
"<button onclick=\"upgradePath(2)\">"+
"Upgrade "+
data.tree2+
" ($"+
cost2+
")"+
"</button>";

}


html+=
"<br><br>"+
"<button onclick=\"sellSelectedTower()\">"+
"Sell Tower"+
"</button>";


document.getElementById(
"upgrades"
).innerHTML=html;

}


/* =====================================================
   UPGRADE
===================================================== */

function upgradePath(path){

if(
!selectedTower
){

return;

}


const tower=selectedTower;


const level=
path===1
?
tower.path1
:
tower.path2;


if(
level>=5
){

return;

}


const cost=
upgradeCost(level);


if(
money<cost
){

return;

}


money-=cost;

tower.spent+=cost;


if(
path===1
){

tower.path1++;

}

else{

tower.path2++;

}


updateTowerText(tower);

showTowerInfo();


/*
   Update range immediately after
   upgrading.
*/

showRange(
tower,
tower.x,
tower.y
);


updateUI();

}


/* =====================================================
   SELL
===================================================== */

function sellSelectedTower(){

if(
!selectedTower
){

return;

}


const tower=selectedTower;


const refund=
Math.floor(
tower.spent*.70
);


money+=refund;


towerCounts[tower.type]--;


tower.element.remove();


const index=
towers.indexOf(tower);


if(
index!==-1
){

towers.splice(
index,
1
);

}


selectedTower=null;


document.getElementById(
"selected"
).textContent="None";


showNoTowerSelected();

hideRange();

updateUI();

}


/* =====================================================
   TOWER TEXT
===================================================== */

function updateTowerText(tower){

const data=
towerTypes[tower.type];


const level=
tower.path1+
tower.path2;


tower.element.textContent=
data.name+
" "+
level;

}


/* =====================================================
   PATH LENGTH
===================================================== */

function pathLength(){

const path=
maps[chosenMap].path;

let total=0;


for(
let i=0;
i<path.length-1;
i++
){

total+=
Math.hypot(

path[i+1].x-
path[i].x,

path[i+1].y-
path[i].y

);

}


return total;

}


/* =====================================================
   GET POSITION ON PATH
===================================================== */

function getPath(distance){

const path=
maps[chosenMap].path;


if(
distance<=0
){

return{
x:path[0].x,
y:path[0].y
};

}


let remaining=distance;


for(
let i=0;
i<path.length-1;
i++
){

const a=path[i];

const b=path[i+1];


const dx=b.x-a.x;

const dy=b.y-a.y;


const length=
Math.hypot(
dx,
dy
);


if(
remaining<=length
){

const ratio=
remaining/length;


return{

x:a.x+dx*ratio,

y:a.y+dy*ratio

};

}


remaining-=length;

}


const last=
path[path.length-1];


return{

x:last.x,

y:last.y

};

}


/* =====================================================
   SPAWN ENEMY
===================================================== */

function spawnEnemy(){

let type;

const r=Math.random();


if(
round>=12 &&
Math.random()<.06
){

type=enemyTypes[5];

}

else if(
round>=6 &&
r<.20
){

type=enemyTypes[4];

}

else if(
r<.40
){

type=enemyTypes[3];

}

else if(
r<.65
){

type=enemyTypes[2];

}

else if(
r<.85
){

type=enemyTypes[1];

}

else{

type=enemyTypes[0];

}


const difficulty=
difficulties[chosenDifficulty];


let hp=
type.hp*
difficulty.enemyHealth;


hp+=round*6;


if(
type.name==="boss"
){

hp+=round*40;

}


const element=
document.createElement("span");


element.textContent=
type.name;

element.style.position="absolute";

element.style.color="red";

element.style.fontWeight="bold";

element.style.transform=
"translate(-50%,-50%)";

element.style.whiteSpace="nowrap";

element.style.pointerEvents="none";

element.style.zIndex="20";


if(
type.name==="boss"
){

element.style.fontSize="20px";

}


game.appendChild(element);


enemies.push({

type:type,

hp:hp,

distance:0,

speed:
type.speed*
difficulty.enemySpeed,

slow:0,

element:element

});

}


/* =====================================================
   START ROUND
===================================================== */

function startRound(){

if(
roundRunning ||
paused
){

return;

}


roundRunning=true;


const difficulty=
difficulties[chosenDifficulty];


enemiesToSpawn=
Math.floor(

(
7+
round*2
)*
difficulty.roundSize

);


if(
round%5===0
){

enemiesToSpawn+=5;

}


spawnTimer=0;

}


/* =====================================================
   ROUND UPDATE
===================================================== */

function roundUpdate(dt){

if(
!roundRunning
){

nextRoundTimer-=dt;


if(
autoplay &&
nextRoundTimer<=0
){

startRound();

}


return;

}


spawnTimer-=dt;


if(
enemiesToSpawn>0 &&
spawnTimer<=0
){

spawnEnemy();

enemiesToSpawn--;


spawnTimer=
Math.max(
.15,
.45-round*.005
);

}


if(
enemiesToSpawn===0 &&
enemies.length===0
){

roundRunning=false;

nextRoundTimer=3;

money+=
20+
round*3;

round++;


updateUI();

}

}


/* =====================================================
   TOWER UPDATE
===================================================== */

function towerUpdate(dt){

for(
let tower of towers
){

/*
   FARM
*/

if(
tower.type==="Farm"
){

if(
!roundRunning ||
paused
){

continue;

}


const farm=
farmIncome(tower);


tower.farmTimer-=dt;


if(
tower.farmTimer<=0
){

money+=farm.income;

tower.farmTimer=
farm.interval;

updateUI();

}


continue;

}


/*
   NORMAL TOWER
*/

const stats=
getStats(tower);


tower.cooldown-=dt;


if(
tower.cooldown>0
){

continue;

}


let target=null;

let best=-Infinity;


for(
let enemy of enemies
){

const p=
getPath(enemy.distance);


const distance=
Math.hypot(

p.x-tower.x,

p.y-tower.y

);


if(
distance<=stats.range &&
enemy.distance>best
){

target=enemy;

best=enemy.distance;

}

}


if(
target
){

fire(
tower,
target
);

tower.cooldown=
stats.reload;

}

}

}


/* =====================================================
   FIRE
===================================================== */

function fire(tower,target){

const stats=
getStats(tower);


const element=
document.createElement("span");


element.textContent="bullet";

element.style.position="absolute";

element.style.fontSize="10px";

element.style.fontWeight="bold";

element.style.pointerEvents="none";

element.style.zIndex="30";


game.appendChild(element);


bullets.push({

x:tower.x,

y:tower.y,

target:target,

speed:
towerTypes[
tower.type
].speed,

damage:stats.damage,

splash:stats.splash,

slow:stats.slow,

pierce:stats.pierce,

element:element

});

}


/* =====================================================
   BULLETS
===================================================== */

function bulletUpdate(dt){

for(
let i=bullets.length-1;
i>=0;
i--
){

const bullet=
bullets[i];


if(
!enemies.includes(
bullet.target
)
){

bullet.element.remove();

bullets.splice(
i,
1
);

continue;

}


const p=
getPath(
bullet.target.distance
);


const dx=p.x-bullet.x;

const dy=p.y-bullet.y;


const distance=
Math.hypot(
dx,
dy
);


const movement=
bullet.speed*dt;


if(
distance<=movement
){

hit(bullet);

bullet.element.remove();

bullets.splice(
i,
1
);

}

else{

bullet.x+=
dx/distance*
movement;

bullet.y+=
dy/distance*
movement;


bullet.element.style.left=
bullet.x+"px";

bullet.element.style.top=
bullet.y+"px";

}

}

}


/* =====================================================
   HIT
===================================================== */

function hit(bullet){

const target=
bullet.target;


target.hp-=
bullet.damage;


if(
bullet.slow>0
){

target.slow=
Math.max(
target.slow,
1.5+
bullet.slow
);

}


/*
   Cannon splash.
*/

if(
bullet.splash>0
){

const center=
getPath(
target.distance
);


for(
let enemy of enemies
){

if(
enemy===target
){

continue;

}


const p=
getPath(
enemy.distance
);


if(
Math.hypot(
center.x-p.x,
center.y-p.y
)<
55+
bullet.splash
){

enemy.hp-=
bullet.damage*.45;

}

}

}


/*
   Wizard pierce.
*/

if(
bullet.pierce>1
){

let hits=0;

const center=
getPath(
target.distance
);


for(
let enemy of enemies
){

if(
enemy===target
){

continue;

}


if(
hits>=bullet.pierce-1
){

break;

}


const p=
getPath(
enemy.distance
);


if(
Math.hypot(
center.x-p.x,
center.y-p.y
)<50
){

enemy.hp-=
bullet.damage*.5;

hits++;

}

}

}


checkDeaths();

}


/* =====================================================
   DEATHS
===================================================== */

function checkDeaths(){

const difficulty=
difficulties[chosenDifficulty];


for(
let i=enemies.length-1;
i>=0;
i--
){

const enemy=
enemies[i];


if(
enemy.hp<=0
){

money+=
enemy.type.reward*
difficulty.moneyMultiplier;


score+=
enemy.type.reward*10;


enemy.element.remove();


enemies.splice(
i,
1
);


updateUI();

}

}

}


/* =====================================================
   ENEMIES
===================================================== */

function enemyUpdate(dt){

const total=
pathLength();


for(
let i=enemies.length-1;
i>=0;
i--
){

const enemy=
enemies[i];


let speed=
enemy.speed;


if(
enemy.slow>0
){

speed*=.45;

enemy.slow-=dt;

}


enemy.distance+=
speed*dt;


const p=
getPath(
enemy.distance
);


enemy.element.style.left=
p.x+"px";

enemy.element.style.top=
p.y+"px";


if(
enemy.distance>=total
){

enemy.element.remove();


enemies.splice(
i,
1
);


if(
enemy.type.name==="boss"
){

lives-=5;

}

else{

lives--;

}


updateUI();


if(
lives<=0
){

gameOver();

}

}

}

}


/* =====================================================
   AUTOPLAY
===================================================== */

function toggleAuto(){

autoplay=!autoplay;


document.getElementById(
"auto"
).textContent=
autoplay
?
"ON"
:
"OFF";


if(
autoplay &&
!roundRunning &&
enemies.length===0
){

startRound();

}

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

roundRunning=false;

paused=true;

hideRange();


document.getElementById(
"finalScore"
).textContent=score;


document.getElementById(
"gameOver"
).style.display="block";

}


/* =====================================================
   GAME LOOP
===================================================== */

function loop(time){

let dt=
(time-lastTime)/1000;


lastTime=time;


dt=Math.min(
dt,
0.05
);


if(
!paused &&
document.getElementById(
"gameScreen"
).style.display!=="none"
){

roundUpdate(dt);

enemyUpdate(dt);

towerUpdate(dt);

bulletUpdate(dt);

}


requestAnimationFrame(loop);

}


/* =====================================================
   INITIALIZE
===================================================== */

showNoTowerSelected();

requestAnimationFrame(loop);

</script>
