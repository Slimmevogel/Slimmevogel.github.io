/* =====================================================

function buildMap(){

    game.innerHTML="";

    const path=maps[chosenMap].path;

    for(let i=0;i<path.length-1;i++){

        const a=path[i];
        const b=path[i+1];

        const dx=b.x-a.x;
        const dy=b.y-a.y;

        const road=document.createElement("div");

        road.style.position="absolute";

        if(Math.abs(dx)>Math.abs(dy)){

            road.style.left=Math.min(a.x,b.x)+"px";
            road.style.top=(a.y-28)+"px";
            road.style.width=Math.abs(dx)+"px";
            road.style.height="56px";

        } else {

            road.style.left=(a.x-28)+"px";
            road.style.top=Math.min(a.y,b.y)+"px";
            road.style.width="56px";
            road.style.height=Math.abs(dy)+"px";
        }

        road.style.background="#eee";
        road.style.border="1px solid #ccc";
        road.style.boxSizing="border-box";
        road.style.pointerEvents="none";
        road.style.zIndex="1";

        game.appendChild(road);
    }


    const start=document.createElement("span");

    start.textContent="start";

    start.style.position="absolute";
    start.style.left="5px";
    start.style.top=(path[0].y-45)+"px";
    start.style.pointerEvents="none";
    start.style.zIndex="2";

    game.appendChild(start);


    const end=document.createElement("span");

    end.textContent="end";

    end.style.position="absolute";
    end.style.left=(path[path.length-1].x-20)+"px";
    end.style.top=(path[path.length-1].y-45)+"px";
    end.style.pointerEvents="none";
    end.style.zIndex="2";

    game.appendChild(end);
}

        range=getStats(tower).range;
    } else {

    }

    if(range<=0){
        hideRange();
        return;
    }

    let circle=document.getElementById("rangeCircle");

    if(!circle){

        circle=document.createElement("div");

        circle.id="rangeCircle";

        game.appendChild(circle);
    }

    circle.style.width=(range*2)+"px";
    circle.style.height=(range*2)+"px";
    circle.style.left=(x-range)+"px";
    circle.style.top=(y-range)+"px";
    circle.style.display="block";
}


function hideRange(){

    const circle=document.getElementById("rangeCircle");

    if(circle){

/* =====================================================
   ROAD CHECK
===================================================== */

function distanceToSegment(px,py,ax,ay,bx,by){

    const dx=bx-ax;
    const dy=by-ay;

    if(dx===0 && dy===0){
        return Math.hypot(px-ax,py-ay);
    }

    const t=Math.max(
        0,
        Math.min(
            1,
            (
                (px-ax)*dx+
                (py-ay)*dy
            )/
            (
                dx*dx+
                dy*dy
            )
        )
    );

    const x=ax+t*dx;
    const y=ay+t*dy;

    return Math.hypot(px-x,py-y);
}


function onRoad(x,y){

    const path=maps[chosenMap].path;

    for(let i=0;i<path.length-1;i++){

        const a=path[i];
        const b=path[i+1];

        if(
            distanceToSegment(
                x,y,
                a.x,a.y,
                b.x,b.y
            )<70
        ){
            return true;
        }
    }

    return false;
}


/* =====================================================
   MOUSE RANGE
===================================================== */

game.addEventListener("mousemove",function(event){

    if(paused){
        return;
    }

    if(selectedTower){

        showRange(
            selectedTower,
            selectedTower.x,
            selectedTower.y
        );

        return;
    }

    const rect=game.getBoundingClientRect();

    const x=event.clientX-rect.left;
    const y=event.clientY-rect.top;

    if(towerTypes[selectedType].range>0){

        showRange(null,x,y);
    }
});


/* =====================================================
   PLACE / SELECT
===================================================== */

game.addEventListener("click",function(event){

    if(paused){
        return;
    }


    if(event.target.classList.contains("tower")){

        const tower=towers.find(
            t=>t.element===event.target
        );

        if(tower){

            selectedTower=tower;
            selectedType=tower.type;

            document.getElementById("selected")
                .textContent=towerTypes[tower.type].name;

            showTowerInfo();

            showRange(
                tower,
                tower.x,
                tower.y
            );
        }

        return;
    }


    const rect=game.getBoundingClientRect();

    const x=event.clientX-rect.left;
    const y=event.clientY-rect.top;

    const data=towerTypes[selectedType];


    if(towerCounts[selectedType]>=20){

        alert(
            "You already have 20 "+
            data.name+
            "s."
        );

        return;
    }


    if(money<data.cost){
        return;
    }


    if(onRoad(x,y)){
        return;
    }


    for(let tower of towers){

        if(
            Math.hypot(
                tower.x-x,
                tower.y-y
            )<35
        ){
            return;
        }
    }


    money-=data.cost;


    const element=document.createElement("span");

    element.className="tower";

    element.textContent=data.name;

    element.style.left=x+"px";
    element.style.top=y+"px";


    game.appendChild(element);


    const tower={

        x:x,
        y:y,

        type:selectedType,

        element:element,

        cooldown:0,

        farmTimer:5,

        path1:0,
        path2:0,

        spent:data.cost
    };


    towers.push(tower);

    towerCounts[selectedType]++;

    selectedTower=tower;


    document.getElementById("selected")
        .textContent=data.name;


    showTowerInfo();

    showRange(
        tower,
        x,
        y
    );

    updateUI();
});

function getStats(tower){

    let reload=base.reload;

    let slow=0;

        range+=tower.path2*35;
    }


    if(tower.type==="Rapid"){

        reload/=1+tower.path1*.25;
        damage*=1+tower.path2*.30;
    }


    if(tower.type==="Cannon"){

        splash=tower.path1*20;
        damage*=1+tower.path2*.35;
    }


    if(tower.type==="Sniper"){

        damage*=1+tower.path1*.45;
        range+=tower.path2*80;
    }


    if(tower.type==="Ice"){

        slow=tower.path1*.5;
        range+=tower.path2*35;
    }


    if(tower.type==="Wizard"){

        damage*=1+tower.path1*.30;
        pierce+=tower.path2*2;
    }


    return {
        range,
        damage,
        reload,
        splash,
        slow,
        pierce
    };
}


/* =====================================================
   FARM
===================================================== */

function farmIncome(tower){

    let income=15+tower.path1*10;

    let interval=5-tower.path2*.7;

    interval=Math.max(1.2,interval);

    return {
        income,
        interval
    };
}


/* =====================================================
   TOWER INFO
===================================================== */

function showNoTowerSelected(){

    document.getElementById("upgrades").innerHTML=
        "Select a tower to see upgrades.";
}


function showTowerInfo(){

    if(!selectedTower){

        showNoTowerSelected();

        return;
    }


    const tower=selectedTower;
    const data=towerTypes[tower.type];

    const cost1=upgradeCost(tower.path1);
    const cost2=upgradeCost(tower.path2);

    let html="<hr>";

    html+="<b>"+data.name+"</b><br>";


    if(tower.type==="Farm"){

        const farm=farmIncome(tower);

        html+="Income: $"+farm.income+"<br>";
        html+="Every "+farm.interval.toFixed(1)+" seconds<br>";
        html+="Only produces money during rounds.<br>";
    }
    else{

        const stats=getStats(tower);

        html+="Damage: "+Math.floor(stats.damage)+"<br>";
        html+="Range: "+Math.floor(stats.range)+"<br>";

        html+="<br>";

        html+="Can detect camouflage: "+
            (data.detectCamo?"yes":"no")+
            "<br>";

        html+="Can damage armored: "+
            (data.canArmored?"yes":"no")+
            "<br>";

        html+="Can damage shielded: "+
            (data.canShield?"yes":"no")+
            "<br>";
    }


    html+="<br>";

    html+=
        data.tree1+
        " level "+
        tower.path1+
        "/5<br>";


    if(tower.path1>=5){

        html+="MAX";

    } else {

        html+=
            "<button onclick=\"upgradePath(1)\">"+
            "Upgrade "+
            data.tree1+
            " ($"+
            cost1+
            ")"+
            "</button>";
    }


    html+="<br><br>";


    html+=
        data.tree2+
        " level "+
        tower.path2+
        "/5<br>";


    if(tower.path2>=5){

        html+="MAX";

    } else {

        html+=
            "<button onclick=\"upgradePath(2)\">"+
            "Upgrade "+
            data.tree2+
            " ($"+
            cost2+
            ")"+
            "</button>";
    }


    html+=
        "<br><br>"+
        "<button onclick=\"sellSelectedTower()\">"+
        "Sell Tower"+
        "</button>";


    document.getElementById("upgrades")
        .innerHTML=html;
}


/* =====================================================
   UPGRADE
===================================================== */

function upgradePath(path){

    if(!selectedTower){
        return;
    }


    const tower=selectedTower;

    const level=
        path===1
        ?
        tower.path1
        :
        tower.path2;


    if(level>=5){
        return;
    }


    const cost=upgradeCost(level);


    if(money<cost){
        return;
    }


    money-=cost;

    tower.spent+=cost;


    if(path===1){
        tower.path1++;
    } else {
        tower.path2++;
    }


    updateTowerText(tower);

    showTowerInfo();

    showRange(
        tower,
        tower.x,
        tower.y
    );

    updateUI();
}


/* =====================================================
   SELL
===================================================== */

function sellSelectedTower(){

    if(!selectedTower){
        return;
    }


    const tower=selectedTower;

    const refund=Math.floor(
        tower.spent*.70
    );


    money+=refund;

    towerCounts[tower.type]--;

    tower.element.remove();


    const index=towers.indexOf(tower);

    if(index!==-1){
        towers.splice(index,1);
    }


    selectedTower=null;


    document.getElementById("selected")
        .textContent="None";


    showNoTowerSelected();

    hideRange();

    updateUI();
}


/* =====================================================
   TOWER TEXT
===================================================== */

function updateTowerText(tower){

    const data=towerTypes[tower.type];

    const level=tower.path1+tower.path2;

    tower.element.textContent=
        data.name+" "+level;
}


/* =====================================================
   PATH LENGTH
===================================================== */

function pathLength(){

    const path=maps[chosenMap].path;

    let total=0;

    for(let i=0;i<path.length-1;i++){

        total+=Math.hypot(
            path[i+1].x-path[i].x,
            path[i+1].y-path[i].y
        );
    }

    return total;
}


/* =====================================================
   PATH POSITION
===================================================== */

function getPath(distance){

    const path=maps[chosenMap].path;

    if(distance<=0){

        return {
            x:path[0].x,
            y:path[0].y
        };
    }


    let remaining=distance;


    for(let i=0;i<path.length-1;i++){

        const a=path[i];
        const b=path[i+1];

        const dx=b.x-a.x;
        const dy=b.y-a.y;

        const length=Math.hypot(dx,dy);


        if(remaining<=length){

            const ratio=remaining/length;

            return {
                x:a.x+dx*ratio,
                y:a.y+dy*ratio
            };
        }


        remaining-=length;
    }


    const last=path[path.length-1];

    return {
        x:last.x,
        y:last.y
    };
}


/* =====================================================
   ENEMY SELECTION
===================================================== */

/*
    Special enemies are intentionally rare.

    Waves:
    1-3  : normal enemies only
    4+   : fast
    6+   : armored
    8+   : camouflage
    10+  : shielded
    12+  : regenerating
    15+  : bosses
*/

function chooseEnemyType(){

    const r=Math.random();


    /* Boss */

    if(
        round>=15 &&
        r<.025
    ){

        return enemyTypes.find(
            e=>e.name==="boss"
        );
    }


    /* Regenerating */

    if(
        round>=12 &&
        r<.06
    ){

        return enemyTypes.find(
            e=>e.name==="regenerating"
        );
    }


    /* Shield */

    if(
        round>=10 &&
        r<.11
    ){

        return enemyTypes.find(
            e=>e.name==="shielded"
        );
    }


    /* Camouflage */

    if(
        round>=8 &&
        r<.17
    ){

        return enemyTypes.find(
            e=>e.name==="camouflage"
        );
    }


    /* Armored */

    if(
        round>=6 &&
        r<.25
    ){

        return enemyTypes.find(
            e=>e.name==="armored"
        );
    }


    /* Fast */

    if(
        round>=4 &&
        r<.36
    ){

        return enemyTypes.find(
            e=>e.name==="fast"
        );
    }


    /* Regular */

    const regular=[
        enemyTypes[0],
        enemyTypes[1],
        enemyTypes[2],
        enemyTypes[3]
    ];


    return regular[
        Math.floor(
            Math.random()*regular.length
        )
    ];
}


/* =====================================================
   SPAWN
===================================================== */

function spawnEnemy(){

    const type=chooseEnemyType();

    const difficulty=
        difficulties[chosenDifficulty];


    let hp=
        type.hp*
        difficulty.enemyHealth;


    hp+=round*6;


    if(type.name==="boss"){
        hp+=round*40;
    }


    const element=
        document.createElement("div");


    element.className="enemy";


    const typeElement=
        document.createElement("span");

    typeElement.className="enemyType";

    typeElement.textContent=
        type.label;

    typeElement.style.color=
        type.color;


    const nameElement=
        document.createElement("span");

    nameElement.className="enemyName";

    nameElement.textContent=
        type.name;


    element.appendChild(typeElement);
    element.appendChild(nameElement);


    game.appendChild(element);


    enemies.push({

        type:type,

        hp:hp,

        distance:0,

        speed:
            type.speed*
            difficulty.enemySpeed,

        slow:0,

        element:element
    });
}


/* =====================================================
   START ROUND
===================================================== */

function startRound(){

    if(roundRunning || paused){
        return;
    }


    roundRunning=true;


    const difficulty=
        difficulties[chosenDifficulty];


    enemiesToSpawn=
        Math.floor(
            (7+round*2)*
            difficulty.roundSize
        );


    if(round%5===0){
        enemiesToSpawn+=5;
    }


    spawnTimer=0;
}


/* =====================================================
   ROUND UPDATE
===================================================== */

function roundUpdate(dt){

    if(!roundRunning){

        nextRoundTimer-=dt;


        if(
            autoplay &&
            nextRoundTimer<=0
        ){

            startRound();
        }


        return;
    }


    spawnTimer-=dt;


    if(
        enemiesToSpawn>0 &&
        spawnTimer<=0
    ){

        spawnEnemy();

        enemiesToSpawn--;


        spawnTimer=
            Math.max(
                .15,
                .45-round*.005
            );
    }


    if(
        enemiesToSpawn===0 &&
        enemies.length===0
    ){

        roundRunning=false;

        nextRoundTimer=3;


        money+=
            20+
            round*3;


        round++;


        updateUI();
    }
}


/* =====================================================
   TOWER UPDATE
===================================================== */

function towerUpdate(dt){

    for(let tower of towers){

        /* FARM */

        if(tower.type==="Farm"){

            /*
                Important:
                Farms only make money while the
                round is actively running.
            */

            if(!roundRunning || paused){
                continue;
            }


            const farm=farmIncome(tower);

            tower.farmTimer-=dt;


            if(tower.farmTimer<=0){

                money+=farm.income;

                tower.farmTimer=
                    farm.interval;

                updateUI();
            }


            continue;
        }


        const stats=getStats(tower);


        tower.cooldown-=dt;


        if(tower.cooldown>0){
            continue;
        }


        let target=null;
        let best=-Infinity;


        for(let enemy of enemies){

            if(
                !canTowerHitEnemy(
                    tower,
                    enemy
                )
            ){
                continue;
            }


            const p=
                getPath(
                    enemy.distance
                );


            const distance=
                Math.hypot(
                    p.x-tower.x,
                    p.y-tower.y
                );


            if(
                distance<=stats.range &&
                enemy.distance>best
            ){

                target=enemy;
                best=enemy.distance;
            }
        }


        if(target){

            fire(
                tower,
                target
            );

            tower.cooldown=
                stats.reload;
        }
    }
}


/* =====================================================
   SPECIAL ENEMY RESTRICTIONS
===================================================== */

function canTowerHitEnemy(tower,enemy){

    const data=towerTypes[tower.type];
    const type=enemy.type;


    /* Farms never attack */

    if(tower.type==="Farm"){
        return false;
    }


    /* Camouflage */

    if(
        type.camo &&
        !data.detectCamo
    ){

        return false;
    }


    /* Armored */

    if(
        type.armored &&
        !data.canArmored
    ){

        return false;
    }


    /* Shielded */

    if(
        type.shielded &&
        !data.canShield
    ){

        return false;
    }


    return true;
}


/* =====================================================
   FIRE
===================================================== */

function fire(tower,target){

    const stats=getStats(tower);

    const element=
        document.createElement("span");


    element.textContent="bullet";

    element.style.position="absolute";
    element.style.fontSize="10px";
    element.style.fontWeight="bold";
    element.style.pointerEvents="none";
    element.style.zIndex="30";


    game.appendChild(element);


    bullets.push({

        x:tower.x,
        y:tower.y,

        target:target,

        speed:
            towerTypes[
                tower.type
            ].speed,

        damage:stats.damage,

        splash:stats.splash,

        slow:stats.slow,

        pierce:stats.pierce,

        tower:tower,

        element:element
    });
}


/* =====================================================
   BULLET UPDATE
===================================================== */

function bulletUpdate(dt){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const bullet=bullets[i];


        if(
            !enemies.includes(
                bullet.target
            )
        ){

            bullet.element.remove();

            bullets.splice(i,1);

            continue;
        }


        const p=
            getPath(
                bullet.target.distance
            );


        const dx=p.x-bullet.x;
        const dy=p.y-bullet.y;

        const distance=
            Math.hypot(dx,dy);


        const movement=
            bullet.speed*dt;


        if(distance<=movement){

            hit(bullet);

            bullet.element.remove();

            bullets.splice(i,1);

        } else {

            bullet.x+=
                dx/distance*
                movement;

            bullet.y+=
                dy/distance*
                movement;


            bullet.element.style.left=
                bullet.x+"px";

            bullet.element.style.top=
                bullet.y+"px";
        }
    }
}


/* =====================================================
   HIT
===================================================== */

function hit(bullet){

    const target=bullet.target;


    /*
       Double-check restrictions when the bullet
       reaches the enemy.
    */

    if(
        !canTowerHitEnemy(
            bullet.tower,
            target
        )
    ){

        return;
    }


    let damage=bullet.damage;


    /*
       Armored enemies take only 55% damage
       from towers that CAN damage armor.
    */

    if(target.type.armored){

        damage*=.55;
    }


    /*
       Shielded enemies take only 60% damage
       from towers that can penetrate shields.
    */

    if(target.type.shielded){

        damage*=.60;
    }


    target.hp-=damage;


    if(bullet.slow>0){

        target.slow=
            Math.max(
                target.slow,
                1.5+
                bullet.slow
            );
    }


    /* Cannon splash */

    if(bullet.splash>0){

        const center=
            getPath(
                target.distance
            );


        for(let enemy of enemies){

            if(enemy===target){
                continue;
            }


            if(
                !canTowerHitEnemy(
                    bullet.tower,
                    enemy
                )
            ){
                continue;
            }


            const p=
                getPath(
                    enemy.distance
                );


            if(
                Math.hypot(
                    center.x-p.x,
                    center.y-p.y
                )<
                55+
                bullet.splash
            ){

                let splashDamage=
                    bullet.damage*.45;


                if(enemy.type.armored){
                    splashDamage*=.55;
                }

                if(enemy.type.shielded){
                    splashDamage*=.60;
                }


                enemy.hp-=splashDamage;
            }
        }
    }


    /* Wizard pierce */

    if(bullet.pierce>1){

        let hits=0;

        const center=
            getPath(
                target.distance
            );


        for(let enemy of enemies){

            if(enemy===target){
                continue;
            }


            if(
                hits>=
                bullet.pierce-1
            ){
                break;
            }


            if(
                !canTowerHitEnemy(
                    bullet.tower,
                    enemy
                )
            ){
                continue;
            }


            const p=
                getPath(
                    enemy.distance
                );


            if(
                Math.hypot(
                    center.x-p.x,
                    center.y-p.y
                )<50
            ){

                let extra=
                    bullet.damage*.5;


                if(enemy.type.armored){
                    extra*=.55;
                }

                if(enemy.type.shielded){
                    extra*=.60;
                }


                enemy.hp-=extra;

                hits++;
            }
        }
    }


    checkDeaths();
}


/* =====================================================
   DEATHS
===================================================== */

function checkDeaths(){

    const difficulty=
        difficulties[chosenDifficulty];


    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const enemy=enemies[i];


        if(enemy.hp<=0){

            money+=
                enemy.type.reward*
                difficulty.moneyMultiplier;


            score+=
                enemy.type.reward*10;


            enemy.element.remove();


            enemies.splice(i,1);


            updateUI();
        }
    }
}


/* =====================================================
   ENEMY UPDATE
===================================================== */

function enemyUpdate(dt){

    const total=pathLength();


    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const enemy=enemies[i];


        let speed=enemy.speed;


        if(enemy.slow>0){

            speed*=.45;

            enemy.slow-=dt;
        }


        /* Regeneration */

        if(enemy.type.regen){

            enemy.hp+=
                7*dt;


            const maxHP=
                (
                    enemy.type.hp*
                    difficulties[
                        chosenDifficulty
                    ].enemyHealth
                )+
                round*6;


            if(enemy.hp>maxHP){
                enemy.hp=maxHP;
            }
        }


        enemy.distance+=
            speed*dt;


        const p=
            getPath(
                enemy.distance
            );


        enemy.element.style.left=
            p.x+"px";

        enemy.element.style.top=
            p.y+"px";


        if(
            enemy.distance>=total
        ){

            enemy.element.remove();

            enemies.splice(i,1);


            if(enemy.type.name==="boss"){

                lives-=5;

            } else {

                lives--;
            }


            updateUI();


            if(lives<=0){

                gameOver();
            }
        }
    }
}


/* =====================================================
   AUTOPLAY
===================================================== */

function toggleAuto(){

    autoplay=!autoplay;


    document.getElementById("auto")
        .textContent=
        autoplay
        ?
        "ON"
        :
        "OFF";


    if(
        autoplay &&
        !roundRunning &&
        enemies.length===0
    ){

        startRound();
    }
}


/* =====================================================
   PAUSE
===================================================== */

function pauseGame(){

    paused=!paused;


    document.getElementById("pauseButton")
        .textContent=
        paused
        ?
        "Resume"
        :
        "Pause";


    if(paused){

        hideRange();

    } else if(selectedTower){

        showRange(
            selectedTower,
            selectedTower.x,
            selectedTower.y
        );
    }
}


/* =====================================================
   RESTART
===================================================== */

function restartGame(){

    startGame();
}


/* =====================================================
   MENU
===================================================== */

function backToMenu(){

    paused=true;

    hideRange();


    document.getElementById("gameScreen")
        .style.display="none";


    document.getElementById("menu")
        .style.display="block";
}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    roundRunning=false;
    paused=true;

    hideRange();


    document.getElementById("finalScore")
        .textContent=score;


    document.getElementById("gameOver")
        .style.display="block";
}


/* =====================================================
   MAIN LOOP
===================================================== */

function loop(time){

    let dt=
        (time-lastTime)/1000;


    lastTime=time;


    dt=Math.min(dt,.05);


    /*
       The speed multiplier is applied here.

       1x = normal
       2x = double
       3x = triple
       4x = quadruple
    */

    if(
        !paused &&
        document.getElementById(
            "gameScreen"
        ).style.display!=="none"
    ){

        const scaledDt=
            dt*gameSpeed;


        roundUpdate(scaledDt);

        enemyUpdate(scaledDt);

        towerUpdate(scaledDt);

        bulletUpdate(scaledDt);
    }


    requestAnimationFrame(loop);
}


/* =====================================================
   INITIALIZE
===================================================== */

showNoTowerSelected();

requestAnimationFrame(loop);

</script>
