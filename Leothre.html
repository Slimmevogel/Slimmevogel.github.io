<!DOCTYPE html>
<html>
<head>
<title>bullet</title>
</head>

<body>

<h2>bullet</h2>

<div>
Money: <span id="money">150</span>
&nbsp;
Lives: <span id="lives">20</span>
&nbsp;
Wave: <span id="wave">1</span>
&nbsp;
Score: <span id="score">0</span>
</div>

<br>

<button onclick="selectTower('basic')">Basic tower - $25</button>
<button onclick="selectTower('fast')">Fast tower - $45</button>
<button onclick="selectTower('strong')">Strong tower - $70</button>
<button onclick="selectTower('sniper')">Sniper - $100</button>
<button onclick="selectTower('slow')">Slow tower - $80</button>

<p>Selected: <span id="selected">basic</span></p>

<div id="game"
     style="
     position:relative;
     width:900px;
     height:600px;
     border:1px solid black;
     overflow:hidden;
     ">

    <!-- road -->
    <div style="
        position:absolute;
        left:0;
        top:270px;
        width:600px;
        height:80px;
        border-top:1px solid black;
        border-bottom:1px solid black;
    "></div>

    <div style="
        position:absolute;
        left:550px;
        top:150px;
        width:80px;
        height:160px;
        border-left:1px solid black;
        border-right:1px solid black;
    "></div>

    <div style="
        position:absolute;
        left:550px;
        top:120px;
        width:350px;
        height:80px;
        border-top:1px solid black;
        border-bottom:1px solid black;
    "></div>

</div>

<p>
Waves start automatically.
Click somewhere outside the road to build a tower.
</p>

<div id="gameover" style="display:none;">
    <h2>Game over</h2>
    Score: <span id="finalscore"></span>
    <br><br>
    <button onclick="location.reload()">Restart</button>
</div>


<script>

const game = document.getElementById("game");

let money = 150;
let lives = 20;
let wave = 1;
let score = 0;

let enemies = [];
let towers = [];
let bullets = [];

let selectedTower = "basic";

let waveTimer = 2;
let spawnTimer = 0;
let enemiesLeft = 0;

let lastTime = performance.now();


/* TOWER TYPES */

const towerTypes = {

    basic: {
        cost: 25,
        range: 160,
        damage: 20,
        reload: 0.7,
        bulletSpeed: 400,
        effect: "normal"
    },

    fast: {
        cost: 45,
        range: 140,
        damage: 10,
        reload: 0.22,
        bulletSpeed: 500,
        effect: "normal"
    },

    strong: {
        cost: 70,
        range: 180,
        damage: 55,
        reload: 1.4,
        bulletSpeed: 350,
        effect: "normal"
    },

    sniper: {
        cost: 100,
        range: 400,
        damage: 100,
        reload: 2.2,
        bulletSpeed: 800,
        effect: "normal"
    },

    slow: {
        cost: 80,
        range: 150,
        damage: 8,
        reload: 0.8,
        bulletSpeed: 350,
        effect: "slow"
    }

};


/* ENEMY TYPES */

const enemyTypes = [

    {
        name: "cat",
        hp: 40,
        speed: 70,
        reward: 8
    },

    {
        name: "dog",
        hp: 80,
        speed: 50,
        reward: 12
    },

    {
        name: "bird",
        hp: 30,
        speed: 110,
        reward: 10
    },

    {
        name: "mouse",
        hp: 20,
        speed: 145,
        reward: 7
    },

    {
        name: "dragon",
        hp: 300,
        speed: 25,
        reward: 50
    }

];


/* SELECT TOWER */

function selectTower(type) {

    selectedTower = type;

    document.getElementById("selected").textContent = type;
}


/* ROAD */

function onRoad(x, y) {

    if (
        y >= 250 &&
        y <= 370 &&
        x < 610
    ) {
        return true;
    }

    if (
        x >= 520 &&
        x <= 650 &&
        y >= 100 &&
        y <= 350
    ) {
        return true;
    }

    if (
        y >= 100 &&
        y <= 220 &&
        x >= 520
    ) {
        return true;
    }

    return false;
}


/* BUILD TOWERS */

game.addEventListener("click", function(event) {

    const rect = game.getBoundingClientRect();

    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;

    const type = towerTypes[selectedTower];

    if (money < type.cost) {
        return;
    }

    if (onRoad(x, y)) {
        return;
    }

    for (let tower of towers) {

        if (
            Math.hypot(
                tower.x - x,
                tower.y - y
            ) < 35
        ) {
            return;
        }
    }

    money -= type.cost;

    const element = document.createElement("span");

    element.textContent = "tower";

    element.style.position = "absolute";
    element.style.left = x + "px";
    element.style.top = y + "px";
    element.style.transform = "translate(-50%,-50%)";
    element.style.fontWeight = "bold";

    game.appendChild(element);

    towers.push({

        x: x,
        y: y,

        type: selectedTower,

        cooldown: 0,

        element: element

    });

    updateUI();

});


/* PATH */

function getPath(distance) {

    const first = 560;
    const vertical = 150;

    if (distance < first) {

        return {
            x: distance,
            y: 310
        };

    }

    if (distance < first + vertical) {

        return {
            x: 560,
            y: 310 - (distance - first)
        };

    }

    return {

        x: 560 + (distance - first - vertical),

        y: 160

    };

}


/* SPAWN ENEMY */

function spawnEnemy() {

    let type;

    let r = Math.random();

    if (wave >= 8 && r < 0.12) {

        type = enemyTypes[4];

    } else if (r < 0.30) {

        type = enemyTypes[3];

    } else if (r < 0.55) {

        type = enemyTypes[2];

    } else if (r < 0.80) {

        type = enemyTypes[1];

    } else {

        type = enemyTypes[0];

    }

    let hp =
        type.hp +
        wave * 8;

    const element =
        document.createElement("span");

    element.textContent = type.name;

    element.style.position = "absolute";
    element.style.color = "red";
    element.style.fontWeight = "bold";
    element.style.transform =
        "translate(-50%,-50%)";
    element.style.whiteSpace = "nowrap";

    game.appendChild(element);

    enemies.push({

        type: type,

        hp: hp,

        maxHp: hp,

        distance: 0,

        speed: type.speed,

        slow: 0,

        element: element

    });

}


/* AUTOMATIC WAVES */

function waveUpdate(dt) {

    if (enemiesLeft > 0) {

        spawnTimer -= dt;

        if (spawnTimer <= 0) {

            spawnEnemy();

            enemiesLeft--;

            spawnTimer = 0.35;

        }

        return;
    }

    if (enemies.length === 0) {

        waveTimer -= dt;

        if (waveTimer <= 0) {

            wave++;

            enemiesLeft =
                5 + wave * 2;

            spawnTimer = 0;

            waveTimer = 3;

            money += 15 + wave * 2;

            updateUI();

        }

    }

}


/* MOVE ENEMIES */

function updateEnemies(dt) {

    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        const enemy = enemies[i];

        let speed = enemy.speed;

        if (enemy.slow > 0) {

            speed *= 0.45;

            enemy.slow -= dt;

        }

        enemy.distance +=
            speed * dt;

        const position =
            getPath(enemy.distance);

        enemy.element.style.left =
            position.x + "px";

        enemy.element.style.top =
            position.y + "px";

        if (
            position.x >
            game.clientWidth + 50
        ) {

            enemy.element.remove();

            enemies.splice(i, 1);

            lives--;

            updateUI();

            if (lives <= 0) {

                endGame();

            }

        }

    }

}


/* TOWERS SHOOT */

function updateTowers(dt) {

    for (let tower of towers) {

        const data =
            towerTypes[tower.type];

        tower.cooldown -= dt;

        if (tower.cooldown > 0) {
            continue;
        }

        let target = null;

        let bestDistance = Infinity;

        for (let enemy of enemies) {

            const position =
                getPath(enemy.distance);

            const distance =
                Math.hypot(
                    position.x - tower.x,
                    position.y - tower.y
                );

            if (
                distance <= data.range &&
                distance < bestDistance
            ) {

                target = enemy;

                bestDistance =
                    distance;

            }

        }

        if (target) {

            fireBullet(
                tower,
                target
            );

            tower.cooldown =
                data.reload;

        }

    }

}


/* BULLETS */

function fireBullet(tower, target) {

    const data =
        towerTypes[tower.type];

    const element =
        document.createElement("span");

    element.textContent = "bullet";

    element.style.position = "absolute";
    element.style.fontSize = "11px";
    element.style.fontWeight = "bold";

    game.appendChild(element);

    bullets.push({

        x: tower.x,

        y: tower.y,

        target: target,

        speed: data.bulletSpeed,

        damage: data.damage,

        effect: data.effect,

        element: element

    });

}


/* UPDATE BULLETS */

function updateBullets(dt) {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet = bullets[i];

        if (!enemies.includes(bullet.target)) {

            bullet.element.remove();

            bullets.splice(i, 1);

            continue;

        }

        const targetPosition =
            getPath(
                bullet.target.distance
            );

        const dx =
            targetPosition.x -
            bullet.x;

        const dy =
            targetPosition.y -
            bullet.y;

        const distance =
            Math.hypot(dx, dy);

        const movement =
            bullet.speed * dt;

        if (distance <= movement) {

            damageEnemy(
                bullet.target,
                bullet.damage,
                bullet.effect
            );

            bullet.element.remove();

            bullets.splice(i, 1);

        } else {

            bullet.x +=
                dx / distance * movement;

            bullet.y +=
                dy / distance * movement;

            bullet.element.style.left =
                bullet.x + "px";

            bullet.element.style.top =
                bullet.y + "px";

        }

    }

}


/* DAMAGE */

function damageEnemy(
    enemy,
    damage,
    effect
) {

    enemy.hp -= damage;

    if (effect === "slow") {

        enemy.slow = 2;

    }

    if (enemy.hp <= 0) {

        money +=
            enemy.type.reward;

        score +=
            enemy.type.reward * 10;

        enemy.element.remove();

        const index =
            enemies.indexOf(enemy);

        if (index !== -1) {

            enemies.splice(
                index,
                1
            );

        }

        updateUI();

    }

}


/* UI */

function updateUI() {

    document.getElementById("money")
        .textContent = money;

    document.getElementById("lives")
        .textContent = lives;

    document.getElementById("wave")
        .textContent = wave;

    document.getElementById("score")
        .textContent = score;

}


/* GAME OVER */

function endGame() {

    document.getElementById("finalscore")
        .textContent = score;

    document.getElementById("gameover")
        .style.display = "block";

}


/* MAIN LOOP */

function loop(time) {

    let dt =
        (time - lastTime) / 1000;

    lastTime = time;

    dt = Math.min(dt, 0.05);

    waveUpdate(dt);

    updateEnemies(dt);

    updateTowers(dt);

    updateBullets(dt);

    requestAnimationFrame(loop);

}


/* START */

updateUI();

requestAnimationFrame(loop);

</script>

</body>
</html>
