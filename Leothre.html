/* =========================================================
                     TOWER BUTTONS
========================================================= */

function createTowerButtons(){

    const box=document.getElementById("towers");

    box.innerHTML="";

    for(const key in towerTypes){

        const type=towerTypes[key];

        const button=document.createElement("button");

        button.textContent=
            type.name+
            " ($"+
            type.cost+
            ")";

        button.onclick=function(){

            selectedTowerType=key;
            selectedTower=null;

            updateUI();

        };

        box.appendChild(button);

    }

}


/* =========================================================
                    MOUSE
========================================================= */

canvas.addEventListener("mousemove",function(e){

    const r=canvas.getBoundingClientRect();

    mouseX=e.clientX-r.left;
    mouseY=e.clientY-r.top;

});


canvas.addEventListener("click",function(e){

    if(!gameRunning||paused)return;

    const r=canvas.getBoundingClientRect();

    const x=e.clientX-r.left;
    const y=e.clientY-r.top;

    if(selectedTowerType){

        placeTower(x,y);

        return;

    }

    selectedTower=null;

    for(const t of towers){

        if(distance(x,y,t.x,t.y)<25){

            selectedTower=t;

            break;

        }

    }

    updateUI();

});


/* =========================================================
                    WATER / PATH
========================================================= */

function isWater(x,y){

    return water.some(function(z){

        return(
            x>z.x &&
            x<z.x+z.w &&
            y>z.y &&
            y<z.y+z.h
        );

    });

}


function pointSegmentDistance(px,py,x1,y1,x2,y2){

    const dx=x2-x1;
    const dy=y2-y1;

    if(dx===0&&dy===0)
        return distance(px,py,x1,y1);

    let t=
        ((px-x1)*dx+
        (py-y1)*dy)/
        (dx*dx+dy*dy);

    t=Math.max(0,Math.min(1,t));

    return distance(
        px,
        py,
        x1+t*dx,
        y1+t*dy
    );

}


function isPath(x,y){

    for(let i=0;i<path.length-1;i++){

        if(
            pointSegmentDistance(
                x,
                y,
                path[i][0],
                path[i][1],
                path[i+1][0],
                path[i+1][1]
            )<35
        ){

            return true;

        }

    }

    return false;

}


/* =========================================================
                     PLACE TOWER
========================================================= */

function rollTowerEffect(){

    let roll=Math.random();
    let total=0;

    for(const effect of towerEffects){

        total+=effect.chance;

        if(roll<total)
            return effect;

    }

    return null;

}


function placeTower(x,y){

    const type=towerTypes[selectedTowerType];

    if(!type)return;

    if(money<type.cost)return;

    const amount=
        towers.filter(t=>t.type===selectedTowerType).length;

    if(amount>=20){

        alert(
            "You can only have 20 "+
            type.name+
            " towers."
        );

        return;

    }

    if(type.water&&!isWater(x,y))
        return;

    if(type.land&&isWater(x,y))
        return;

    if(isPath(x,y))
        return;

    towers.push({

        type:selectedTowerType,

        x:x,
        y:y,

        level:[0,0,0],

        lastShot:0,

        incomeTimer:0,

        kills:0,

        effect:rollTowerEffect()

    });

    money-=type.cost;

    selectedTowerType=null;

    selectedTower=null;

    updateUI();

}


/* =========================================================
                     WAVES
========================================================= */

function startWave(){

    if(waveActive)return;

    wave++;

    spawnQueue=[];

    if(wave%10===0){

        spawnQueue.push({
            type:"boss"
        });

        for(
            let i=0;
            i<5+Math.floor(wave/5);
            i++
        ){

            spawnQueue.push({
                type:randomEnemy()
            });

        }

    }else{

        const amount=
            Math.floor(
                8+
                wave*2.4
            );

        for(let i=0;i<amount;i++){

            spawnQueue.push({
                type:randomEnemy()
            });

        }

    }

    waveActive=true;

    spawnTimer=0;

}


function randomEnemy(){

    const pool=["normal"];

    if(wave>=2)pool.push("speedy");
    if(wave>=3)pool.push("healthy");
    if(wave>=4)pool.push("armored");
    if(wave>=5)pool.push("bombonly");
    if(wave>=6)pool.push("iceproof");
    if(wave>=7)pool.push("camouflage");
    if(wave>=8)pool.push("regeneration");
    if(wave>=9)pool.push("shielded");
    if(wave>=11)pool.push("flying");
    if(wave>=12)pool.push("swarm");
    if(wave>=13)pool.push("splitter");
    if(wave>=14)pool.push("giant");
    if(wave>=15)pool.push("burning");
    if(wave>=16)pool.push("electricEnemy");

    let chosen=
        pool[
            Math.floor(
                Math.random()*pool.length
            )
        ];

    /*
       Special enemies remain rare.
       Normal enemies never display
       "normal" above them.
    */

    if(
        chosen!=="normal" &&
        Math.random()<.45
    ){

        chosen="normal";

    }

    return chosen;

}


/* =========================================================
                  ENEMY DAMAGE SCALING
========================================================= */

function towerDamageMultiplier(t){

    if(!t.effect)return 1;

    if(t.effect.name==="powerful")
        return 1.35;

    if(t.effect.name==="unstable")
        return 1.60;

    if(t.effect.name==="weak")
        return .75;

    return 1;

}


function towerFireRateMultiplier(t){

    if(
        t.effect &&
        t.effect.name==="rapid"
    ){

        return .70;

    }

    return 1;

}


function towerRangeMultiplier(t){

    let multiplier=1;

    if(!t.effect)return multiplier;

    if(t.effect.name==="long range")
        multiplier*=1.25;

    if(t.effect.name==="unstable")
        multiplier*=.80;

    return multiplier;

}


function towerIncomeMultiplier(t){

    if(
        t.effect &&
        t.effect.name==="wealthy"
    ){

        return 1.5;

    }

    return 1;

}


function getDamageScale(){

    let total=0;

    for(const t of towers){

        const type=towerTypes[t.type];

        if(!type.damage)continue;

        total+=
            type.damage*
            (1+t.level[0]*.35)*
            (1+t.level[1]*.2)*
            towerDamageMultiplier(t);

    }

    return 1+Math.min(3,total/100);

}


/* =========================================================
                    SPAWN ENEMY
========================================================= */

function spawnEnemy(typeName){

    const base=enemyTypes[typeName];
    const d=difficultyData[difficulty];

    let scale=
        1+
        Math.pow(wave,1.18)*.055;

    let hp=
        base.hp*
        d.enemyScale*
        scale*
        getDamageScale();

    if(base.boss){

        hp=
            1000*
            d.enemyScale*
            Math.pow(1.16,wave/10)*
            (1+wave*.12)*
            (1+getDamageScale()*.75);

    }

    enemies.push({

        type:typeName,

        x:path[0][0],
        y:path[0][1],

        pathIndex:0,

        hp:hp,
        maxHp:hp,

        speed:
            base.speed*
            d.enemySpeed*
            (1+wave*.008),

        reward:
            Math.round(
                base.reward*
                d.reward*
                (1+wave*.025)
            ),

        shield:base.shield||0,

        slow:1,

        dead:false,

        distanceTravelled:0,

        regenTimer:0

    });

}


/* =========================================================
                       UPDATE
========================================================= */

function update(dt){

    if(!gameRunning||paused)return;

    dt*=gameSpeed;

    if(waveActive){

        spawnTimer-=dt;

        if(
            spawnTimer<=0 &&
            spawnQueue.length>0
        ){

            spawnEnemy(
                spawnQueue.shift().type
            );

            spawnTimer=220;

        }

    }


    /*
       Farms ONLY generate money while
       a round is active.
    */

    if(waveActive){

        for(const t of towers){

            const type=towerTypes[t.type];

            if(!type.farm)continue;

            t.incomeTimer+=dt;

            if(t.incomeTimer>=1000){

                const times=
                    Math.floor(
                        t.incomeTimer/1000
                    );

                const income=
                    type.income*
                    (1+t.level[0]*.25)*
                    towerIncomeMultiplier(t);

                money+=income*times;

                t.incomeTimer%=1000;

            }

        }

    }


    updateEnemies(dt);

    updateTowers(dt);

    updateBullets(dt);

    updateVisualEffects(dt);


    if(
        waveActive &&
        spawnQueue.length===0 &&
        enemies.length===0
    ){

        waveActive=false;

        if(autoplay){

            setTimeout(function(){

                if(
                    gameRunning &&
                    autoplay &&
                    !waveActive
                ){

                    startWave();

                }

            },250);

        }

    }


    if(hp<=0){

        gameRunning=false;

        alert(
            "Game over.\n"+
            "You reached wave "+
            wave+"."
        );

        backToMenu();

    }

    updateUI();

}


/* =========================================================
                       ENEMIES
========================================================= */

function updateEnemies(dt){

    for(const e of enemies){

        if(e.dead)continue;

        const type=enemyTypes[e.type];

        if(type.regen){

            e.regenTimer+=dt;

            if(e.regenTimer>=1000){

                e.hp=
                    Math.min(
                        e.maxHp,
                        e.hp+
                        e.maxHp*.025
                    );

                e.regenTimer=0;

            }

        }

        const target=
            path[e.pathIndex+1];

        if(!target){

            e.dead=true;

            hp-=
                type.boss?
                20:
                1;

            continue;

        }

        let dx=target[0]-e.x;
        let dy=target[1]-e.y;

        const dist=
            Math.sqrt(
                dx*dx+
                dy*dy
            );

        if(dist<2){

            e.pathIndex++;

            continue;

        }

        dx/=dist;
        dy/=dist;

        const movement=
            e.speed*
            e.slow*
            dt*
            .08;

        e.x+=dx*movement;
        e.y+=dy*movement;

        e.distanceTravelled+=movement;

    }

    enemies=
        enemies.filter(
            e=>!e.dead
        );

}


/* =========================================================
                     TOWERS UPDATE
========================================================= */

function updateTowers(dt){

    for(const t of towers){

        const type=towerTypes[t.type];

        if(type.farm||type.support)
            continue;

        t.lastShot+=dt;

        const fireRate=
            type.fireRate*
            Math.pow(.9,t.level[1])*
            towerFireRateMultiplier(t);

        if(t.lastShot<fireRate)
            continue;

        const target=findTarget(t);

        if(!target)
            continue;

        t.lastShot=0;

        fireTower(t,target);

    }

}


/* =========================================================
                       TARGETING
========================================================= */

function findTarget(t){

    const type=towerTypes[t.type];

    const range=
        type.range*
        towerRangeMultiplier(t);

    let target=null;
    let furthest=-Infinity;

    for(const e of enemies){

        if(e.dead)continue;

        if(
            distance(
                t.x,
                t.y,
                e.x,
                e.y
            )>range
        ){

            continue;

        }

        if(
            enemyTypes[e.type].camo &&
            !canSeeCamo(t)
        ){

            continue;

        }

        if(
            enemyTypes[e.type].flying &&
            !canHitFlying(t)
        ){

            continue;

        }

        if(
            enemyTypes[e.type].bombOnly &&
            !type.bomb
        ){

            continue;

        }

        if(
            e.distanceTravelled>
            furthest
        ){

            furthest=
                e.distanceTravelled;

            target=e;

        }

    }

    return target;

}


function canSeeCamo(t){

    const type=towerTypes[t.type];

    if(type.camo)return true;

    if(t.level[1]>=2)
        return true;

    for(const s of towers){

        if(
            towerTypes[s.type].name==="sonar" &&
            distance(
                s.x,
                s.y,
                t.x,
                t.y
            )<=towerTypes[s.type].range
        ){

            return true;

        }

    }

    return false;

}


function canHitFlying(t){

    const type=towerTypes[t.type];

    return(
        !!type.antiAir ||
        t.level[0]>=2
    );

}


/* =========================================================
                    FIRE
========================================================= */

function fireTower(t,target){

    const type=towerTypes[t.type];

    const damage=
        type.damage*
        (1+t.level[0]*.35)*
        (1+t.level[1]*.20)*
        towerDamageMultiplier(t);

    bullets.push({

        x:t.x,
        y:t.y,

        target:target,

        damage:damage,

        type:type.projectile,

        splash:type.splash||0,

        slow:type.slow||0,

        tower:t

    });

}


/* =========================================================
                    BULLETS
========================================================= */

function updateBullets(dt){

    for(const b of bullets){

        if(
            !b.target ||
            b.target.dead
        ){

            b.dead=true;
            continue;

        }

        const dx=
            b.target.x-b.x;

        const dy=
            b.target.y-b.y;

        const dist=
            Math.sqrt(
                dx*dx+
                dy*dy
            );

        let speed=1;

        if(b.type==="laser")
            speed=2;

        if(b.type==="missile")
            speed=.75;

        if(b.type==="meteor")
            speed=.65;

        if(dist<8){

            hitEnemy(
                b,
                b.target
            );

            b.dead=true;

            continue;

        }

        b.x+=
            dx/dist*
            speed*
            dt;

        b.y+=
            dy/dist*
            speed*
            dt;

    }

    bullets=
        bullets.filter(
            b=>!b.dead
        );

}


/* =========================================================
                     HIT ENEMY
========================================================= */

function hitEnemy(b,e){

    if(e.dead)return;

    const type=enemyTypes[e.type];

    if(
        type.bombOnly &&
        !b.tower.type.includes("cannon") &&
        b.type!=="bomb" &&
        b.type!=="missile" &&
        b.type!=="meteor" &&
        b.type!=="nuke"
    ){

        textEffect(
            e.x,
            e.y-20,
            "immune"
        );

        return;

    }


    if(
        type.iceImmune &&
        b.type==="ice"
    ){

        textEffect(
            e.x,
            e.y-20,
            "ice immune"
        );

        return;

    }


    if(
        type.electricImmune &&
        b.type==="electric"
    ){

        textEffect(
            e.x,
            e.y-20,
            "electric immune"
        );

        return;

    }


    let damage=b.damage;

    if(
        type.armor &&
        ![
            "bomb",
            "missile",
            "meteor",
            "nuke"
        ].includes(b.type)
    ){

        damage=
            Math.max(
                1,
                damage*.25
            );

    }


    if(e.shield>0){

        const absorbed=
            Math.min(
                e.shield,
                damage
            );

        e.shield-=absorbed;

        damage-=absorbed;

    }


    if(damage>0)
        e.hp-=damage;


    if(
        b.slow &&
        !type.iceImmune
    ){

        e.slow=
            Math.min(
                e.slow,
                b.slow
            );

        setTimeout(function(){

            if(!e.dead)
                e.slow=1;

        },1200);

    }


    if(b.splash){

        for(const other of enemies){

            if(
                other===e ||
                other.dead
            )
                continue;

            if(
                distance(
                    e.x,
                    e.y,
                    other.x,
                    other.y
                )<=b.splash
            ){

                let splashDamage=
                    b.damage*.6;

                if(
                    enemyTypes[
                        other.type
                    ].armor
                ){

                    splashDamage*=.25;

                }

                other.hp-=splashDamage;

                if(other.hp<=0){

                    killEnemy(
                        other,
                        b.tower
                    );

                }

            }

        }

    }


    hitEffect(
        e.x,
        e.y,
        b.type
    );


    if(e.hp<=0){

        killEnemy(
            e,
            b.tower
        );

    }

}


function killEnemy(e,tower){

    if(e.dead)return;

    e.dead=true;

    money+=e.reward;

    if(tower)
        tower.kills++;


    if(
        enemyTypes[e.type].split
    ){

        for(let i=0;i<3;i++){

            const child=
                enemyTypes.swarm;

            enemies.push({

                type:"swarm",

                x:e.x+
                    Math.random()*16-8,

                y:e.y+
                    Math.random()*16-8,

                pathIndex:e.pathIndex,

                hp:child.hp,
                maxHp:child.hp,

                speed:child.speed,

                reward:child.reward,

                shield:0,

                slow:1,

                dead:false,

                distanceTravelled:
                    e.distanceTravelled,

                regenTimer:0

            });

        }

    }

}


/* =========================================================
                     UPGRADES

   These ONLY appear when a tower is selected.
========================================================= */

function upgradeTower(pathNumber){

    if(!selectedTower)
        return;

    const level=
        selectedTower.level[pathNumber];

    if(level>=5)
        return;

    const costs=[
        120,
        220,
        400,
        700,
        1200
    ];

    let cost=
        costs[level];

    if(pathNumber===2)
        cost*=1.4;

    cost=Math.floor(cost);

    if(money<cost)
        return;

    money-=cost;

    selectedTower.level[pathNumber]++;

    updateUI();

}


function sellTower(){

    if(!selectedTower)
        return;

    const type=
        towerTypes[
            selectedTower.type
        ];

    let value=
        type.cost*.7;

    const upgrades=
        selectedTower.level[0]+
        selectedTower.level[1]+
        selectedTower.level[2];

    value*=
        1+
        upgrades*.25;

    money+=Math.floor(value);

    towers=
        towers.filter(
            t=>t!==selectedTower
        );

    selectedTower=null;

    updateUI();

}


/* =========================================================
                   EFFECTS
========================================================= */

function hitEffect(x,y,type){

    visualEffects.push({

        type:"hit",
        x:x,
        y:y,
        radius:5,
        life:250,
        maxLife:250,
        projectile:type

    });

}


function textEffect(x,y,text){

    visualEffects.push({

        type:"text",
        x:x,
        y:y,
        text:text,
        life:700,
        maxLife:700

    });

}


function updateVisualEffects(dt){

    for(const e of visualEffects){

        e.life-=dt;

        if(e.type==="hit")
            e.radius+=dt*.04;

        if(e.type==="text")
            e.y-=dt*.025;

    }

    visualEffects=
        visualEffects.filter(
            e=>e.life>0
        );

}


/* =========================================================
                       SELL / UI
========================================================= */

function updateUI(){

    document.getElementById("money").textContent=
        "Money: "+
        Math.floor(money);

    document.getElementById("hp").textContent=
        "HP: "+
        Math.floor(hp);

    document.getElementById("wave").textContent=
        "Wave: "+
        wave;


    const upgrades=
        document.getElementById(
            "upgradeBox"
        );

    const sell=
        document.getElementById(
            "sellButton"
        );


    if(selectedTower){

        upgrades.style.display="flex";
        sell.style.display="inline-block";

        const type=
            towerTypes[
                selectedTower.type
            ];

        let text=
            "Selected: "+
            type.name+
            " | levels "+
            selectedTower.level.join("-");


        if(selectedTower.effect){

            text+=
                " | "+
                selectedTower.effect.name+
                ": "+
                selectedTower.effect.description;

        }


        document.getElementById(
            "selected"
        ).textContent=text;


        const costs=[
            120,
            220,
            400,
            700,
            1200
        ];


        for(let i=0;i<3;i++){

            const button=
                document.getElementById(
                    "upgrade"+i
                );

            const level=
                selectedTower.level[i];


            if(level>=5){

                button.textContent=
                    i===2?
                    "Ability MAX":
                    "Path "+(i+1)+" MAX";

                button.disabled=true;

            }else{

                let cost=
                    costs[level];

                if(i===2)
                    cost*=1.4;

                cost=Math.floor(cost);

                button.textContent=
                    i===2?
                    "Ability $"+cost:
                    "Path "+(i+1)+" $"+cost;

                button.disabled=
                    money<cost;

            }

        }

    }else{

        upgrades.style.display="none";
        sell.style.display="none";

        if(selectedTowerType){

            document.getElementById(
                "selected"
            ).textContent=
                "Placing: "+
                towerTypes[
                    selectedTowerType
                ].name;

        }else{

            document.getElementById(
                "selected"
            ).textContent="";

        }

    }

}


/* =========================================================
                      PAUSE / AUTO
========================================================= */

function togglePause(){

    if(!gameRunning)return;

    paused=!paused;

}


function toggleAutoplay(){

    autoplay=!autoplay;

    document.getElementById(
        "auto"
    ).textContent=
        autoplay?
        "ON":
        "OFF";

}


/* =========================================================
                         DRAW
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBackground();

    drawWater();

    drawPath();

    drawTowers();

    drawEnemies();

    drawBullets();

    drawEffects();

    if(paused){

        ctx.font="42px Arial";

        ctx.fillText(
            "PAUSED",
            650,
            400
        );

    }

}


/* =========================================================
                    BACKGROUND
========================================================= */

function drawBackground(){

    ctx.fillStyle="white";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}


/* =========================================================
                        WATER
========================================================= */

function drawWater(){

    ctx.strokeStyle="black";
    ctx.fillStyle="white";

    for(const z of water){

        ctx.strokeRect(
            z.x,
            z.y,
            z.w,
            z.h
        );

        ctx.font="16px Arial";

        ctx.fillText(
            "water",
            z.x+10,
            z.y+22
        );

    }

}


/* =========================================================
                         PATH

   Large, clean and clearly separated.
========================================================= */

function drawPath(){

    ctx.lineCap="round";
    ctx.lineJoin="round";

    ctx.beginPath();

    ctx.moveTo(
        path[0][0],
        path[0][1]
    );

    for(let i=1;i<path.length;i++){

        ctx.lineTo(
            path[i][0],
            path[i][1]
        );

    }

    ctx.lineWidth=54;
    ctx.strokeStyle="black";
    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        path[0][0],
        path[0][1]
    );

    for(let i=1;i<path.length;i++){

        ctx.lineTo(
            path[i][0],
            path[i][1]
        );

    }

    ctx.lineWidth=46;
    ctx.strokeStyle="white";
    ctx.stroke();


    ctx.lineCap="butt";
    ctx.lineJoin="miter";

}


/* =========================================================
                        TOWERS

   Range circle + separate physical
   hitbox circle appear on selection.
========================================================= */

function drawTowers(){

    ctx.textAlign="center";

    for(const t of towers){

        const type=
            towerTypes[t.type];


        if(selectedTower===t){

            /*
              RANGE
            */

            ctx.beginPath();

            ctx.arc(
                t.x,
                t.y,
                type.range*
                towerRangeMultiplier(t),
                0,
                Math.PI*2
            );

            ctx.stroke();


            /*
              HITBOX
            */

            ctx.beginPath();

            ctx.arc(
                t.x,
                t.y,
                22,
                0,
                Math.PI*2
            );

            ctx.stroke();

        }


        ctx.font="16px Arial";

        ctx.fillText(
            type.name,
            t.x,
            t.y+5
        );


        if(t.effect){

            ctx.font="11px Arial";

            ctx.fillText(
                t.effect.name,
                t.x,
                t.y-15
            );

        }


        /*
          Ability visual.
        */

        if(t.level[2]>0){

            ctx.beginPath();

            ctx.arc(
                t.x,
                t.y,
                28+
                t.level[2]*4,
                0,
                Math.PI*2
            );

            ctx.stroke();

        }

    }

    ctx.textAlign="left";

}


/* =========================================================
                       ENEMIES

   Normal enemies have NO type text above them.
   Special enemies do.
========================================================= */

function drawEnemies(){

    ctx.textAlign="center";

    for(const e of enemies){

        const type=
            enemyTypes[e.type];


        ctx.font=
            Math.max(
                12,
                type.size
            )+
            "px Arial";


        /*
          The main enemy name.
        */

        let enemyName="enemy";

        if(e.type==="flying")
            enemyName="flying";

        if(e.type==="giant")
            enemyName="giant";

        if(e.type==="swarm")
            enemyName="swarm";

        if(e.type==="boss")
            enemyName="BOSS";


        /*
          Animals/creatures are described
          by their function/effect rather
          than simply being called by animal name.
        */

        ctx.fillText(
            enemyName,
            e.x,
            e.y
        );


        /*
          Special type above the enemy.
          NORMAL has no text here.
        */

        if(e.type!=="normal"){

            ctx.font="12px Arial";

            ctx.fillText(
                type.name,
                e.x,
                e.y-type.size-6
            );

        }


        /*
          HP bar
        */

        ctx.strokeRect(
            e.x-20,
            e.y+11,
            40,
            4
        );

        ctx.fillRect(
            e.x-20,
            e.y+11,
            40*
            Math.max(
                0,
                e.hp/e.maxHp
            ),
            4
        );


        /*
          Boss bar
        */

        if(type.boss){

            ctx.strokeRect(
                e.x-60,
                e.y-65,
                120,
                8
            );

            ctx.fillRect(
                e.x-60,
                e.y-65,
                120*
                Math.max(
                    0,
                    e.hp/e.maxHp
                ),
                8
            );

        }


        /*
          Shield
        */

        if(e.shield>0){

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                type.size+7,
                0,
                Math.PI*2
            );

            ctx.stroke();

        }

    }

    ctx.textAlign="left";

}


/* =========================================================
                       BULLETS
========================================================= */

function drawBullets(){

    ctx.textAlign="center";

    for(const b of bullets){

        ctx.font="12px Arial";

        ctx.fillText(
            b.type,
            b.x,
            b.y
        );

    }

    ctx.textAlign="left";

}


/* =========================================================
                      EFFECTS
========================================================= */

function drawEffects(){

    for(const e of visualEffects){

        ctx.globalAlpha=
            e.life/e.maxLife;


        if(e.type==="hit"){

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                e.radius,
                0,
                Math.PI*2
            );

            ctx.stroke();

        }else{

            ctx.font="13px Arial";

            ctx.fillText(
                e.text,
                e.x,
                e.y
            );

        }


        ctx.globalAlpha=1;

    }

}


/* =========================================================
                 PLACEMENT PREVIEW

   The range circle and hitbox circle
   are also shown while placing.
========================================================= */

function drawPlacementPreview(){

    if(!selectedTowerType)
        return;

    const type=
        towerTypes[
            selectedTowerType
        ];


    ctx.globalAlpha=.6;


    /*
      Range
    */

    ctx.beginPath();

    ctx.arc(
        mouseX,
        mouseY,
        type.range,
        0,
        Math.PI*2
    );

    ctx.stroke();


    /*
      Hitbox
    */

    ctx.beginPath();

    ctx.arc(
        mouseX,
        mouseY,
        22,
        0,
        Math.PI*2
    );

    ctx.stroke();


    ctx.font="14px Arial";

    ctx.fillText(
        type.name,
        mouseX,
        mouseY
    );


    ctx.globalAlpha=1;

}


/* =========================================================
                      HELPERS
========================================================= */

function distance(
    x1,
    y1,
    x2,
    y2
){

    const dx=x2-x1;
    const dy=y2-y1;

    return Math.sqrt(
        dx*dx+
        dy*dy
    );

}


/* =========================================================
                       KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key===" ")
            togglePause();

        if(
            e.key.toLowerCase()==="r" &&
            gameRunning
        )
            restartGame();

        if(
            e.key==="Enter" &&
            gameRunning
        )
            startWave();

    }
);


/* =========================================================
                       GAME LOOP
========================================================= */

function gameLoop(now){

    const dt=
        Math.min(
            50,
            now-lastTime
        );

    lastTime=now;

    update(dt);

    draw();

    drawPlacementPreview();

    requestAnimationFrame(
        gameLoop
    );

}


updateMenu();

requestAnimationFrame(
    gameLoop
);

</script>
