<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>letter defense</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #080b10;
        color: #d9e2ec;
        font-family: "Courier New", monospace;
        overflow: hidden;
    }

    #game {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    #topbar {
        height: 70px;
        border-bottom: 1px solid #27313c;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 25px;
        background: #0d1218;
    }

    #title {
        font-size: 24px;
        color: #ffffff;
        font-weight: bold;
    }

    #stats {
        display: flex;
        gap: 25px;
        font-size: 16px;
    }

    .stat {
        color: #91a4b8;
    }

    .value {
        color: white;
        font-weight: bold;
    }

    #main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 15px;
    }

    #field {
        position: relative;
        width: min(1000px, 92vw);
        height: min(650px, 75vh);
        border: 1px solid #35414d;
        background: #0b1016;
        overflow: hidden;
        cursor: crosshair;
    }

    /* The path */
    .path {
        position: absolute;
        color: #27323d;
        font-size: 16px;
        white-space: pre;
        pointer-events: none;
        user-select: none;
    }

    #path1 {
        left: 0;
        top: 45%;
        width: 100%;
        height: 90px;
        border-top: 1px dashed #303b46;
        border-bottom: 1px dashed #303b46;
    }

    #path2 {
        left: 55%;
        top: 20%;
        width: 120px;
        height: 55%;
        border-left: 1px dashed #303b46;
        border-right: 1px dashed #303b46;
    }

    #path3 {
        position: absolute;
        left: 55%;
        top: 20%;
        width: 35%;
        height: 90px;
        border-top: 1px dashed #303b46;
        border-bottom: 1px dashed #303b46;
    }

    .tower {
        position: absolute;
        width: 42px;
        height: 42px;
        color: #65d6ff;
        font-size: 24px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translate(-50%, -50%);
        z-index: 10;
        cursor: pointer;
        user-select: none;
    }

    .tower:hover {
        color: white;
        text-shadow: 0 0 10px #65d6ff;
    }

    .tower::after {
        content: "tower";
        position: absolute;
        top: 30px;
        font-size: 9px;
        color: #4c6575;
        font-weight: normal;
    }

    .enemy {
        position: absolute;
        transform: translate(-50%, -50%);
        color: #ff7979;
        font-size: 14px;
        font-weight: bold;
        white-space: nowrap;
        z-index: 5;
        pointer-events: none;
        text-shadow: 0 0 4px #000;
    }

    .enemy.boss {
        color: #ffb86c;
        font-size: 18px;
    }

    .hp {
        position: absolute;
        bottom: -9px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 3px;
        background: #222;
    }

    .hpFill {
        height: 100%;
        background: #80ff80;
        width: 100%;
    }

    .bullet {
        position: absolute;
        color: #ffff8a;
        font-size: 11px;
        font-weight: bold;
        pointer-events: none;
        z-index: 8;
        white-space: nowrap;
    }

    #message {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #758494;
        text-align: center;
        pointer-events: none;
        font-size: 13px;
        line-height: 1.7;
    }

    #controls {
        height: 75px;
        border-top: 1px solid #27313c;
        background: #0d1218;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
    }

    button {
        font-family: "Courier New", monospace;
        background: #131b23;
        color: #cdd8e3;
        border: 1px solid #3a4652;
        padding: 10px 16px;
        cursor: pointer;
    }

    button:hover {
        background: #1b2630;
        border-color: #65d6ff;
        color: white;
    }

    button.selected {
        border-color: #65d6ff;
        color: #65d6ff;
    }

    #gameOver {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(5, 7, 10, 0.88);
        z-index: 100;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    #gameOver h1 {
        font-size: 36px;
        margin-bottom: 10px;
    }

    #gameOver p {
        color: #8c9aaa;
    }

    #gameOver button {
        margin-top: 20px;
    }

    #waveText {
        position: absolute;
        right: 12px;
        top: 10px;
        color: #566675;
        font-size: 12px;
        z-index: 20;
        pointer-events: none;
    }
</style>
</head>

<body>

<div id="game">

    <div id="topbar">
        <div id="title">letter defense</div>

        <div id="stats">
            <div class="stat">money: <span class="value" id="money">100</span></div>
            <div class="stat">lives: <span class="value" id="lives">10</span></div>
            <div class="stat">wave: <span class="value" id="wave">1</span></div>
            <div class="stat">score: <span class="value" id="score">0</span></div>
        </div>
    </div>

    <div id="main">

        <div id="field">

            <div id="path1" class="path"></div>
            <div id="path2" class="path"></div>
            <div id="path3" class="path"></div>

            <div id="waveText">click to place towers</div>

            <div id="message">
                defend the base<br>
                enemies enter from the left<br>
                click the map to place a tower
            </div>

            <div id="gameOver">
                <div>
                    <h1>game over</h1>
                    <p>the letters reached the base.</p>
                    <p>score: <span id="finalScore">0</span></p>
                    <button onclick="restart()">restart</button>
                </div>
            </div>

        </div>

    </div>

    <div id="controls">
        <button id="basicButton" class="selected" onclick="selectTower('basic')">
            T — tower ($25)
        </button>

        <button onclick="startWave()">
            start wave
        </button>

        <button onclick="speedUp()">
            speed ×2
        </button>
    </div>

</div>

<script>
/*
    LETTER DEFENSE
    ----------------

    Everything is text.

    Towers = T
    Enemies = words
    Bullets = "bullet"

    No images are used.
*/

const field = document.getElementById("field");

const moneyElement = document.getElementById("money");
const livesElement = document.getElementById("lives");
const waveElement = document.getElementById("wave");
const scoreElement = document.getElementById("score");

const gameOverScreen = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");

let money = 100;
let lives = 10;
let wave = 1;
let score = 0;

let towers = [];
let enemies = [];
let bullets = [];

let waveRunning = false;
let enemiesToSpawn = 0;
let spawnTimer = 0;

let selectedTower = "basic";

let lastTime = performance.now();

let gameSpeed = 1;


/* ----------------------------------
   PATH
---------------------------------- */

function getPathPosition(distance) {

    const w = field.clientWidth;
    const h = field.clientHeight;

    /*
        Enemy route:

        left
          |
          v
        ------>
              |
              |
              +------>
    */

    const horizontalY = h * 0.495;
    const verticalX = w * 0.61;
    const finalY = h * 0.245;

    const firstLength = verticalX;
    const secondLength = h * 0.25;
    const thirdLength = w * 0.35;

    if (distance < firstLength) {

        return {
            x: distance,
            y: horizontalY
        };

    } else if (distance < firstLength + secondLength) {

        return {
            x: verticalX,
            y: horizontalY - (distance - firstLength)
        };

    } else {

        return {
            x: verticalX + (distance - firstLength - secondLength),
            y: finalY
        };

    }
}


/* ----------------------------------
   ENEMIES
---------------------------------- */

const enemyTypes = [
    {
        name: "cat",
        hp: 35,
        speed: 45,
        reward: 8
    },
    {
        name: "dog",
        hp: 60,
        speed: 35,
        reward: 12
    },
    {
        name: "bird",
        hp: 25,
        speed: 75,
        reward: 10
    },
    {
        name: "dragon",
        hp: 180,
        speed: 22,
        reward: 30
    }
];

function createEnemy() {

    let type;

    const random = Math.random();

    if (wave >= 5 && random < 0.15) {
        type = enemyTypes[3];
    } else if (random < 0.35) {
        type = enemyTypes[2];
    } else if (random < 0.65) {
        type = enemyTypes[1];
    } else {
        type = enemyTypes[0];
    }

    const enemy = {

        type: type,

        hp: type.hp + wave * 5,

        maxHp: type.hp + wave * 5,

        speed: type.speed,

        distance: 0,

        element: document.createElement("div")

    };

    enemy.element.className =
        "enemy" + (type.name === "dragon" ? " boss" : "");

    enemy.element.textContent = type.name;

    enemy.element.innerHTML =
        type.name +
        '<div class="hp"><div class="hpFill"></div></div>';

    field.appendChild(enemy.element);

    enemies.push(enemy);
}


/* ----------------------------------
   TOWERS
---------------------------------- */

function selectTower(type) {

    selectedTower = type;

    document
        .getElementById("basicButton")
        .classList.toggle("selected", type === "basic");
}


field.addEventListener("click", function(event) {

    if (gameOverScreen.style.display === "flex") return;

    /*
        Don't place towers on the UI overlay.
    */

    const rect = field.getBoundingClientRect();

    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;

    const cost = 25;

    if (money < cost) return;

    /*
        Keep towers away from the actual road.
    */

    if (isOnPath(x, y)) {
        return;
    }

    /*
        Don't stack towers.
    */

    for (const tower of towers) {

        const dx = tower.x - x;
        const dy = tower.y - y;

        if (Math.sqrt(dx * dx + dy * dy) < 45) {
            return;
        }
    }

    money -= cost;

    const tower = {

        x: x,
        y: y,

        range: 180,

        fireRate: 0.7,

        cooldown: 0,

        damage: 20,

        element: document.createElement("div")
    };

    tower.element.className = "tower";
    tower.element.textContent = "T";

    tower.element.style.left = x + "px";
    tower.element.style.top = y + "px";

    field.appendChild(tower.element);

    towers.push(tower);

    updateUI();
});


function isOnPath(x, y) {

    const w = field.clientWidth;
    const h = field.clientHeight;

    const horizontalY = h * 0.495;
    const verticalX = w * 0.61;
    const finalY = h * 0.245;

    if (
        y > horizontalY - 50 &&
        y < horizontalY + 50
    ) {
        return true;
    }

    if (
        x > verticalX - 60 &&
        x < verticalX + 60 &&
        y > finalY &&
        y < horizontalY
    ) {
        return true;
    }

    if (
        y > finalY - 50 &&
        y < finalY + 50 &&
        x > verticalX
    ) {
        return true;
    }

    return false;
}


/* ----------------------------------
   BULLETS
---------------------------------- */

function fireBullet(tower, enemy) {

    const bullet = {

        x: tower.x,
        y: tower.y,

        target: enemy,

        speed: 400,

        damage: tower.damage,

        element: document.createElement("div")
    };

    bullet.element.className = "bullet";

    /*
        The projectile is literally called "bullet".
    */

    bullet.element.textContent = "bullet";

    field.appendChild(bullet.element);

    bullets.push(bullet);
}


/* ----------------------------------
   WAVE
---------------------------------- */

function startWave() {

    if (waveRunning) return;

    waveRunning = true;

    enemiesToSpawn = 5 + wave * 2;

    spawnTimer = 0;

    document.getElementById("waveText").textContent =
        "wave " + wave;
}


function updateWave(delta) {

    if (!waveRunning) return;

    spawnTimer -= delta;

    if (
        enemiesToSpawn > 0 &&
        spawnTimer <= 0
    ) {

        createEnemy();

        enemiesToSpawn--;

        spawnTimer = 0.7;
    }

    if (
        enemiesToSpawn <= 0 &&
        enemies.length === 0
    ) {

        waveRunning = false;

        money += 20 + wave * 3;

        wave++;

        updateUI();
    }
}


/* ----------------------------------
   TOWER AI
---------------------------------- */

function updateTowers(delta) {

    for (const tower of towers) {

        tower.cooldown -= delta;

        if (tower.cooldown > 0) {
            continue;
        }

        let closest = null;
        let closestDistance = Infinity;

        for (const enemy of enemies) {

            const pos = getPathPosition(enemy.distance);

            const dx = pos.x - tower.x;
            const dy = pos.y - tower.y;

            const distance =
                Math.sqrt(dx * dx + dy * dy);

            if (
                distance <= tower.range &&
                distance < closestDistance
            ) {

                closest = enemy;
                closestDistance = distance;
            }
        }

        if (closest) {

            fireBullet(tower, closest);

            tower.cooldown = tower.fireRate;
        }
    }
}


/* ----------------------------------
   BULLET UPDATE
---------------------------------- */

function updateBullets(delta) {

    for (let i = bullets.length - 1; i >= 0; i--) {

        const bullet = bullets[i];

        if (!enemies.includes(bullet.target)) {

            bullet.element.remove();

            bullets.splice(i, 1);

            continue;
        }

        const targetPos =
            getPathPosition(bullet.target.distance);

        const dx = targetPos.x - bullet.x;
        const dy = targetPos.y - bullet.y;

        const distance =
            Math.sqrt(dx * dx + dy * dy);

        const movement =
            bullet.speed * delta;

        if (distance <= movement) {

            bullet.x = targetPos.x;
            bullet.y = targetPos.y;

            damageEnemy(
                bullet.target,
                bullet.damage
            );

            bullet.element.remove();

            bullets.splice(i, 1);

        } else {

            bullet.x += dx / distance * movement;
            bullet.y += dy / distance * movement;

            bullet.element.style.left =
                bullet.x + "px";

            bullet.element.style.top =
                bullet.y + "px";
        }
    }
}


/* ----------------------------------
   DAMAGE
---------------------------------- */

function damageEnemy(enemy, damage) {

    enemy.hp -= damage;

    const hp =
        enemy.element.querySelector(".hpFill");

    hp.style.width =
        Math.max(
            0,
            enemy.hp / enemy.maxHp * 100
        ) + "%";

    if (enemy.hp <= 0) {

        money += enemy.type.reward;

        score += enemy.type.reward * 10;

        enemy.element.remove();

        const index =
            enemies.indexOf(enemy);

        if (index !== -1) {
            enemies.splice(index, 1);
        }

        updateUI();
    }
}


/* ----------------------------------
   ENEMY MOVEMENT
---------------------------------- */

function updateEnemies(delta) {

    const w = field.clientWidth;

    for (let i = enemies.length - 1; i >= 0; i--) {

        const enemy = enemies[i];

        enemy.distance +=
            enemy.speed * delta;

        const pos =
            getPathPosition(enemy.distance);

        enemy.element.style.left =
            pos.x + "px";

        enemy.element.style.top =
            pos.y + "px";

        /*
            End of the path.
        */

        if (pos.x > w + 80) {

            enemy.element.remove();

            enemies.splice(i, 1);

            lives--;

            updateUI();

            if (lives <= 0) {
                endGame();
            }
        }
    }
}


/* ----------------------------------
   GAME LOOP
---------------------------------- */

function gameLoop(now) {

    let delta =
        (now - lastTime) / 1000;

    lastTime = now;

    /*
        Prevent huge jumps if the tab
        was inactive.
    */

    delta =
        Math.min(delta, 0.05);

    delta *= gameSpeed;

    updateWave(delta);

    updateEnemies(delta);

    updateTowers(delta);

    updateBullets(delta);

    requestAnimationFrame(gameLoop);
}


/* ----------------------------------
   UI
---------------------------------- */

function updateUI() {

    moneyElement.textContent = money;

    livesElement.textContent = lives;

    waveElement.textContent = wave;

    scoreElement.textContent = score;
}


/* ----------------------------------
   GAME OVER
---------------------------------- */

function endGame() {

    gameOverScreen.style.display = "flex";

    finalScore.textContent = score;
}


function restart() {

    /*
        Remove everything.
    */

    for (const tower of towers) {
        tower.element.remove();
    }

    for (const enemy of enemies) {
        enemy.element.remove();
    }

    for (const bullet of bullets) {
        bullet.element.remove();
    }

    towers = [];
    enemies = [];
    bullets = [];

    money = 100;
    lives = 10;
    wave = 1;
    score = 0;

    waveRunning = false;

    gameSpeed = 1;

    gameOverScreen.style.display = "none";

    updateUI();
}


/* ----------------------------------
   SPEED
---------------------------------- */

function speedUp() {

    if (gameSpeed === 1) {
        gameSpeed = 2;
    } else {
        gameSpeed = 1;
    }
}


/* ----------------------------------
   START
---------------------------------- */

updateUI();

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
